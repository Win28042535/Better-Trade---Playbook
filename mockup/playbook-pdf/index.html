/* Ver.2 analysis: chapter opener whose lower half holds the risk comparison as two big numerals (the
   declared one struck through only when they differ), then Confidence Score as a data block —
   big score, level as its heading, the 4 parts as ruled rows (value/max, share as a thin ink rule).
   Same texts as insightHTML(); no boxes, glow or coloured bars. */
function pbxAnalysisHTML(r,h,matchOk){
  var cf=confidenceScore(r);
  var risk='<div class="pbx-risk"><div class="pbx-side-hd"><div class="pbx-side-t">ความเสี่ยง "บอก" vs "จริง"</div><span class="pbx-side-st">'+(matchOk?'ตรงกัน':('ต่างกัน '+(r.gap>0?'+':'')+r.gap))+'</span></div>'+
    '<p class="pbx-data-note">ระดับความเสี่ยง 1–10</p>'+
    '<p class="pbx-side-b">'+(matchOk?'ความเสี่ยงที่ประเมินตัวเองกับพฤติกรรมจริงไปในทิศทางเดียวกัน':'ความเสี่ยงที่คุณ "บอก" กับพฤติกรรมจริงต่างกันอยู่บ้าง รู้ gap นี้ช่วยให้วางแผนได้แม่นขึ้น')+'</p>'+
    '<div class="pbx-pair"><div><b class="pbx-big'+(r.declared!==r.revealed?' pbx-was':'')+'">'+r.declared+'</b><span>ความเสี่ยงที่บอก</span></div><div><b class="pbx-big">'+r.revealed+'</b><span>ความเสี่ยงจริง</span></div></div></div>';
  var parts=[['ความรู้',cf.subs.knowledge,35],['รู้จักตัวเอง',cf.subs.self,25],['ลงมือ',cf.subs.action,25],['ความกว้าง',cf.subs.breadth,15]];
  var conf='<section class="pbx-block pbx-conf"><div class="pbx-conf-hd"><div><div class="pbx-kicker">Confidence Score</div><h3 class="pbx-blk-t">'+cf.level+'</h3></div><div class="pbx-score"><b>'+cf.conf+'</b><span>/100</span></div></div>'+
    '<p class="pbx-data-note">บอกว่าระบบมีหลักฐานมากพอจะอ่านคุณแค่ไหน ไม่ใช่ผลตอบแทน — ยิ่งเล่นเกมและเดินบูธมาก คะแนนยิ่งเต็ม</p>'+
    '<div class="pbx-data">'+parts.map(function(c){return pbxRow(c[0],'<b>'+c[1]+'</b>/'+c[2],Math.round(c[1]/c[2]*100));}).join('')+'</div></section>';
  return pbxOpenHTML(['วิเคราะห์',['AI','Insight']],'คุณเป็น <span>นักลงทุน</span> แบบไหน','',risk+conf); // Confidence rides on the same sheet as the risk comparison
}

   title from ~14% down to a full-width hairline at ~41%, then a split row: a narrow text column (family +
   signature) beside the card, which plays the reference's photo. The rest follows on text pages:
   preferred assets as a ruled list, strengths | watch-outs as two columns, SKILL as data rows + its note.
   No brand-asset scatter, icons, grey panel, boxes or coloured bars. The title keeps .s-h, and its text
   is the same persona name สารบัญ already used for this sheet. unreg (a visitor who never registered)
   stops after strengths / watch-outs, as before, and gets the register call instead of SKILL — same

/* Pre-event vs post-event card (2026-10-08, per direction: the card from before the event and the one after it may
   not be the same persona). Restores v1's evoCompute() decision: once there is enough on-event evidence (a game
   played and 3 of 6 activity signals) AND the declared-vs-revealed risk gap is 2+ points, the persona moves to the
   G family (did less risk than declared) or V (did more), shown by that family's flagship (EVO_REP). States:
   'none' (no on-event activity yet: no post-event sheet at all), 'same' (a one-line note on the pre-event sheet),
   'evolved' (its own post-event sheet after the identity chapter). DEMO.sampleEvolve swaps in an illustrative shift
   when the real data does not move, tagged "ตัวอย่าง", so the sample book shows the sheet. */
var EVO_REP={G:'diamondhand',N:'planner',V:'waverider'};
function pbxEvo(r){
  var played=gamesPlayedCount(),chk=0,act=boothActivityCount(),k;
  for(k in BOOTH_CHK)if(BOOTH_CHK[k]&&BOOTH_CHK[k].size)chk++;
  if(!played&&!chk&&!act)return {state:'none'};
  var sig=[played>=1,chk>=1,act>=1,(r.interests||[]).length>=1,played>=4,act>=ACTIVITY_NEED].filter(Boolean).length;
  var fam=r.hero.fam,to=(played>=1&&sig>=3&&Math.abs(r.gap)>=2)?(r.gap>=2?'V':'G'):fam,sample=false;
  if(to===fam&&DEMO.sampleEvolve){to=fam==='V'?'G':'V';sample=true;}
  if(to===fam)return {state:'same'};
  return {state:'evolved',key:EVO_REP[to],hero:HEROES[EVO_REP[to]],up:to==='V',sample:sample};
}

  cx.font='500 '+LOCK.capsFs+'px Cinzel';if('letterSpacing' in cx)cx.letterSpacing=(.42*LOCK.capsFs)+'px';
  var mc=cx.measureText(caps),cM=cx.measureText('M');

  cx.letterSpacing='0px';cx.font='400 '+LOCK.scrFs+'px "Pinyon Script"';

var MINIGAME_Q=[{"questions":[{},{},{}]},{"questions":[{"insight":"ข่าวและกระแสเป็นสิ่งล่อ ไม่ใช่ข้อมูลที่ใช้ตัดสินใจ · งบการเงินบอกสุขภาพของธุรกิจ"},{"insight":"ของที่พื้นฐานมั่นคงมักไม่หวือหวาและไม่เป็นข่าว · การซื้อผ่านกองทุนหรือทยอยซื้อ คือการกระจายแทนการเลือกตัวเดียว"}]},{"questions":[{"insight":"ความกลัวตกขบวนทำให้เราซื้อเพราะ \"คนอื่นซื้อ\" ไม่ใช่เพราะเข้าใจของ"},{"insight":"สัญญาณหลอกลงทุน 3 อย่าง การันตีผลตอบแทน · เร่งให้รีบตัดสินใจ · ไม่มีใบอนุญาต"},{}]},{"questions":[{"insight":"ยิ่งมีเวลานาน ยิ่งมีเวลารอให้ของฟื้นตัว"},{"insight":"เงินที่จะใช้เร็วกับเงินที่ใช้อีกนาน ควรเก็บคนละแบบ"},{"insight":"ยิ่งใกล้วันที่ต้องใช้เงิน ยิ่งเหลือเวลารอให้ฟื้นน้อยลง"},{"insight":"วิธีถอนเงินมาใช้หลังเกษียณ สำคัญไม่แพ้วิธีเก็บ"}]},{"questions":[{"insight":"ก่อนลงทุน ควรมีเงินสำรองเผื่อฉุกเฉินก่อน · แต่ถ้าเก็บเงินสดไว้เฉยๆ นานๆ ค่าของเงินก็ลดลงจากเงินเฟ้อ"},{"insight":"เวลาช่วยให้ดอกเบี้ยทบต้นทำงาน เริ่มเร็วมักได้เปรียบกว่าลงเยอะแต่เริ่มช้า"},{"insight":"ผลตอบแทนที่หวังได้มาก มักมาพร้อมการขึ้นลงที่แรงขึ้น"},{},{}]},{"questions":[{"insight":"เงินสดตัวเลขเท่าเดิม แต่ซื้อของได้น้อยลงเพราะเงินเฟ้อ ส่วนทองมักขยับตามค่าของเงิน"},{"insight":"ในหลายวิกฤต ทองมักไม่ไปทางเดียวกับหุ้น จึงช่วยพยุงภาพรวมได้"},{"insight":"ทองไม่สร้างรายได้ระหว่างถือ จึงมักใช้เป็นส่วนหนึ่งของภาพรวม ไม่ใช่ทั้งหมด"}]}];
var GAME_PLAYED={0:true,1:true}; // GAME_OPEN (sibling) removed 2026-09-27 — never read anywhere
var GAME_ANSWERS={};
function gamesPlayedCount(){return SIDES.reduce(function(n,_,i){return n+(GAME_PLAYED[i]?1:0);},0);}
function playSet(kind,idx){return kind==='game'?MINIGAME_Q[idx]:BOOTH_Q[idx];}
function playLabel(kind,idx){return kind==='game'?SIDES[idx].title:BOOTHS[idx].game;}
/* learnedInsights — every distinct question insight the player has picked up so far this session,
   derived from GAME_PLAYED/BOOTH_ACT (the real committed-completion flags) rather than a separate
   mutable log, same "derive from real state" convention sideResult()/boothPointsTotal() already use.
   `inProgress` ({kind,idx}) lets a game/booth still on its OWN result screen count immediately —
   completePlay() (which flips GAME_PLAYED/BOOTH_ACT true) only runs once the player taps the CTA to
   leave that screen, but the running total should already reflect what they just saw, not lag one
   screen behind. Text-deduped (a repeated insight across games only counts once), matching how the
   knowledge ledger below also only lists each concept the first time it's learned. */
function learnedInsights(inProgress){
  var seen={},out=[];
  function add(kind,idx){
    playSet(kind,idx).questions.forEach(function(q){
      if(q.insight&&!seen[q.insight]){seen[q.insight]=true;out.push({text:q.insight,kind:kind,idx:idx});}
    });
  }
  for(var gi=0;gi<MINIGAME_Q.length;gi++)if(GAME_PLAYED[gi])add('game',gi);
  for(var bi=0;bi<BOOTH_Q.length;bi++)if(BOOTH_ACT[bi])add('booth',bi);
  if(inProgress&&!(inProgress.kind==='game'?GAME_PLAYED[inProgress.idx]:BOOTH_ACT[inProgress.idx]))add(inProgress.kind,inProgress.idx);
  return out;
}
/* learnedLedgerHTML — "เรื่องที่คุณเข้าใจแล้ว" card for the Playbook's เส้นทาง (journey) tab: a
   personal, dynamic recap of every distinct insight learnedInsights() has captured from mini-games
   actually played, tagged by source game — NOT the same thing as คลังความรู้ (renderLibrary), which
   is a static 41-article/8-category reference shelf (this card sits directly above that shelf in
   renderBook, specific-before-general). Reuses ticketHistoryHTML's exact .card/.sides-hd/.s-ey/.s-h/
   .s-sub header + .side-item/.list-row.side-row/.side-num/.side-cx/.side-t/.side-s row shape (2026-09-10)
   rather than inventing a new list recipe — .side-num carries the source game/booth's own icon (done-
   filled, same "this is settled" language .side-num.done already means everywhere else) instead of a
   step number, .side-t is the insight text itself, .side-s names which game it came from. Empty state
   (nothing played yet) mirrors ticketHistoryHTML's own row-less-section absence — this whole card is
   simply omitted by its one call site (renderBook's journey panel) rather than rendering a hollow
   card, so a visitor who hasn't reached the games yet sees no half-empty ledger. */
function learnedLedgerHTML(){
  var items=learnedInsights();
  if(!items.length)return '';
  /* section heading on a fresh sheet (kept with what follows), the first insight as a pull-quote, then the rest as roman-numbered
     notes grouped under their game (heading once per run of the same game); see .pbx-lg-* */
  var parts=items[0].text.split(' · '),n=1,game=null;
  var out='<section class="pbx-sec pb-keep pbx-break"><div class="pbx-kicker">สะสมจากการเล่นเกมวันนี้</div><h2 class="s-h pbx-sec-t">เรื่องที่คุณ <span>เข้าใจแล้ว</span></h2>'+
    '<p class="pbx-sec-sub">'+items.length+' เรื่อง · อัปเดตอัตโนมัติทุกครั้งที่เล่นเกมจบ</p></section>'+
    '<blockquote class="pbx-lg-q"><div class="pbx-lg-qn">'+pbxRoman(n++)+'</div><div><p class="pbx-lg-qt">'+parts[0]+'</p>'+
    (parts.length>1?'<p class="pbx-lg-q2">'+parts.slice(1).join(' · ')+'</p>':'')+'<p class="pbx-lg-src">จากเกม '+playLabel(items[0].kind,items[0].idx)+'</p></div></blockquote>';
  if(items.length>1)out+='<div class="pbx-lg-br pb-keep" aria-hidden="true"></div>';
  items.slice(1).forEach(function(l,i,rest){
    var g=playLabel(l.kind,l.idx);
    if(g!==game){game=g;var cnt=0;for(var j=i;j<rest.length&&playLabel(rest[j].kind,rest[j].idx)===g;j++)cnt++;
      out+='<div class="pbx-lg-gt pb-keep">'+g+'<span>'+cnt+' เรื่อง</span></div>';}
    out+='<div class="pbx-lg-i"><span class="pbx-lg-in">'+pbxRoman(n++)+'</span><span class="pbx-lg-it">'+
      l.text.split(' · ').map(function(c,k){return k?'<span class="pbx-lg-c2">'+c+'</span>':c;}).join('')+'</span></div>';
  });
  return out;
}
function pbxRoman(n){var s='';[[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']].forEach(function(p){while(n>=p[0]){s+=p[1];n-=p[0];}});return s;}

/* ── RESPONSIVE VIEW (mobile | tablet | pc) ── driven by window, overridable via demo panel ── */
/* Both 'view' and 'draw' default to 'auto' (2026-08-26, per direction — "อัตโนมัติ default ไว้ที่
   mobile size" / "...ไว้ที่ครบเงื่อนไขแล้ว") so the demo panel shows the neutral "อัตโนมัติ" option
   selected, not a manually-forced one — but 'auto' itself is now hard-biased to resolve to mobile
   (see applyView) and to eligible (see renderBooth) rather than reacting to real width/chk/act
   counts. PC/แท็บเล็ต and ยังขาด remain available as explicit overrides. */
/* eventPhase (2026-08-28, per direction "แยกเป็น ช่วง Pre-Event, ช่วง On-Event") — 'pre': the QR-scan
   header pill is hidden (register takes its slot instead, see appHeader/mountHeaderQR) since there's
   nothing at the (unopened) venue to scan yet. 'on': QR pill shows. Switching TO 'on' also resets BOOTH_CHK/BOOTH_ACT/GAME_PLAYED/DRAW_JOINED to empty (see
   buildDemo's segPhase handler) — simulates a just-arrived attendee with zero real progress, so the
   sections that are supposed to start locked at On-Event (home counters/next-step, booth zone
   activities, game "ด้านอื่นในคู่มือ") actually render locked instead of this demo's old pre-seeded
   "already done" mock defaults. Switching to 'pre' does NOT touch RESULT/quizDone — a pre-event
   visitor may already have taken the quiz online, so identity content stays independently gated on
   RESULT alone (see renderBook's empty state, buildRoute's personalized flag). */
/* Defaults flipped 2026-09-10, per direction — On-Event is now the default preview (eventPhase),
   with an identity already on file (quizDone, seeded at bootstrap via seedPersonaResult — see the
   bottom of this file), the Booth Journey v2 map (boothVer), and the draw-status card genuinely
   computed from that seeded state's real chk/act counts (which start below CHECKIN_NEED/
   ACTIVITY_NEED, so it reads "ยังขาด" out of the box — see the 'auto' branch in renderBooth this
   direction restored). Switching the ช่วงงาน segment to Pre-Event is the one way back to the
   splash/quiz flow (RESULT/quizDone/boothVer aren't touched by that switch, same as before). */
var DEMO={quizDone:true,draw:'auto',eventPhase:'on',multiTicket:false,boothVer:'v2',registered:true,sampleEvolve:true}; // sampleEvolve: see pbxEvo // draw: 'auto' (default, real boothCheckinCount()/boothActivityCount() math) | 'ok' (force eligible) | 'need' (force not-eligible) — see renderBooth. registered (2026-09-04, per direction "จำลองเคส...ลูกค้าที่เข้ามาเล่น quiz dna โดยที่ยังไม่ได้ลงทะเบียน"): true (default, the real/active state) = the normal full Book; false previews a quiz-taker who never went through the registration site — renderBook locks to just the ตัวตน tab, truncates it at จุดแข็ง/จุดที่ต้องระวัง, and drops the bottom app-tabbar (see renderBook's `unreg` branches + book2Tabs()). boothVer (2026-09-03, per direction "อยากเพิ่ม หน้าเดินบูธ อีกเวอร์ชัน แยก preview ในเดโม"): 'v1' = the shipped booth page (static map image + separate route list, unchanged); 'v2' = a UX-enhancement preview per the Booth Journey spec — the SAME sections/layout/content, but the map gets numbered semantic markers synced 1:1 with the route steps, plus two-way Step↔Map focus. Everything v2 adds is gated on this flag so v1 stays byte-identical. (splashVer removed 2026-09-18, per direction "preview card เอา v1 ออก" — the splash fan carousel's "การ์ดมีชีวิต" build (added 2026-09-09, promoted to shipped default 2026-09-11) is now the only splash preview; v1 the plain static carousel, v3/v5 the "3D Character Card Flow" field and its living-card variant, were all removed the same day/session — see renderSplash's own comment for that full history.) eventPhase default flipped 'on'->'pre' (2026-08-28, per follow-up direction "จำลองเคส...อยากให้ preview default ที่ Pre-Event ก่อน") — see the comment above. multiTicket: false by default (2026-09-02) — the single-ticket case stays the active/real state; see MULTI_TICKET_DEMO. (sumTitleVer — a brief demo-panel toggle comparing 2 title treatments for renderPlaySummary's game-name — removed 2026-09-11, per direction "เลือกแบบ v2 และเอาแบบ v1 ออกได้เลย": v2, the DNA quiz's .q-icon-bare + .q-title header, is now just how renderPlaySummary always renders — see its own comment there.)

/* synthesize a plausible RESULT for a forced persona and jump to the Book (demo shortcut).
   gap:0 here used to mean the demo persona picker could NEVER show a real post-event difference —
   evoCompute() only shifts family when |gap|>=2, so an always-aligned demo always rendered
   'confirmed'/'gathering' (same card both tabs), which read as "the preview doesn't actually
   change between before/after." Now simulates a real divergence (±4) in whichever direction moves
   AWAY from the picked persona's own family, plus enough activity for evoCompute's evidence gate
   (sig>=3) — so picking ANY of the 12 demo personas reliably lands on a genuine 'evolved' state,
   and thanks to EVO_REP above, the post-event card is always real photographed art (diamondhand/
   waverider), never the CSS mockup, on that side. */
/* Build a plausible RESULT (+ demo activity) for a forced persona WITHOUT navigating — shared by the
   demo persona picker (which then jumps to Book) and the demo Character-Animation Play button (which
   jumps to the cardreveal instead). Splitting the seed from the navigation lets both entry points
   reuse the exact same synthesized result. */
function seedPersonaResult(key){
  var h=HEROES[key];
  var simGap=h.fam==='V'?-4:4;
  RESULT={hero:h,heroKey:key,declared:h.riskLevel,revealed:Math.max(1,Math.min(10,h.riskLevel+simGap)),gap:simGap,
    conf:74,confLevel:'สูง - สอดคล้องดี',
    subs:{identity:16,behavior:16,riskAlign:18,discipline:15},knowledge:'intermediate',horizon:'mid',votes:{},interests:[0,2,4]};
  GAME_PLAYED={0:true,1:true,2:true,3:true};GAME_ANSWERS={};BOOTH_CHK={0:new Set([0])};BOOTH_ACT={0:true};
}

/* Default demo state (2026-09-10, per direction): "ทำแบบทดสอบตัวตนแล้ว" out of the box — seed a
   RESULT before the very first render/buildDemo so DEMO.eventPhase:'on''s render() gate (which
   redirects splash/quiz/etc. to 'book' once RESULT exists, else 'home') lands on the Book page
   immediately instead of the empty "no identity yet" state. Booth check-in/activity start at
   seedPersonaResult's own baseline (booth 0 only) — below ACTIVITY_NEED — so the
   Booth tab's draw-status card genuinely (not forced) reads "ยังขาด" by default too. */
seedPersonaResult('sage');
RESULT.revealed=RESULT.declared;RESULT.gap=0; // the PDF sample reads "สอดคล้อง (Aligned)": what they said = what they did
/* Lay the sheets out only AFTER the webfonts are in (2026-09-21 bug fix): pbBuild() paginates by measuring text height, and with the
   fallback font showing (font-display:swap) every measurement was wrong - the book came out as 43 loosely-packed sheets instead of the
   ~36 the real font produces. document.fonts.load() forces the three faces to download even though nothing has used them yet; a 2.5s
   timeout keeps the page from ever hanging on a blocked font. */
(function(){
  var done=false;function go(){if(done)return;done=true;render();}
  setTimeout(go,2500);
  if(!document.fonts||!document.fonts.load){go();return;}
  Promise.all([document.fonts.load('500 16px "FC Minimal"'),document.fonts.load('700 16px "FC Minimal"'),document.fonts.load('500 16px "Sarabun"'),document.fonts.load('700 16px "Sarabun"'),document.fonts.load('400 20px "Pinyon Script"'),document.fonts.load('500 16px "Cinzel"')]).then(function(){return document.fonts.ready;}).then(go,go);
})();
