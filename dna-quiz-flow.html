<meta charset="utf-8">
<!-- charset MUST be the very first thing in the file (WHATWG pre-scan reads it from the raw bytes
     before any parsing) — this file has no <!DOCTYPE>/<html>/<head> wrapper (the HTML5 parser
     auto-supplies them), so nothing else was declaring an encoding. Without it, correct rendering
     of every Thai string here depended entirely on the HTTP server sending a charset in its
     Content-Type header; any host/local server/tool that doesn't (many static preview servers
     don't) falls back to a legacy 8-bit encoding and every non-ASCII character — all the Thai
     copy, "→", "×", "✦" — renders as mojibake. -->
<title>DNA Quiz → คู่มือลงทุนของคุณ</title>
<!-- Without this, mobile browsers with no viewport meta fall back to the classic ~980px desktop
     layout width, so every max-width:575px/480px breakpoint in this file (including the Liquid
     Metal CTA's own compactOptions switch) would never actually fire on a real phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:'FC Minimal';src:url(assets/fc-minimal-100-500.ttf) format('truetype');font-weight:100 500;font-style:normal;font-display:swap;}
@font-face{font-family:'FC Minimal';src:url(assets/fc-minimal-600-900.ttf) format('truetype');font-weight:600 900;font-style:normal;font-display:swap;}

/* ── BetterTrade 2026 · Design DNA v2.0 (editorial) ─────────── */
:root{
  --ink:#111318; --muted:#687078;
  --paper:#f7f8f7; --cloud:#eef1f6; --white:#ffffff;
  --accent:rgba(17,19,24,0.06);
  /* System border intensity halved (2026-08-11, per direction "สีอ่อน 50%") — every card/chip/input/
     divider border in the app inherits from these 4 tokens, so lightening them here softens boundary
     lines app-wide in one place rather than per-component. */
  --line:rgba(17,19,24,0.09); --line-soft:rgba(17,19,24,0.08); --line-strong:rgba(17,19,24,0.17); --line-header:rgba(17,19,24,0.06);
  /* 2026-08-15, per Color DNA review — --shadow-cta-ink (previously here) had zero consumers
     anywhere in the file despite its own comment claiming one use-site; deleted rather than kept
     around unread. --ring-idle retired the same way once .spec-bd (its only consumer) was deleted
     entirely (see Design DNA review "✦1 ทางเลือก A"). */
  --focus:#2b6cff; --popover:rgba(255,255,255,0.96);
  --cyan:#61e8ed; --violet:#9c91ff; --pink:#f178d8; --yellow:#f2ea83;
  --spectrum:linear-gradient(90deg,#61e8ed,#9c91ff,#f178d8,#f2ea83,#61e8ed);
  /* "Gold/amber" status color (2026-08-14) — was the exact same 3-hex combo hand-copied into 5
     separate rules (str-box.wn, redeem-card.on, pass-ic.gold, rt-badge.feat, prof-tier) plus a 6th
     near-miss variant that wasn't even color-identical (booth check-in legend swatch) — named here
     once so "the one gold across the app" (already the stated intent in 3 of those rules' own
     comments) is actually one definition, not five+ copies that can drift apart independently. */
  --amber-bg:#fef4e2; --amber-border:#f3daa0; --amber-text:#8a5a00;
  /* --green-text is the one surviving piece of the "good/green" status color named 2026-08-15 —
     --green-bg/--green-border (the wash/border pair) were retired again the same day once .str-box
     went neutral (see .str-box, "3 card นี้ยังดูแข่งๆ กัน"); --green-text still colors .str-hd's
     heading/icon, the one signal now carrying this card's identity. */
  --green-text:#15803d;
  /* "Done" (cyan) / "active" (violet) status ladders (2026-08-15, per Color DNA review "06") — cyan
     alone was independently re-tinted at 5/10/12/14/15/16/20% fill + 30/35/40% border across 12
     selectors for one semantic ("this is done/unlocked"); violet had the same shape at 7/8/12/14/
     15/20% fill + 22/26% border for "in progress/active". Collapsed to 3 rungs each — wash (a
     background tint), fill (a chip that must read as its own object), border (a visible outline) —
     and every consumer below now points at one of these six instead of picking its own percentage. */
  --done-wash:color-mix(in srgb,var(--cyan) 10%,transparent);
  --done-fill:color-mix(in srgb,var(--cyan) 15%,transparent);
  --done-border:color-mix(in srgb,var(--cyan) 35%,transparent);
  --active-wash:color-mix(in srgb,var(--violet) 10%,transparent);
  --active-fill:color-mix(in srgb,var(--violet) 15%,transparent);
  --active-border:color-mix(in srgb,var(--violet) 35%,transparent);
  --ease:cubic-bezier(0.22,1,0.36,1);
  /* Radius scale (2026-08-12) — 8/12/16/24 is the full ladder; the system only ever
     names the two rungs actually in use. 12 and 24 stay reserved for future needs.
     --r0 added (2026-08-14): 6px was hand-copied identically into 4 small-chrome rules
     (tooltip, focus ring, map caption, route badge) — named rather than left as 4 independent
     "6px" literals that could drift apart. Below the 8/16/48 ladder on purpose (micro-chrome
     tier, not a new rung in the main ladder). */
  --r0:6px; --r1:8px; --r2:16px; --rpill:48px;
  --shadow-action:0 1px 4px rgba(17,19,24,0.10);
  --shadow-primary:0 1px 4px rgba(17,19,24,0.24);
  --shadow-md:0 6px 18px rgba(17,19,24,0.14);
  /* Aligned to the value already hand-duplicated across 4 overlay cards (map lightbox, scan/share/
     howto sheets) instead of the old 24px/64px/.26 the token itself defined but no consumer used at
     (border & spacing audit, 2026-08-31) — .demo-panel is --shadow-lg's only OTHER consumer and gets
     marginally stronger as a side effect (dev-only tool, not user-facing). */
  --shadow-lg:0 30px 70px rgba(17,19,24,0.35);
  /* ============================================================================
     SPACING SYSTEM (2026-08-11) — a defined scale + a named rule per USE-CASE, so
     "how much space here" is a lookup, not an eyeballed number. Everything below
     is one of these 10 values; when a new spot needs space, pick the CASE it
     matches (not a raw px), so the app stays on one rhythm as it grows.
     Base scale: 2 · 4 · 6 · 8 · 12 · 16 · 20 · 22 · 24 · 44
     Re-tuned 2026-08-26 per direct spec (--sp-list 9→8, --sp-inline 10→12, --sp-stack/
     --sp-card-pad-sm 14→16, --sp-card-pad 20→22) — same USE-CASE roles, new rung values.
     ============================================================================ */
  --sp-hairline:2px;    /* optical nudge only (e.g. an icon's baseline offset) — never a "real" gap between two things */
  --sp-stack-tight:4px; /* a title/value → the ONE caption line directly under it (same idea, smaller type: q-title→q-sub, s-h→s-sub's lead-in) */
  --sp-glue:6px;        /* an icon ↔ its own label/kicker sitting right next to it — tight enough to read as ONE glued unit, not two items */
  --sp-list:8px;        /* gap between repeated rows in ONE list/stack (quiz options, risk/confidence bars, allocation legend, strength chips) */
  --sp-inline:12px;       /* two distinct-but-related items sharing a row (row icon + its text, avatar + label, a stat's icon + value) */
  --sp-stack:16px;      /* a section's own eyebrow/heading → the body content that follows it (inside one card) */
  --sp-card-pad:22px;   /* a card's own inner edge padding — the gutter between a card's border and its content */
  /* 2026-08-15, per Card & Section review "11" — small (--r1) cards had no padding rung of their
     own, so 7 different literal values (10/12/13/14/15/16px) floated independently across them.
     One value now, applied on all 4 sides (was previously asymmetric per selector). */
  --sp-card-pad-sm:16px;
  --sp-edge:20px;       /* the SCREEN's own outer gutter before any card starts — unified across quiz/book/splash/consent (was 14–24px ad hoc per screen) */
  --sp-block:22px;      /* one labeled sub-section to the next INSIDE the same card (identity → radar → interests → traits → allocation) */
  --sp-section:20px;    /* THE gap between any two top-level sections/cards on a long scroll (Book).
                           One value for every section boundary — driven from .scroll's flex `gap`, not
                           per-card margins — so the whole page shares one rhythm (was an ad-hoc mix of
                           18/28/44/0 that made "where does one section end" read inconsistently).
                           Was 28 — brought down per direction ("still feels too far apart"); still reads
                           as its own boundary since most cards' own internal padding (--sp-card-pad) sits
                           on both sides of it. Reserved for section-to-section only; intra-card spacing
                           uses --sp-block and smaller. Mobile keeps this 20px value; tablet/pc override
                           to 24px below — a wider canvas can afford (and reads better with) slightly more
                           breathing room than the narrow phone frame. */
  --font:'FC Minimal','Noto Sans Thai','Thonburi','DB Helvethaica X',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Baskervville','Bodoni MT','Didot',Georgia,'Times New Roman',serif; /* Editorial display serif — matches the printed character-card art. English display + numerals ONLY; Thai stays on --font (FC Minimal). Baskervville embedded (OFL, variable font — one @font-face covers weight 400–700); Bodoni MT = local-first fallback */
  /* --mono retired (2026-08-12, per direction) — every former mono site (topbar count, opt-key,
     eyebrow labels, side/route numerals, card-back stat rows) now sets font-family:var(--font)
     directly; there is no longer a second UI typeface in this app, only --font (UI) + --serif
     (display, English/numerals only). Numeric alignment where it mattered is kept via
     font-variant-numeric:tabular-nums on the specific rule, not by switching family. */
  /* Type scale v3 (2026-08-19, per direction) — every rung stepped up again: title 32→36,
     heading 24→28, h2 22→24, sub/body 18→20, bodysm 16→18, label 14→16, eyebrow/meta 12→14.
     Ratios between adjacent rungs preserved from v2, so relative hierarchy reads the same as
     before — this is a uniform scale-up, not a re-balance. eyebrow/meta still share one value
     (now 14) and label still sits apart from them (now 16) per the v2 audit's "three tokens,
     one size" fix; bodysm (18) now sits between label (16) and sub/body (20) rather than
     landing on label's old value, keeping all 8 rungs distinct except the deliberate
     eyebrow=meta pair.
     v2 (2026-08-15, per review of the Type System audit) — h2/sub/body/bodysm/label each
     stepped up one rung (title/heading/eyebrow/meta held, since the audit didn't flag them).
     --fs-label deliberately moved AWAY from --fs-eyebrow/--fs-meta here (14 vs 12) — the audit's
     "three tokens, one size" ambiguity is now only a two-way overlap (eyebrow+meta), not three.
     v4 (2026-08-26, per direct spec): --fs-sub/--fs-body 20→22 — the one rung moved this round,
     everything else held. This narrows the h2(24)↔sub/body(22) gap to 2px and widens sub/body(22)↔
     bodysm(18) to 4px, breaking the "ratios preserved" pattern the v2/v3 passes kept — a deliberate,
     isolated bump per this direction, not a full re-scale. */
  --fs-title:36px; --fs-heading:28px; --fs-h2:24px; --fs-sub:22px;
  --fs-body:22px; --fs-bodysm:18px; --fs-label:16px; --fs-eyebrow:14px; --fs-meta:14px;
  /* Icon scale v2 (2026-08-15, per Icon System audit review) — sm/md stepped up a rung (12→16,
     16→20), lg held at 24. Hero-tier icons (the single dominant icon on a screen) still stay
     sized per-context within roughly 32-44px rather than one fixed token — a reveal splash icon
     and a card-art glyph are different enough compositions that forcing one number would hurt one
     of them. The persona card's glyph (64px) is a deliberate exception outside this range — it's
     the collectible card's own signature art, not a UI icon. */
  --ic-sm:16px; --ic-md:20px; --ic-lg:24px;
  /* Card-art type scale (2026-08-15, per Type System audit §06) — the persona card front (.pcE-*)
     and back/dossier (.pcb-*) had 12 independent raw px sizes between them, front and back not
     even agreeing with each other on shared roles (e.g. the Thai name was 13px on the front,
     12.5px on the back). Consolidated to 5 named rungs, one per FUNCTION rather than per side, so
     front/back now share a token wherever they show the same kind of content. Deliberately its own
     scale, not folded into --fs-*: this is the card's own signature art, not app UI chrome. */
  --pc-fs-1:24px;  /* display name (EN) — pcE-en, pcb-en */
  --pc-fs-2:13px;  /* secondary name (TH) — pcE-th2, pcb-th */
  --pc-fs-3:11px;  /* reading copy — pcE-def, pcb-li, pcb-leg — plus the decorative sparkle pcE-spk */
  --pc-fs-4:10px;  /* eyebrow / section head / stat row — pcb-ey, pcb-hd, pcb-stl, pcb-stv */
  --pc-fs-5:8.5px; /* smallest — edition number, tag label, list/tag bullets */
  /* Weight scale v2 (2026-08-15) — --w-body merged into --w-head's value (500) per direction
     ("ให้ในระบบเหลือใช้แค่ 500, 700") — the system now genuinely has 2 rendered weights, not 3.
     Both tokens are kept (rather than deleting --w-body) since ~30 selectors still reference it
     by name for its semantic role ("this is baseline body copy," not "this is emphasized") —
     collapsing the VALUE removes the visual drift; collapsing the NAME too would just be a
     larger, riskier find-replace for zero further benefit. */
  --w-body:500; --w-head:500; --w-label:700;
}
/* Light theme only — dark mode intentionally removed (per direction: keep the original editorial theme). */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
/* --focus is the app's one semantic keyboard-a11y color — separate job from "selected" (which stays
   ink/spectrum everywhere else). :focus-visible only shows for keyboard/switch nav, so touch/mouse
   users on the kiosk never see it — this doesn't compete with the touch-first visual language. */
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
/* Liquid Metal Button's own <button> sets outline:none inline (unconditionally, as part of its base
   cssText) — an inline style always beats an external rule's specificity regardless of pseudo-class,
   so the global :focus-visible rule above can't reach it without !important. Same --focus color/
   token as everywhere else in the app (it happens to equal the kit's own README-specified #2b6cff). */
.lmb button:focus-visible{outline:2px solid var(--focus) !important;outline-offset:3px !important;}
/* min-height declared twice on purpose: 100vh first (universal fallback), 100dvh second (real mobile
   browsers report 100vh as the LARGEST possible viewport — address bar collapsed — so a page sized to
   100vh is actually TALLER than what's visible whenever the address bar is showing, pushing the CTA/
   bottom controls below the fold; 100dvh tracks the true visible height and updates as the bar shows/
   hides). Browsers that don't know dvh simply ignore that one declaration and keep the vh value. */
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-weight:var(--w-body);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;}
.shell{width:100%;max-width:430px;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;display:flex;flex-direction:column;}

/* The .spec-bd spectrum-comet accent system (CSS + --ring-idle token + ensureCometSVG/setSpecPath/
   layoutSpecComets in JS) was deleted entirely 2026-08-15, per Design DNA review "✦1 ทางเลือก A" —
   it had zero live consumers anywhere in the file (verified against markup and both liquid-metal-*.js
   files); the Liquid Metal button now owns every "CTA that shouts" moment this used to cover, and
   layoutSpecComets() was still being called on every navigation (5 call sites) to iterate an
   always-empty NodeList. */

/* Lucide icons — stroke-only per Design DNA §07; fill/stroke inherit to all children */
.lucide{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}

/* TOP BAR — quiet, no boxed icon chrome */
.topbar{position:sticky;top:0;z-index:80;background:var(--popover);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-header);height:54px;display:flex;align-items:center;padding:0 var(--sp-stack);gap:var(--sp-inline);flex-shrink:0;}
/* Bug fix (2026-09-02, responsive audit — found via a scripted scrollWidth/clientWidth sweep across
   every screen × data-view × real width, not just visual spot-checks) — on-event, .topbar holds 3
   items at once (.tb-logo + .reg-cta "ลงทะเบียน" [flex-shrink:0, never compresses] + #qr-cta-slot's
   mounted "สแกน QR" button), and at a genuine 320px viewport (checked 320-375px; only 320-329px
   actually fails) they don't quite fit even after the logo shrinks as far as it can — a real,
   precisely reproducible 6px horizontal overflow, on every screen that shows this header combo
   (Home/Games/Booth via appHeader(), Book via its own pre-appHeader() duplicate header). Tightening
   just the gap between the 3 items (12px->6px) closes the 6px shortfall with margin to spare —
   confirmed via the same script before committing to this fix, not just visually. Scoped narrow
   (≤340px, a few px of headroom above the exact 330px cutoff measured) so the roomier gap everywhere
   else is untouched. */
@media(max-width:340px){.topbar{gap:var(--sp-glue);}}
/* Header's registration CTA (2026-08-19) — same .btn.btn-primary as renderConsent's #startBtn
   ("style เดียวกับปุ่ม เริ่มทำแบบทดสอบ"), same fill/color/weight/pill-shape, just resized down from
   that button's full 48px-tall/24px-padding dimensions (same technique as .q-nav's own .btn-primary
   override just below) so it fits this 54px header next to the QR pill instead of overflowing it. */
.reg-cta,.reg-cta:link,.reg-cta:visited,.reg-cta:hover,.reg-cta:active{flex:0 0 auto;min-height:38px;padding:0 var(--sp-stack);gap:var(--sp-glue);font-size:var(--fs-label);text-decoration:none;color:var(--cloud);}
/* align-self:flex-start (2026-08-29, per direction "ไอคอน ลูกศร ให้ alignment top กับ text title") —
   .tb-ic's only real-world use is Library's back arrow (renderLibrary), next to a 2-line tb-title/
   tb-sub group; .topbar's shared align-items:center was centering it against that whole 2-line
   block instead of just the title. Scoped to the icon itself (align-self) rather than touching
   .topbar's own align-items, since every OTHER .topbar consumer is a single-line title with no
   .tb-ic at all and still wants that center alignment. */
.tb-ic{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--muted);background:none;border:none;align-self:flex-start;}
.tb-ic svg{width:var(--ic-md);height:var(--ic-md);}
/* Invisible 44×44 hit-area (2026-08-30, responsive audit fix) — the visible icon stays 34px so the
   flex-start alignment against the title's first line (see the comment above) is untouched, but a
   34px real <button> is under WCAG 2.5.8's touch-target guideline. An absolutely-positioned ::before
   sized via inset extends the actual clickable region by 5px on every side (34+5+5=44) without
   affecting .tb-ic's own box/layout — the same "grow the hit-area, not the visible glyph" technique,
   just done with an inset pseudo-element instead of padding since .tb-ic's box is also its visual
   icon frame. */
.tb-ic::before{content:'';position:absolute;inset:-5px;}
/* Title Section typography — bumped from --w-head (500) to --w-label (700, already used by
   value/number text like .hc-val/.ng-title) across every page/section title. 500 read thin and
   low-impact at these sizes; this doesn't touch --w-head itself since that's still used by many
   non-title elements (labels, buttons, badges) that weren't part of this request. */
.tb-title{flex:1;font-size:var(--fs-h2);font-weight:var(--w-label);letter-spacing:0;color:var(--ink);}
.tb-sub{display:flex;align-items:center;gap:var(--sp-glue);font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);font-family:var(--font);}
/* Quiz header's section status (dot + "1/1") — its own flex sibling after .tb-title (which has
   flex:1) so it's pushed to the header's right edge rather than stacked under the title. Re-added
   2026-08-20 per direction (kept as just the dot+counter — the segmented progline bar underneath
   stays removed, this is header-only). .tb-sub itself (shared with the library header's "41
   บทความ..." caption) is untouched — this modifier only bumps weight for the quiz's own status. */
.tb-sub--strong{font-weight:var(--w-label);flex-shrink:0;}
.tb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
/* Header-pill CTA size — the app's only other explicit CTA size spec is the Liquid Metal hero
   button's (56px/20px desktop, 49px/18px mobile — see README's kit config); this is the small,
   secondary counterpart used inline in a header rather than as a screen's main action. Recorded in
   PLAYBOOK-2026-DATA-BASELINE.md §11 so any future header-pill CTA reuses the same numbers. */
.tb-pill{display:inline-flex;align-items:center;gap:var(--sp-glue);height:38px;padding:0 var(--sp-stack);border-radius:var(--rpill);color:var(--ink);font-family:var(--font);font-size:var(--fs-bodysm);font-weight:var(--w-head);cursor:pointer;box-shadow:var(--shadow-action);}
.tb-pill svg{width:var(--ic-sm);height:var(--ic-sm);}
.tb-count{font-family:var(--font);font-size:var(--fs-meta);font-weight:var(--w-head);color:var(--muted);}

/* DEV BAR removed (2026-08-26, per direction) — was a manual "reset quiz" shortcut; a real browser
   refresh already returns to splash on its own (st starts at phase:'splash', nothing persists to
   localStorage/sessionStorage), so the button was redundant with default behavior. resetQuiz()
   itself is kept — the demo panel's "รีเซ็ตเกมหลักที่เล่น" button still calls it. */

/* ── QUIZ ── every quiz screen is one equal-height canvas: content flows from the top, the nav is pinned to the bottom (margin-top:auto), and a min-height keeps all screens the same size regardless of how much they contain */
.q-scroll{flex:1;min-height:620px;padding:var(--sp-list) var(--sp-edge) 34px;display:flex;flex-direction:column;}
/* Quiz layout — re-centered against 21st.dev "Animated Hero" (badge → 2-weight headline → centered
   subtext → centered CTAs), kept in our own DNA: question/answers/CTA stay the actual hero of the
   screen (per direction — the centering is a layout device, not a content change), the icon becomes
   a clearly-reserved placeholder slot instead of a bare inline glyph, and the "font-weight play" is
   automatic (see emphasizeQ() near renderQuiz) rather than hand-authored per question. */
/* --qc (2026-08-15, per Icon System audit review "ปรับให้เข้ากับ token ที่มี") — this was declared
   with a fallback on both .q-icon-bare and .q-title b but never actually set anywhere, so every
   question rendered on the same violet/ink default regardless of section. Now wired to the SAME
   per-section color (dotColor in renderQuiz — yellow §1 risk, violet §2 DNA, pink §3 interests),
   set once here on the shared .q-head wrapper and inherited by both children — reuses an existing
   token, doesn't invent one. */
.q-head{margin:22px 0 24px;text-align:center;}
/* Real custom illustrated icons have now landed for EVERY question (q.img → ICON_IMG, see
   renderQuiz) — the last 3 (s1q2 "ระยะเวลาการลงทุน", s2q6 "ความสนใจ/สิ่งที่อยากเรียน", s2q7
   "ปรัชญาการลงทุน") were added 2026-08-19 from Icon/dna quiz/, closing out what this comment used
   to describe as "most questions". The --accent circle was only ever a placeholder backdrop for a
   future icon, and per direction it's dropped now that real art is here ("ไม่ต้องมีสีพื้นหลัง
   (วงกลม)"). .q-icon-bare (the plain-Lucide fallback path) is kept at the same 80px slot size
   regardless — not because any question still needs it now, but so a future question added
   without art yet doesn't reflow against its siblings. */
.q-icon-bare{display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-stack);width:80px;height:80px;color:var(--qc,var(--violet));}
.q-icon-bare svg{width:42px;height:42px;}
/* Gentle idle motion per direction ("motion แบบเดียวกับ asset element หน้าแรก") — reuses the
   SAME spDrift keyframe the splash scatter runs on (defined further down, order-independent for
   @keyframes) at its own default drift/rotate values, just a touch slower/smaller since this is a
   single focal icon, not a background decoration. Scoped to img only — the questions still on a
   plain Lucide icon (no q.img yet) aren't part of "the newly updated icons" this asked for. */
.q-icon-bare img{width:100%;height:100%;object-fit:contain;animation:spDrift 5s var(--ease) infinite alternate;--dx:6px;--dy:-9px;--r0:-3deg;--r1:3deg;}
/* section title/count live in the topbar (.tb-title/.tb-sub) — the body starts straight at the icon,
   no eyebrow/kicker/chapter-opener above the question, so icon → question → answers → CTA read as
   the whole story with nothing competing above them. */
/* 500 base / 700 emphasized trailing clause (see emphasizeQ()) — a later system-wide "Title
   Section → 700" pass accidentally flattened this to a uniform 700, silently killing the
   2-weight emphasis this file's own comment above (.q-head) describes as intentional. Restored:
   .q-title itself back to --w-head (500), .q-title b stays at --w-label (700). */
.q-title{font-size:var(--fs-title);font-weight:var(--w-head);line-height:1.2;letter-spacing:0;color:var(--ink);margin-bottom:var(--sp-inline);}
/* 2026-08-15 bug: --qc got wired to the quiz's real per-section color (yellow §1 / violet §2 /
   pink §3, see the --qc comment above), which also fed straight into this rule via its fallback —
   so the emphasized word in every question title started rendering in whichever section's color
   instead of staying black. Only .q-icon-bare was meant to track section color; the emphasized
   text itself goes back to a flat --ink regardless of section. */
.q-title b{font-weight:var(--w-label);color:var(--ink);}
.q-sub{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);line-height:1.5;margin:4px auto 0;text-wrap:pretty;max-width:400px;}
.q-opts,.int-grid{width:100%;max-width:460px;margin:0 auto;}
.q-opts{display:flex;flex-direction:column;gap:var(--sp-list);}
/* align-items:start (2026-08-15, per direction "align top... ตอนนี้ align center พอตัวเลือกที่มี 2
   บรรทัด จะเห็นได้ชัด") — the option-key icon was centering against the full height of any answer
   that wrapped to 2 lines instead of sitting level with its first line. */
.q-opt{display:grid;grid-template-columns:34px 1fr;gap:var(--sp-stack);align-items:start;padding:var(--sp-stack) var(--sp-stack);border-radius:var(--r2);border:1.5px solid var(--line-soft);background:var(--white);cursor:pointer;transition:border-color .18s var(--ease),transform .18s var(--ease);text-align:left;font-family:var(--font);width:100%;}
.q-opt.sel{border:2px solid transparent;background:linear-gradient(var(--white),var(--white)) padding-box,var(--spectrum) border-box;}
.opt-key{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-label);font-weight:var(--w-head);background:var(--accent);color:var(--muted);flex-shrink:0;transition:background .18s,color .18s;font-family:var(--font);}
.q-opt.sel .opt-key{background:var(--ink);color:var(--cloud);}
.opt-text{font-size:var(--fs-sub);font-weight:var(--w-body);color:var(--ink);line-height:1.5;}

/* SCREEN 3 — multi-select interests (≤3), same visual family as q-opt */
.int-count{font-family:var(--font);font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);margin:0 auto var(--sp-inline);text-align:center;max-width:460px;}
.int-count b{color:var(--ink);}
.int-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-list);}
/* Mobile-only single column (2026-08-19, per direction) — 2-up read as cramped on a phone-width
   frame once option labels wrap to 2 lines (e.g. "อสังหาฯ และกองทุนอสังหาฯ (REIT)"); tablet/pc keep
   the 2-up grid since they have the width to spare. */
:root[data-view="mobile"] .int-grid{grid-template-columns:1fr;}
/* align-items:start (2026-08-15, per direction "ตัวเลือกคำตอบยังไม่ Align top") — same fix as .q-opt,
   missed here since this is a separate multi-select tile component, not the same class. */
.int-opt{display:flex;align-items:start;gap:var(--sp-inline);padding:var(--sp-stack) 14px;border-radius:var(--r2);border:1.5px solid var(--line-soft);background:var(--white);cursor:pointer;transition:border-color .18s var(--ease),opacity .18s,transform .18s var(--ease);text-align:left;font-family:var(--font);width:100%;}
.int-opt.sel{border:2px solid transparent;background:linear-gradient(var(--white),var(--white)) padding-box,var(--spectrum) border-box;}
.int-opt.disabled{opacity:.4;cursor:not-allowed;}
.int-ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--muted);flex-shrink:0;transition:background .18s,color .18s;}
.int-ic svg{width:var(--ic-md);height:var(--ic-md);}
.int-opt.sel .int-ic{background:var(--ink);color:var(--cloud);}
/* flex:1;min-width:0 added (2026-08-15, per direction "ตัวเลือกอสังหา คำว่ากองทุนตัดคำให้เต็ม") — as a
   flex item with no explicit min-width, this defaulted to min-width:auto, which for long compound
   Thai text with no browser-recognized break opportunity refuses to shrink/wrap at all, overflowing
   past the card edge instead ("อสังหาฯ และกองทุนอสังหาฯ (REIT)" was the option that hit this). */
.int-t{flex:1;min-width:0;font-size:var(--fs-sub);font-weight:var(--w-body);color:var(--ink);line-height:1.35;}

/* NAV / BUTTONS — nav pinned to bottom (equal-height screens); primary CTA capped so it stays a consistent proportion, never full-bleed on wide screens */
/* Both nav buttons now split the row evenly (flex:1 each) instead of sizing to their own content and
   clustering together with dead space on both sides — "เต็มความกว้างเท่าคอนเทนต์". justify-content is
   moot once both children fill 100% of the row, so it's dropped here (still overridden below on
   mobile for the sticky variant, where it's equally moot but harmless to leave explicit). */
/* Desktop/tablet: back and next split to the two ends via justify-content:space-between, each sized
   to its own content (flex:0 0 auto) — separated onto their own sides, not stretched to fill and not
   clustered in the middle. The row is capped at 460px centered, the SAME column the option cards use
   (.q-opts/.int-grid), so "left side" and "right side" mean the left/right edge of the content column
   the user is actually reading — back sits directly under the leftmost option edge, next under the
   rightmost. (A full-width 760 split was tried and looked wrong: it flung the buttons ~520px apart to
   the edges of the wider reading area, disconnected from the narrower centered options.)
   Mobile overrides this below to justify-content:flex-end — there the pair stays together as one
   right-aligned group on the full-bleed sticky bar, which reads better one-handed than an edge split. */
.q-nav{display:flex;gap:var(--sp-inline);width:100%;max-width:460px;margin:auto auto 0;padding-top:32px;align-items:center;justify-content:space-between;}
.q-nav .btn-primary,.q-nav .btn-tertiary{flex:0 0 auto;}
/* Mobile: pin the nav to the viewport bottom so the CTA is always reachable even when a question's
   answers run long enough to push it past the fold. margin-top:auto already parks it at the bottom of
   the (tall) q-scroll; position:sticky;bottom:0 additionally holds it at the visible bottom WHILE the
   options scroll under it, then it settles into that same parked spot at max scroll — no jump. The
   paper background + full-bleed negative margins + top fade let options scroll cleanly beneath it;
   safe-area padding keeps it clear of the home indicator. Scoped to data-view=mobile (covers both real
   phones and the desktop phone-frame preview); pc/tablet keep the roomy centered layout. */
/* width:auto (not 100%) is the actual fix here: with width:100%, that 100% resolves against the
   content box BEFORE the negative margins are applied, so the margins only shifted the box left
   without growing it — the right edge fell ~40px short of the true edge. width:auto lets flex-stretch
   (q-scroll's default align-items) solve the box's cross-size as "available space minus margins",
   which correctly expands it to the full bleed edge on both sides. justify-content:space-between
   (not center) puts "ถัดไป" flush against the right edge — easiest one-handed reach on a phone —
   while pc/tablet above keep the roomy centered pair from the Animated Hero redesign. */
/* Quiz CTA reverted OFF sticky-bottom on mobile (2026-08-19, per direction "แก้ไขให้ไม่ฟิ้ก bottom
   (เมื่อ scroll ให้เห็นตัวเลือกคำตอบทั้งหมดก่อน ถึงเจอ button)"). The previous sticky treatment
   (2026-08-16, matched to the splash CTA's fixed position) pinned .q-nav to the viewport bottom while
   options scrolled underneath it — on any question whose answers ran to option E, that option sat
   directly behind the pinned bar, visually indistinguishable from "no more content below" and easy to
   miss entirely. Reverted to the same in-flow behavior pc/tablet already use (base .q-nav's
   margin-top:auto — parks at the bottom of the column only when there's leftover space; when content
   overflows, it simply follows the last option and requires a real scroll to reach), so every option
   is guaranteed to scroll fully into view before the button ever appears. justify-content:flex-end
   kept (one-handed reach on phone); safe-area padding kept since the button can still land at the
   true screen edge on short questions. */
:root[data-view="mobile"] .q-nav{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));justify-content:flex-end;}
/* ============================================================================
   BUTTON SYSTEM (2026-08-11) — 3 tiers by fill weight, each usable with or
   without an icon (an icon is just optional inline content — no separate CSS
   case for that). ALL THREE share the exact same motion (see the hover block
   below) so hierarchy comes from COLOR/WEIGHT alone, never from how it moves.
     Primary   — solid dark fill, no border   → the ONE main action on a screen
     Secondary — solid white fill, plain border → a supporting/alternate action
     Tertiary  — no fill, no border → the least-emphasized action (e.g. ย้อนกลับ)
   .btn-outline and .btn-plain are RETIRED — folded into .btn-secondary and
   .btn-tertiary respectively, so there's exactly one class per tier, not two
   overlapping ones. The old spectrum-animated-border accent (.spec-bd) that
   used to stack on top of any tier for a shouting CTA was deleted entirely
   2026-08-15 (Design DNA review "✦1") — the Liquid Metal button owns that
   job now.
   ============================================================================ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-list);min-height:48px;padding:0 24px;border-radius:var(--rpill);font-family:var(--font);font-weight:var(--w-head);font-size:var(--fs-sub);cursor:pointer;white-space:nowrap;border:1.5px solid transparent;line-height:1;transition:box-shadow .18s var(--ease),filter .18s var(--ease),transform .18s var(--ease),background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease);}
.btn svg{width:var(--ic-md);height:var(--ic-md);transition:transform .2s cubic-bezier(.4,0,.2,1);}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;filter:none;}
.btn-primary{flex:1;background:var(--ink);color:var(--cloud);border-color:var(--ink);box-shadow:var(--shadow-primary);}
.btn-secondary{background:var(--white);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow-action);}
.btn-tertiary{background:none;color:var(--muted);border-color:transparent;box-shadow:none;padding:0 var(--sp-stack);}
/* ── button hover system ── adapted from a jakobhoeg/21st.dev "expandIcon" button reference (icon
   nudges in its direction of travel on hover, fill darkens slightly). Icons stay visible always —
   unlike the reference's hide-until-hover reveal, hiding by default would mean touch users (this
   app's primary audience) never see the icon at all, since touch has no hover to reveal it; hover
   here only ADDS a nudge on top of the icon that's already there. Scoped to hover:hover+pointer:fine
   so tapping on touch can never leave a "stuck" hover state (a common mobile web bug).
   ONE shared motion for all 3 tiers — lift + a per-tier emphasis cue. Icon direction is tagged on
   the icon ITSELF (.ic-fwd/.ic-back, via ic()'s 2nd arg), not on the button tier — so an arrow means
   the same thing whether it's sitting on a primary, secondary, or tertiary button. */
@media (hover:hover) and (pointer:fine){
  .btn:hover{transform:translateY(-1px);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary:hover{border-color:var(--line);box-shadow:var(--shadow-md);}
  .btn-tertiary:hover{color:var(--ink);}
  .btn:hover svg{transform:scale(1.1);}
  .btn:hover svg.ic-fwd{transform:translateX(3px);}
  .btn:hover svg.ic-back{transform:translateX(-3px);}
  .q-opt:hover{border-color:var(--line-strong);transform:translateY(-1px);}
  .int-opt:hover{border-color:var(--line-strong);transform:translateY(-1px);}
  .tab-item:hover{color:var(--ink);}
  .bt-tabs--secondary .bt-tab:hover{border-color:var(--line-strong);color:var(--ink);}
  .home-hero.v3:hover .hh-video{transform:scale(1.06);}
  .prof-av:hover img{transform:scale(1.06);}
}
.btn:active{transform:scale(.97);}
/* Profile avatar — re-done to match the home poster's own zoom interaction (2026-08-20, per
   direction "รูป user อยากให้ใช้ interaction แบบเดียวกับ หน้าหลัก section poster (hover ที่รูปแล้ว จะ
   ซูมเข้า แต่ยังอยู่ภายใน frame)"), replacing the earlier "photo press-scale only, no hover" direction
   this same comment used to document. Same technique as .home-hero.v3::before: the VIDEO scales up,
   not the circle frame — .prof-av's own overflow:hidden (already set, for the profPop mount
   animation) clips the zoomed image to the circle so it never spills past the round mask. Mouse
   hover (pointer:fine) scales in; touch gets the :active equivalent, same split as .home-hero.v3. */
.prof-av:active img{transform:scale(1.04);}

/* CONSENT — Steady-Hand pattern: kicker · two-tone headline · body · round cards · CTA · caption */
/* justify-content:center added (2026-08-15, "โดยรวมลองดูเรื่อง layout ใหม่") — this screen lost its
   kicker, consent checkbox, and caption in the same pass (see below), so there's meaningfully less
   content now; without centering, it just left a growing dead gap at the bottom below a fixed 60px
   top pad instead of the whole block sitting centered in the available space.
   position:relative kept even after the asset scatter was removed (2026-08-20, per direction "เอา
   asset element ทั้งหมดออก") — .consent-p/.consent-btn etc. still sit on z-index:2 against it, and
   it's also what the new photo background below stacks the fade-in content over. */
/* background-position made RESPONSIVE per data-view (2026-08-20 2nd follow-up, per direction
   "ค่อนๆ ไป left อีกหน่อย...ต้องการให้ทุกอุปกรณ์ยังเห็นประตูได้อยู่ ตอนนี้ mobile ไม่เห็นประตู").
   room1's door sits near dead-CENTER of the source photo (~40–60% of its width) — measured by
   overlaying % gridlines on the raw image and reading them back at high contrast (a flat
   background-position:32% shared across devices, the previous rule, put mobile's crop window
   entirely left of it). background-size:cover on a 16:9 photo inside a PORTRAIT mobile box only
   ever shows a narrow ~28%-wide slice of the image's width (it's height-bound, so the box's own
   aspect ratio dictates how much width survives) — that slice is too narrow to both include the
   door AND sit meaningfully left of center, so mobile is pinned close to center (48%) just to keep
   the door in frame at all. Tablet's squarer box shows a much wider ~44% slice (room to lean to
   30% and still fully include the door), and pc's landscape box shows ~75% of the image width (room
   to lean hard left, 16%, with the door nowhere near the crop edge). Net effect: the composition
   reads progressively MORE left-weighted as the viewport widens and the crop has more room to give,
   rather than one compromise value that's either too-left on mobile (loses the door) or too-centered
   on pc (wastes the extra width tablet/pc actually have).
   Photo swapped room1-1.jpeg->room1-2.png (2026-08-20 4th follow-up, per direction "ใช้รูปนี้แทน...
   composition และความสว่าง...อิงตามการปรับของรูปเดิม") — a DIFFERENT photo (same white colonnade
   concept, but with a real diagonal rainbow-prism beam baked into the shot, entering upper-left and
   sweeping across the pillars/floor toward center-right), so the door-position math above no longer
   strictly applies to this image's actual content. Per direction, the 48/30/16% responsive values
   and the white-wash treatment were carried over AS-IS rather than re-measured against the new photo
   — re-open this comment's math if the new photo's own focal point ever needs recentering. */
.consent{position:relative;overflow:clip;isolation:isolate;flex:1;padding:60px var(--sp-edge) 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background-size:cover;background-position:48% center;background-repeat:no-repeat;}
:root[data-view="tablet"] .consent{background-position:30% center;}
:root[data-view="pc"] .consent{background-position:16% center;}
/* White wash (2026-08-20, per direction "พื้นหลัง...อยากให้ภาพโทนอ่อน ใกล้สีขาวกว่านี้") — the
   room1 photo itself still has real tonal range (shadowed columns etc); rather than filter:brightness
   on .consent (which would also wash out the real text/cards sitting in .content), a flat translucent
   white sits on its own layer between the photo and .content so only the backdrop lightens.
   ::before paints first (conceptually the first child, ahead of .content in source order/z-index),
   so .content's z-index:1 stays on top. */
/* .45 → .64 (2026-08-20, per direction "พื้นหลัง...ให้ความสว่าง หรือโทนอ่อนลงอีก (ตอนนี้ภาพยังเข้ม
   สดไป)") — same flat-white-layer technique as before, just a stronger wash so the photo reads paler
   across pc/tablet/mobile alike (this rule isn't view-scoped). */
.consent::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:rgba(255,255,255,.64);}
/* AURORA ACCENT — added 2026-08-20 (a CSS-only rainbow-glow layer, since the room1-1.jpeg backdrop
   at the time was a plain white room with no rainbow of its own), tuned across 3 follow-up rounds
   (opacity/blur/blend-mode/drift-speed — see git history if any of that recipe is ever needed again),
   then REMOVED entirely (2026-08-20, per direction "เอาแสงรุ้งออก") the same day room1 was swapped
   for room1-2.png — the new photo has a real rainbow-prism light beam baked into the shot itself, so
   the separate CSS glow became redundant (and was fighting the photo's own light direction/color
   rather than matching it). `.concept__aurora`/`.concept__aurora::after`/`@keyframes auroraDrift`
   and the `.aurora-section` wrapper class are gone; the plain white wash above is all that's left of
   this layer, folded directly onto `.consent` itself. */
.consent>.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;width:100%;}
/* Content wrapper (everything except the CTA) — plain block by default so pc/tablet still center the
   whole [body + button] group together via .consent's justify-content:center. Mobile promotes it to
   flex:1 + internal centering so the body sits mid-screen while the button pins to the bottom. */
.consent-body{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;}
:root[data-view="mobile"] .consent-body{flex:1;justify-content:center;}
/* reveal/analysis scene — the blue wash that was pulled off the quiz + identity card lived HERE as a
   static radial-gradient glow; per AURORA-BACKGROUND-DNA.md ("a living light field, not a Graphic")
   that flat fill is now two slow-drifting soft blobs instead (deep background = --paper, same as
   before). Only transform+opacity are animated (no animated background-position) so this stays
   compositor-only per the doc's "GPU-friendly, avoid layout" rule.
   .reveal-scene shares the .consent class, whose own ::before (line 443) is a flat white wash meant
   for the room1 PHOTO backdrop scene — irrelevant here (no photo), and at 64% white it would mute
   the aurora almost to nothing. Same specificity + later source order, so redeclaring content/
   position/background on .reveal-scene::before/::after below fully overrides that shared rule for
   THIS element only (every other .consent-only screen keeps its wash untouched). z-index:-1 (not
   .sp-scatter's z-index:0 pattern noted above) is deliberate: negative paints behind plain static
   content in .consent's own isolated stacking context (isolation:isolate, line 431), so the icon/
   kicker/headline need no z-index changes of their own to stay above it.
   BUG FIX (2026-08-30): drift duration was originally 24s/28s, tuned as if this were a long-lived
   background — but renderReveal() auto-advances to Book after a hardcoded 3s (REVEALTIMER below),
   so real attendees only ever see ~1/8th of one loop: at that speed the ease-in-out curve is still
   near its slowest, so the "living light" read as a frozen static gradient in practice. Shortened
   to 7s/8s (and nudged the travel distance up a touch) so real motion actually registers inside the
   screen's true visible window, while ease-in-out keeps it reading calm/organic rather than fast or
   bouncy — this doc's own §5 "don't" list. */
.reveal-scene{background:var(--paper);}
.reveal-scene::before,.reveal-scene::after{content:"";position:absolute;z-index:-1;border-radius:50%;aspect-ratio:1;pointer-events:none;will-change:transform;filter:blur(48px);}
.reveal-scene::before{width:62%;left:-14%;top:-10%;background:radial-gradient(circle,color-mix(in srgb,var(--violet) 55%,transparent) 0%,color-mix(in srgb,var(--pink) 28%,transparent) 55%,transparent 75%);animation:auroraDriftA 7s ease-in-out infinite alternate;}
.reveal-scene::after{width:66%;right:-16%;bottom:-8%;background:radial-gradient(circle,color-mix(in srgb,var(--cyan) 50%,transparent) 0%,color-mix(in srgb,var(--yellow) 24%,transparent) 55%,transparent 75%);animation:auroraDriftB 8s ease-in-out infinite alternate;}
@keyframes auroraDriftA{0%{transform:translate(0,0) scale(1);}100%{transform:translate(9%,6%) scale(1.16);}}
@keyframes auroraDriftB{0%{transform:translate(0,0) scale(1);}100%{transform:translate(-8%,-9%) scale(1.12);}}
/* Desktop: "wide blur, multiple color fields" — same two blobs, just softer/bigger. Mobile: "reduce
   layer count" — drop to the single (violet/pink) blob so a small screen isn't fighting two glows
   for the same tight space. Tablet keeps the base 2-layer/48px rule as its own middle ground. */
:root[data-view="pc"] .reveal-scene::before,:root[data-view="pc"] .reveal-scene::after{filter:blur(72px);}
:root[data-view="mobile"] .reveal-scene::after{display:none;}
/* Reveal headline stacks its two spans on separate lines (per direction "ตัวตนนักลงทุน / กำลังจะปรากฏ
   อยู่คนละบรรทัด") — the shared .consent-h keeps ch-1/ch-2 inline for the consent screen's "รู้จัก
   ตัวคุณ?" one-liner, so this two-line behavior is scoped to the reveal instance only. */
.reveal-h .ch-1,.reveal-h .ch-2{display:block;}
/* 40px (2026-08-19, per direction) — scoped to .reveal-h only, NOT the shared .consent-h base rule
   (64px), so the actual consent screen's "รู้จัก ตัวคุณ?" headline is untouched. Compound selector
   (.consent-h.reveal-h, matching the real markup's dual classes) is REQUIRED here, not just
   `.reveal-h` alone — both are single-class selectors of equal specificity, and .consent-h's own
   64px rule sits later in the file, so a same-specificity `.reveal-h{font-size:40px}` would lose
   that cascade tie to it regardless of this comment's intent. */
.consent-h.reveal-h{font-size:40px;}
/* Background circle dropped per direction (the hourglass is a full-color illustration, doesn't
   need a backdrop the way a thin line icon did) — width/height kept as the layout box the spin
   ring (.reveal-spin, inset:-6px off THIS box) still centers around. */
.reveal-icon{width:80px;height:80px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
.reveal-icon svg{width:32px;height:32px;color:var(--violet);}
/* Custom hourglass illustration (per direction) replaces the sparkle svg — bumped 64→72px per a
   follow-up direction, still comfortably inside the 80px ring box. */
.reveal-icon img{width:72px;height:72px;object-fit:contain;}
/* analyzing state — a spectrum arc spinning around the icon while results compute. Selector
   covers both svg (older icons elsewhere reusing .reveal-icon) and img (the hourglass) so the
   pulse still applies regardless of which one is inside. */
.reveal-icon.analyzing{position:relative;}
.reveal-icon.analyzing svg,.reveal-icon.analyzing img{animation:revealPulse 1.4s ease-in-out infinite;}
/* Monochrome now (was cyan→violet) — the hourglass icon itself is the one full-color moment on
   this screen; a colorful ring around it competed for attention instead of reading as a quiet
   loading indicator. Gray-to-ink sweep instead, same structure (arc fades in from nothing, darkens
   toward the leading edge, fades back to nothing). */
.reveal-spin{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,transparent 250deg,var(--line-strong) 300deg,var(--ink) 340deg,transparent 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:revealSpin 1s linear infinite;}
@keyframes revealSpin{to{transform:rotate(360deg);}}
@keyframes revealPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.08);opacity:.72;}}
@media(prefers-reduced-motion:reduce){.reveal-icon.analyzing svg,.reveal-icon.analyzing img,.reveal-spin{animation:none!important;}}
/* .consent-kicker ("แบบทดสอบสำหรับนักลงทุน") removed entirely 2026-08-15, per direction. A 48px
   shimmer treatment was tried on the reveal screen's "กำลังวิเคราะห์คำตอบของคุณ" line 2026-08-19,
   then reverted the same day per direction ("กลับไปใช้ text size เดิม และ เอา shimmer ออก") — back
   to plain unstyled text, no rule here. */
/* Same 2-weight device as .q-title (see the comment there) — ch-1 (the statement itself) at 500,
   ch-2 (the trailing "...is coming"/"...for you" continuation) at 700, so the two words read as one
   composed thought instead of one flat weight. Kept on ONE line now (display:block -> inline, plus
   a space between them in the markup) per direction ("รู้จัก / ตัวคุณ อยากให้อยู่บรรทัดเดียวกัน"). */
/* position:relative;z-index:2 added (2026-08-15, real bug found while investigating "fix bug") —
   .sp-scatter is position:absolute;z-index:0, and per CSS stacking rules a positioned element with
   z-index:0 paints ABOVE plain static (position:static, z-index:auto) content regardless of DOM
   order — so without this, the scatter assets would sit on TOP of the title/paragraph/round-cards
   instead of behind them, at any width/asset position where they happen to overlap. Splash's own
   .sp-top/.sp-stage already do exactly this for the identical reason; .consent-h/.consent-p/
   .round-cards were missing the same treatment. .consent-btn already has z-index:6 from its own
   sticky rule, so it didn't need it. */
/* Bumped 36px(--fs-title)->64px per direction (2026-08-19) — a dedicated size for THIS headline
   only, not a change to the shared --fs-title token (still used by .q-title/.conf-sc elsewhere). */
.consent-h{position:relative;z-index:2;font-size:64px;letter-spacing:-0.01em;line-height:1.06;margin-bottom:var(--sp-stack);}
/* Colors swapped per direction: the lighter 500 line (ch-1) is now the muted/gray one and the
   heavier 700 line (ch-2) is now the solid ink one — previously the bold line was the faint gray
   and the light line was dark, which read upside-down. Weights stay 500/700; only the colors moved. */
/* Shimmer Text (2026-08-19, per "Shimmer Text — Design & Motion DNA" direction) — a continuous,
   slow light sweep across the headline, applied here as the Discovery-moment cue for this screen
   only (DNA §9: key message/insight only, never body/nav/label). Implementation notes tying back
   to the DNA doc's rules:
   - "Typography ยังคงเป็นองค์ประกอบหลัก": base color/weight (muted/500 vs ink/700) are UNCHANGED —
     each span keeps its own --tcolor as the gradient's start/end stop, so the existing two-tone
     hierarchy reads exactly as before; the shimmer rides ON TOP of it, not instead of it.
   - "ไม่ใช่ Glitch/Neon/Glow หนัก": the moving highlight is the SAME base color mixed toward the
     brand violet (no foreign white flash, no text-shadow/glow layer) — reads as "light passing
     across ink", not a flash.
   - "ไม่กระตุก / ไม่ Scale / ไม่ Rotation / ไม่เปลี่ยนตำแหน่ง / ไม่ Layout Shift": motion is
     background-position only (ease-in-out, 4.2s — slow/premium, not a loading-spinner speed);
     background properties never affect box layout, so this cannot shift or reflow the headline.
   - "prefers-reduced-motion: ลดหรือหยุด Animation แต่ห้าม Content หายไป": no extra media query
     needed — the file's existing global reduced-motion rule (`*,*::before,*::after{animation:none}`,
     see below) already freezes this in place; because every gradient stop is fully opaque, the
     frozen frame still shows solid, readable text (never transparent/blank). */
.consent-h .ch-1,.consent-h .ch-2{background-repeat:no-repeat;background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmerSweep 4.2s ease-in-out infinite;}
.consent-h .ch-1{--tcolor:var(--muted);color:var(--muted);font-weight:var(--w-head);background-image:linear-gradient(100deg,var(--tcolor) 0%,var(--tcolor) 34%,color-mix(in srgb,var(--violet) 78%,var(--tcolor) 22%) 48%,color-mix(in srgb,var(--violet) 78%,var(--tcolor) 22%) 52%,var(--tcolor) 66%,var(--tcolor) 100%);}
.consent-h .ch-2{--tcolor:var(--ink);color:var(--ink);font-weight:var(--w-label);background-image:linear-gradient(100deg,var(--tcolor) 0%,var(--tcolor) 34%,color-mix(in srgb,var(--violet) 78%,var(--tcolor) 22%) 48%,color-mix(in srgb,var(--violet) 78%,var(--tcolor) 22%) 52%,var(--tcolor) 66%,var(--tcolor) 100%);}
/* Position range is deliberately kept to exactly 0%->100% (not a wider "160% to -60%" travel,
   which was tried and broke: with background-size>100% and background-repeat:no-repeat, any
   background-position outside [0%,100%] pushes part of the gradient image off the box with
   nothing behind it — background-clip:text then paints those glyphs with NO fill at all
   (invisible), which showed up as whole Thai characters vanishing mid-sweep, not just dimming.
   0%..100% is the one range where the math guarantees the (220%-wide) image always fully
   overlaps the 100%-wide box, so every glyph keeps a solid, visible fill at every frame. */
@keyframes shimmerSweep{0%{background-position:0% 0;}100%{background-position:100% 0;}}
/* .shimmer-violet (2026-08-28, per direction — Games' "6 เกม 6 มุมมอง" heading, "รูปแบบเดียวกับหน้า
   กำลังวิเคราะห์ แต่ใช้สีม่วงเดิม") — same shimmer mechanism as .consent-h .ch-1/.ch-2 above (same
   220%-wide gradient/no-repeat/background-clip:text setup, same shimmerSweep keyframe/4.2s timing,
   same reduced-motion story: the global `*{animation:none}` rule freezes this on a fully-opaque
   frame, never blank), just re-based on the already-violet resting color this heading had instead
   of muted/ink. Since the base IS violet here, "mix toward violet" (what ch-1/ch-2 do) would be a
   no-op — the highlight mixes toward white instead, at the same 78/22 ratio, which on this palette's
   pastel --violet (#9c91ff) still reads as "light passing over violet ink", not a foreign flash.
   Selector is the compound .ev-empty-t.shimmer-violet, not bare .shimmer-violet, so its `color`
   reliably beats .ev-empty-t's own color:var(--ink) regardless of the two rules' source order —
   .ev-empty-t is declared further down (with the rest of the shared component library), which
   would otherwise win the (equal-specificity) cascade and leave `color` at ink as a dead fallback
   (harmless today since -webkit-text-fill-color:transparent is what actually paints everywhere this
   matters, but wrong/confusing if that fallback ever needed to kick in). */
.ev-empty-t.shimmer-violet{background-repeat:no-repeat;background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--violet);background-image:linear-gradient(100deg,var(--violet) 0%,var(--violet) 34%,color-mix(in srgb,var(--white) 78%,var(--violet) 22%) 48%,color-mix(in srgb,var(--white) 78%,var(--violet) 22%) 52%,var(--violet) 66%,var(--violet) 100%);animation:shimmerSweep 4.2s ease-in-out infinite;}
/* .shimmer-ink (2026-08-31, per direction — Games' "Coming soon" line, "text color และ shimmer เป็น
   แบบเดียวกับหน้ากำลังวิเคราะห์ แต่ text size, text weight เหมือนเดิม") — reuses the reveal screen's
   .consent-h .ch-2 recipe verbatim (ink base, mixed toward violet at the same 78/22 ratio, same
   220%-wide gradient/shimmerSweep/4.2s timing) rather than .shimmer-violet above, since "Coming soon"
   rests on plain ink (.ev-empty-t's own color) not violet — .ch-2 is the ink-based half of that
   screen's shimmer, .shimmer-violet is a violet-based variant made for an already-violet heading.
   Font-size/weight are deliberately untouched — this only overrides `color`/background/animation, so
   the call site keeps its own inline font-size and .ev-empty-t's own font-weight exactly as before. */
.ev-empty-t.shimmer-ink{background-repeat:no-repeat;background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--ink);background-image:linear-gradient(100deg,var(--ink) 0%,var(--ink) 34%,color-mix(in srgb,var(--violet) 78%,var(--ink) 22%) 48%,color-mix(in srgb,var(--violet) 78%,var(--ink) 22%) 52%,var(--ink) 66%,var(--ink) 100%);animation:shimmerSweep 4.2s ease-in-out infinite;}
/* Shimmer removed from the consent screen's own "รู้จัก ตัวคุณ?" headline (2026-08-20, per direction
   "คำว่า รู้จัก ตัวคุณ? เอา shimmer ออก") — scoped to :not(.reveal-h) so the reveal screen's
   .consent-h.reveal-h ("ตัวตนนักลงทุนของคุณ / กำลังจะปรากฏ...") keeps its shimmer untouched; only
   this screen's plain heading reverts to flat, static color (falls back to the .ch-1/.ch-2 `color`
   declared above, same as before the shimmer treatment existed). */
.consent-h:not(.reveal-h) .ch-1,.consent-h:not(.reveal-h) .ch-2{animation:none;background-image:none;-webkit-background-clip:initial;background-clip:initial;-webkit-text-fill-color:initial;}
.consent-p{position:relative;z-index:2;font-size:var(--fs-body);font-weight:var(--w-body);color:var(--muted);line-height:1.65;max-width:280px;margin:0 auto;}
/* "คู่มือลงทุนของคุณ" emphasis (2026-08-15, per direction) — ink/700 against the paragraph's own
   muted/500 base, same two-weight device used elsewhere in the file rather than a new pattern. */
.consent-p b{color:var(--ink);font-weight:var(--w-label);}
.round-cards{position:relative;z-index:2;display:flex;gap:var(--sp-inline);width:100%;margin:32px 0 4px;}
.round-card{flex:1;border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-card-pad-sm);background:var(--white);}
.rc-top{display:flex;align-items:center;justify-content:center;gap:var(--sp-glue);margin-bottom:var(--sp-list);}
.rc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
/* color+weight bumped to ink/700 (2026-08-15, per direction "card รายละเอียด ส่วนที่ 1,2,3 text
   สีดำ text weight 700") — was an unweighted (inherits 500) muted eyebrow, same tier as a dozen
   other quiet labels in the app; here it's the one thing naming which section is which, so it
   reads as a real label now instead of a footnote. */
.rc-kicker{font-family:var(--font);font-size:var(--fs-eyebrow);letter-spacing:0.08em;text-transform:uppercase;color:var(--ink);font-weight:var(--w-label);}
/* weight bumped w-head->w-label (2026-08-28, per direction "card ข้อมูล ส่วนที่ 1,2,3...text weight
   700") — was 500. */
.rc-title{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);margin-bottom:4px;}
.rc-meta{font-family:var(--font);font-size:var(--fs-meta);color:var(--muted);}
/* .consent-check-row/.cc-box/.consent-check/.cc-text (the PDPA data-consent checkbox) and
   .consent-caption removed entirely 2026-08-15, per direction ("เอาส่วนยอมรับให้เก็บคำตอบออก",
   "เอาคำว่า ตอบตามใจจริง...ออก") — #startBtn's gating on st.consent was removed to match. */
/* Button now hugs its own label width instead of stretching full-bleed (2026-08-16, per direction
   "อยากให้ความกว้าง button ไม่ฟิ๊กยาว อยากให้ยืดหยุ่นตาม padding hug ของ button") — matches how the
   splash CTA (#cta-slot) and quiz nav's primary button already behave (both content-sized + centered
   within their own bar, never stretched). .btn's own base rule is already display:inline-flex with
   padding:0 24px, so it hugs on its own once width:100% is removed here; text-align:center on the
   wrapper centers it in the (still full-width, for the sticky-bar background) .consent-btn box. */
.consent-btn{width:100%;margin-top:26px;text-align:center;}
/* Fixed to the bottom on mobile (2026-08-15, per direction "ตำแหน่งเดียวกับ button ในหน้าแบบทดสอบ")
   — same technique as .q-nav's mobile rule right above: margin-top:auto already parks it at the
   bottom of .consent's own flex column; position:sticky;bottom:0 then holds it at the visible
   viewport bottom. Bug fix (same day): q-nav's own comment relies on width:auto + "q-scroll's
   default align-items" (stretch) to size the box to the full bleed width — but .consent sets
   align-items:CENTER (needed for its own centered text block), so width:auto alone just shrinks
   the box to its content instead. align-self:stretch overrides the parent's center alignment for
   this one child specifically, so it stretches to the cross-axis exactly like q-nav's does. */
/* Mobile: padding-bottom bumped 14→36 and .consent's own bottom padding zeroed (see the twin fix on
   .q-scroll/.q-nav) so the CTA's bottom edge lands the SAME distance from the screen edge as the
   splash + quiz CTAs — measured within 1px across all three (2026-08-16, per direction "button ที่
   ฟิ๊ก bottom มีตำแหน่ง (จาก ด้านล่างสุด) เท่ากับ splash"). */
:root[data-view="mobile"] .consent{padding-top:var(--sp-list);padding-bottom:0;}
:root[data-view="mobile"] .consent-btn{position:sticky;bottom:0;z-index:6;width:auto;align-self:stretch;margin:auto calc(-1*var(--sp-edge)) 0;padding:14px var(--sp-edge) calc(25px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 45%,color-mix(in srgb,var(--paper) 50%,transparent) 75%,transparent);}
.consent-caption b{font-weight:var(--w-label);color:var(--ink);}

/* ── BOOK — scene-based: hairlines, not shadows ── */
/* Book section rhythm: ONE uniform gap between every top-level block via flex `gap`, instead of each
   card carrying its own margin-bottom (which had drifted to a mix of 18/28/44/0). Every direct child
   of .scroll — prog card, hero, efin banner, pdf bar, every data card, quote, route, library — is now
   separated by exactly --sp-section, so section boundaries read consistently down the whole scroll. */
.scroll{flex:1;padding:var(--sp-inline) var(--sp-edge) 96px;display:flex;flex-direction:column;gap:var(--sp-section);}
/* fixed bottom tab bar — pinned within the app frame (max-width:inherit copies .shell's own responsive max-width so it never spans wider than the app on tablet/pc); stub navigation only, no destinations exist yet besides this page */
.book-tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:inherit;z-index:90;display:flex;justify-content:space-around;align-items:center;background:var(--popover);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line-header);padding:var(--sp-list) 4px calc(var(--sp-list) + env(safe-area-inset-bottom,0px));}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:var(--sp-stack-tight);background:none;border:none;font-family:var(--font);cursor:pointer;color:var(--muted);padding:4px var(--sp-inline);}
.tab-item svg{width:var(--ic-lg);height:var(--ic-lg);}
.tab-item span{font-size:var(--fs-label);font-weight:var(--w-label);}
.tab-item.active{color:var(--violet);}
/* Bug fix (2026-09-03, responsive audit — real 320px phone) — .tab-item has no explicit flex-basis,
   so its default flex-shrink:1 let the 5 items compress once their combined content (icon-or-label
   width + var(--sp-inline)=12px padding each side) overflowed the row: at 320px the 5 items' natural
   widths summed to ~327px against ~312px of usable row width (320 - the bar's own 4px+4px padding),
   forcing 4 of the 5 labels ("หน้าหลัก"/"คู่มือของคุณ"/"เดินบูธ"/"เกมหลัก") to wrap to 2 lines while
   "โปรไฟล์" (shortest) happened to stay single-line — an uneven, unfinished-looking bar, confirmed via
   getBoundingClientRect (labels wrapping to height 32px vs the one unwrapped label's 16px).
   var(--sp-inline) (12px/side) is this app's "two distinct-but-related items in a row" spacing, sized
   for things like an avatar+label — too generous for a 5-way icon+caption column this narrow. Halving
   just THIS padding at the same ≤420px floor the rest of the file uses for real-narrow-phone fixes
   frees 8px per item (40px across all 5) — comfortably more than the ~15px shortfall — so every label
   renders single-line, confirmed live down to 320px. Icon size/gap untouched; still a real regression
   risk if a longer future label is added, but today's 5 labels have real margin, not a knife-edge fit. */
@media(max-width:420px){.tab-item{padding:4px 8px;}}
/* ══ คู่มือ 2 (Book v2) ══ compare-reveal slider · top content-nav (reuses .toc) — version switch
   moved OFF this in-page pill entirely (2026-08-19, per direction "เอา tab ดูตัวเลือกแบบ...ออก เพื่อ
   จะให้เลือกดูตัวเลือกผ่าน panel แทน") and into the demo panel's own "เวอร์ชันคู่มือ" control (see
   buildDemo) — a real end-user was never meant to see 2 competing Book layouts side by side; this
   was always a demo/review convenience, so it now lives with the panel's other demo-only switches. */
/* compare-reveal (persona การ์ด ก่อน↔หลังงาน) — adapted from compare-reveal.html, DNA-skinned */
/* border-radius promoted 14px->var(--r2) (2026-08-31, per corner-radius audit) — .cr2/.pc-face/
   .scan-cam-frame all hand-typed the same 14px "media frame" magic number independently; the audit
   found --r2 (16px) is close enough to fold them onto the real token instead of leaving a 4th
   unbacked radius value in the file. */
.cr2{position:relative;width:100%;max-width:300px;margin:6px auto 0;aspect-ratio:5/7;border-radius:var(--r2);overflow:hidden;background:var(--cloud);cursor:ew-resize;touch-action:pan-y;user-select:none;isolation:isolate;box-shadow:0 10px 30px rgba(17,19,24,0.15),0 2px 6px rgba(17,19,24,0.09);}
/* Shrink (2026-08-19, per direction) — at the base 300px width (→420px tall, aspect-ratio 5/7) the
   compare-reveal card alone filled almost an entire phone-height viewport, pushing #b2ident-detail
   — the text block that's the whole POINT of dragging the slider — fully below the fold with zero
   of it visible on load. 230px (→322px tall) frees ~100px so the detail's fam-badge and opening
   line peek into view without scrolling, hinting there's more to see. Originally mobile-only ("
   tablet/pc keep the base 300px — they have the width to spare and aren't the viewport this was
   reported against"), but that assumption didn't hold: pc/tablet have spare WIDTH, not spare
   HEIGHT, and the base 300px card (420px tall) pushed #b2ident-detail below the fold there too —
   worse than mobile, since mobile at least showed a peek (2026-08-20, per direction "อยากให้ลดขนาด
   character card ลง เพื่อให้เห็นข้อมูล...อย่างน้อยในปริมาณที่เท่ากับของ mobile"). Extended the same
   230px cap to tablet/pc so all three views free up the identical ~100px of headroom. */
:root[data-view="mobile"] .cr2,:root[data-view="tablet"] .cr2,:root[data-view="pc"] .cr2{max-width:230px;}
.cr2-side{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.cr2-side .pc3d,.cr2-side .pc-tilt{width:100%;height:100%;aspect-ratio:auto;}
.cr2-side .pc-face{box-shadow:none;border-radius:0;}
.cr2-before{clip-path:inset(0 48% 0 0);z-index:2;will-change:clip-path;}
.cr2-chip{position:absolute;top:10px;z-index:6;pointer-events:none;padding:var(--sp-stack-tight) var(--sp-list);border-radius:var(--rpill);color:var(--white);background:rgba(17,19,24,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:var(--font);font-size:var(--fs-eyebrow);font-weight:var(--w-label);letter-spacing:.03em;line-height:1;transition:opacity .18s ease;}
.cr2-chip-b{left:10px;}
.cr2-chip-a{right:10px;}
.cr2-divider{position:absolute;top:0;bottom:0;left:48%;z-index:10;width:2px;margin-left:-1px;background:var(--white);box-shadow:0 0 0 1px rgba(17,19,24,.18);pointer-events:none;}
.cr2-handle{position:absolute;left:50%;top:50%;width:42px;height:42px;display:grid;place-items:center;padding:0;border:2px solid var(--white);border-radius:50%;color:var(--ink);background:var(--white);box-shadow:0 4px 14px rgba(17,19,24,.28);cursor:ew-resize;pointer-events:auto;transform:translate(-50%,-50%);transition:transform .12s ease;}
.cr2-handle:hover{transform:translate(-50%,-50%) scale(1.05);}
.cr2-cap{text-align:center;font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.5;margin:var(--sp-list) auto 0;max-width:280px;}
.cr2-cap b{color:var(--ink);font-weight:var(--w-label);}
/* "หลังงาน" locked/empty state (2026-08-19, per direction "ให้เป็นภาพ preview mockup และมี overlay
   สีเข้มๆ รองพื้นไว้...สื่อสารไปในทางว่า ยังไม่มีข้อมูล") — a plain sibling inside .cr2-after, so it
   reveals/hides in exact sync with the persona art beneath it as .cr2-before's clip-path is dragged
   (only .cr2-before ever gets clipped; .cr2-after is always full-frame underneath it — see
   initCompareReveal's paint()). Shown only when evoCompute() reports 'building' (zero real booth/game
   activity yet), so a genuinely divergent or illustrative post-event persona still renders uncovered. */
.cr2-lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(17,19,24,.7);color:var(--cloud);text-align:center;padding:16px;}
.cr2-lock svg{width:28px;height:28px;}
.cr2-lock span{font-size:var(--fs-bodysm);font-weight:var(--w-label);max-width:20ch;line-height:1.4;}
.b2-panel{display:none;}
