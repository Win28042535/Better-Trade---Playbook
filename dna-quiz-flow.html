/* HERO CARD — FULL GLOW FRAME + MOVING LIGHT TEXTURE (rebuilt 2026-09-03 per DESIGN-DNA.md, which
   supersedes the earlier Origin-Kit comet border and GLOW-BORDER-DNA.md). Direction's core principle:
   "the frame itself IS the glow; the motion is light moving through its surface" — explicitly NOT a
   bright head racing a resting rail (§08 Motion DNA, §14 Don't). So this is a full rewrite of the
   VISUAL, on the SAME aspect-ratio-safe machinery the comet used (kept because it was the robust part):
   an OVERSIZED SQUARE conic per layer (so the conic's angle→position map is never distorted on this
   tall ~1:4 box — the 2 earlier direct-conic / SVG-dash attempts that failed on aspect ratio are
   documented in git history), each MASKED (two solid layers clipped content-box/border-box,
   mask-composite:exclude) down to the real 3px border ring, which is what makes the glow follow
   .hero-gw's REAL edges + corners on any shape. Sizes computed in sizeHeroGlow() below.
   TWO layers now instead of one comet:
   - .hero-glow-base — the frame's ALWAYS-ON spectrum glow (default state, §05). The mirrored Better
     Trade spectrum (cyan→blue→indigo→violet→magenta→orange→…mirror…→cyan) means 0deg===360deg so
     there is NO seam at the wrap (§04/§07), and every neighbouring stop is an adjacent hue so there
     is NO colour jump at any corner. 12s drift (sped up from an initial 24s per direction) = "light
     living in the surface", never a racer.
   - .hero-glow-energy — a soft, WIDE, two-lobed brightness field (░▒▓████▓▒░ symmetric head/tail,
     §06) drifting the SAME direction but faster (5s, sped up from an initial 11s), screen-blended so it LIFTS the spectrum
     beneath (a brighter moving core, §05 "Moving Energy") instead of painting a line over it. Two
     lobes 180deg apart read as an energy field pulsing through the frame, not one dot. Loop-closed
     at 0/360 (both transparent) so no reset is ever visible (§08).
   Ambient bloom (§03 outer layer) = drop-shadow on the .hero-glow PARENT — it operates on the
   already-masked ring's alpha, so it blooms the RING shape outward, cheaply, without a 3rd blurred
   layer. Glow fades in on viewport entry via .glow-on (§10 Scroll Reveal, wired in sizeHeroGlow).
   Hover nudges core brightness + bloom only (§09). prefers-reduced-motion freezes the flow but keeps
   the frame glowing (§12). */
.hero-gw{position:relative;padding:3px;border-radius:calc(var(--r2) + 3px);}
.hero-in{position:relative;z-index:1;background:var(--white);border-radius:var(--r2);padding:var(--sp-block) var(--sp-card-pad);}
/* Outer wrapper carries the ambient bloom + the scroll-reveal fade. Its filter also establishes an
   isolated stacking context, so the energy layer's screen blend resolves only against the base ring,
   never bleeding onto page content behind the frame. */
.hero-glow{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  filter:drop-shadow(0 0 6px rgba(114,45,244,.30)) drop-shadow(0 0 14px rgba(0,212,254,.16));
  opacity:0;transition:opacity 1.1s var(--ease);}
.hero-gw.glow-on .hero-glow{opacity:1;}
.hero-glow-mask{position:absolute;inset:0;padding:3px;border-radius:inherit;overflow:hidden;box-sizing:border-box;}
/* Bug retained from 2026-08-30 — declaring BOTH standard mask-composite:exclude AND legacy
   -webkit-mask-composite:xor on the same rule silently breaks the 2-layer XOR composite in this
   engine (nothing revealed). @supports picks exactly one set per engine instead of both at once. */
@supports (mask-composite:exclude){.hero-glow-mask{mask-image:linear-gradient(#fff 0 0),linear-gradient(#fff 0 0);mask-clip:content-box,border-box;mask-composite:exclude;}}
@supports not (mask-composite:exclude){.hero-glow-mask{-webkit-mask-image:linear-gradient(#fff 0 0),linear-gradient(#fff 0 0);-webkit-mask-clip:content-box,border-box;-webkit-mask-composite:xor;}}
.hero-glow-base,.hero-glow-energy{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(0deg);will-change:transform;}
/* BASE — always-on spectrum ring (§05 Default State: full glow on all 4 sides + corners). Mirrored
   Better Trade spectrum (§04) so 0deg===360deg (seamless, §07) and every step is an adjacent hue. */
.hero-glow-base{opacity:.85;animation:heroGlowDrift 12s linear infinite;
  background:conic-gradient(from 0deg,
    #00D4FE 0deg,#1F87E6 36deg,#113CF3 72deg,#722DF4 108deg,#E63BD8 144deg,
    #F79319 180deg,#E63BD8 216deg,#722DF4 252deg,#113CF3 288deg,#1F87E6 324deg,#00D4FE 360deg);}
/* ENERGY — two soft wide lobes (§06 soft head→core→tail falloff), screen-blended to brighten the
   spectrum beneath. Faster drift (5s) than the base so light appears to flow THROUGH the frame. */
.hero-glow-energy{mix-blend-mode:screen;opacity:.9;animation:heroGlowFlow 5s linear infinite;
  background:conic-gradient(from 0deg,
    rgba(255,255,255,0) 0deg,rgba(255,255,255,0) 40deg,
    rgba(255,255,255,.12) 66deg,rgba(255,255,255,.42) 90deg,rgba(255,255,255,.12) 114deg,
    rgba(255,255,255,0) 140deg,rgba(255,255,255,0) 220deg,
    rgba(255,255,255,.12) 246deg,rgba(255,255,255,.42) 270deg,rgba(255,255,255,.12) 294deg,
    rgba(255,255,255,0) 320deg,rgba(255,255,255,0) 360deg);}
@keyframes heroGlowDrift{to{transform:translate(-50%,-50%) rotate(360deg);}}
@keyframes heroGlowFlow{to{transform:translate(-50%,-50%) rotate(360deg);}}
/* Hover (§09) — subtle: brighten the moving core + a touch more ambient bloom. Frame stays fully
   glowing; nothing turns into a hard line. */
.hero-gw:hover .hero-glow{filter:drop-shadow(0 0 8px rgba(114,45,244,.40)) drop-shadow(0 0 18px rgba(0,212,254,.22));}
.hero-gw:hover .hero-glow-energy{opacity:1;}
/* Responsive (§11) — keep the SAME full-spectrum ring + soft field everywhere (reduce INTENSITY,
   not coverage), just quieter + lighter bloom on smaller screens. */
@media(max-width:1024px){.hero-glow{filter:drop-shadow(0 0 5px rgba(114,45,244,.24)) drop-shadow(0 0 11px rgba(0,212,254,.13));}.hero-glow-energy{opacity:.8;}}
@media(max-width:640px){.hero-glow-base{opacity:.78;}.hero-glow-energy{opacity:.7;}}
/* Reduced motion (§12) — freeze the flow but KEEP the frame glowing (base spectrum + a static energy
   position remain); no content depends on the motion. */
@media(prefers-reduced-motion:reduce){.hero-glow-base,.hero-glow-energy{animation:none!important;}.hero-glow{transition:none;}}
/* Centered + a real pill chip instead of quiet uppercase eyebrow text — this is the card's own
   identity line ("Visionary ✦ ผู้มองการณ์ไกล"), so it should read as a badge, not a caption. No
   leading dot (removed per direction — the ✦ inside famTh already marks it, a second dot in front
   was redundant clutter). */
/* Flat neutral-gray pill read as plain/uninteresting per direction ("เด่น หรือน่าสนใจขึ้น") —
   same size and shape, but now tinted+colored with the ACTIVE family's own accent (cyan/violet/
   pink) instead of a generic gray, matching the family-color language already used everywhere
   else on this card (icons, chip fills, str-box borders). bg/color are set inline per-render (and
   updated live on tab switch, see renderBook/heroPanelBody call sites) since they depend on
   whichever persona is currently showing, not a fixed value. */
.fam-badge{display:flex;width:fit-content;align-items:center;gap:var(--sp-glue);font-family:var(--font);font-size:var(--fs-bodysm);font-weight:var(--w-label);letter-spacing:0.01em;margin:0 auto var(--sp-card-pad-sm);padding:var(--sp-glue) var(--sp-stack);border-radius:var(--rpill);}
/* h.famIcon (2026-08-15, per Icon System audit review "ปรับให้เข้ากับ token ที่มี") — every persona
   already carries this (copied from FAM[fam].icon: lc-shield/lc-compass/lc-sparkles) but nothing
   rendered it, so the badge showed text only. Now shown at --ic-sm, tinted via currentColor so it
   automatically matches whatever accent famBadgeStyle() sets on the badge. */
.fam-badge svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
.hero-lay{display:flex;gap:var(--sp-stack);align-items:flex-start;}
.hero-art{flex-shrink:0;width:106px;border-radius:var(--r1);overflow:hidden;border:1px solid var(--line-soft);}
.hero-art-in{width:106px;height:134px;background:var(--accent);display:flex;align-items:center;justify-content:center;}
.hero-art-in svg{width:44px;height:44px;color:var(--ink);opacity:.35;}
.hero-art-ft{background:var(--paper);border-top:1px solid var(--line-soft);padding:var(--sp-glue) var(--sp-list);font-family:var(--font);font-size:var(--fs-meta);font-weight:var(--w-head);color:var(--ink);text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;letter-spacing:0.04em;}
.hero-art-ft svg{width:var(--ic-sm);height:var(--ic-sm);}
.hero-tx{flex:1;min-width:0;}
.hero-en{font-size:var(--fs-eyebrow);font-weight:var(--w-head);letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--sp-hairline);font-family:var(--font);}
.hero-th{font-size:var(--fs-heading);font-weight:var(--w-label);color:var(--ink);line-height:1.1;letter-spacing:0;margin-bottom:var(--sp-stack-tight);}
.hero-sig{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);line-height:1.6;margin-bottom:var(--sp-stack);}
/* ความแข็งแกร่ง = green (a clear "this is good" signal — distinct from any persona accent color,
   so it reads the same for every persona); สิ่งที่ต้องระวัง = the same amber the sponsor chip/gold
   badges use (reads as "pay attention", not a scary red). Side-by-side on tablet/pc — was a fixed
   column on every viewport, so a wide screen wasted its own width instead of using it to show both
   at once. */
/* gap bumped sp-list(8px)->sp-stack(16px) (2026-08-31, per direction "padding ระหว่าง section...
   ตอนนี้เบียดๆ") — sp-list is this file's "repeated rows in one list" token (quiz options, bar
   rows), not the "one card section to the next" one; using it here made these 2 full bordered
   cards (ความแข็งแกร่ง/สิ่งที่ต้องระวัง) read as cramped list rows instead of the 2 distinct
   sections they are, unlike the sp-stack gap every OTHER card-to-card boundary on this tab uses
   (.ast-block/.str-grid/.risk-box's own margin-bottom, all sp-stack). */
.str-grid{display:flex;flex-direction:column;gap:var(--sp-stack);margin-bottom:var(--sp-stack);}
:root[data-view="tablet"] .str-grid,:root[data-view="pc"] .str-grid{flex-direction:row;}
/* Real-width fallback (2026-09-02, per direction — "ความแข็งแกร่ง"/"สิ่งที่ต้องระวัง" side-by-side
   columns squeezed every list item down to one word per line on a genuinely narrow real screen like
   iPhone X) — same recurring cause as the tabbar/next-step/spacing fixes before it: data-view is
   demo-panel/state driven, not tied to real width, so a real ≤420px phone with data-view left on
   "tablet"/"pc" still gets the 2-up row layout meant for a much wider column. Targets the SAME
   compound selector as the tablet/pc row rule right above (not bare .str-grid) so the specificity
   actually ties and this wins on source order — confirmed via a live getComputedStyle check that a
   plain `.str-grid{flex-direction:column}` here loses to that higher-specificity rule regardless of
   the media query, before landing on this fix. */
@media(max-width:420px){:root[data-view="tablet"] .str-grid,:root[data-view="pc"] .str-grid{flex-direction:column;}}
.str-grid .str-box{flex:1;}
.str-box{border-radius:var(--r1);padding:var(--sp-card-pad-sm);background:var(--paper);border:1px solid var(--line-soft);}
.str-box.wn{background:var(--paper);border-color:var(--line-soft);}
/* font-size bumped fs-eyebrow->fs-bodysm (2026-08-28, per direction "text title size เท่ากับ
   แลกรับการ์ดตัวจริง") — was 14px (an eyebrow-label size), now matches .redeem-t's 18px title size.
   letter-spacing:0.04em was left in place at the time (an eyebrow-style treatment, kept since only
   size was asked for) — but at 18px instead of the old 14px, that same em-relative tracking reads
   as visibly loose/spaced-out letterforms instead of a subtle label treatment (2026-08-28 follow-up,
   per direction "text spacing ดูห่างๆ ต้องการให้เท่าคำอื่นๆ ปกติ"), so it's dropped to normal here —
   .redeem-t itself (the size this now matches) never had letter-spacing either. */
/* gap bumped sp-glue(6px)->sp-inline(12px) alongside the icon bump below (2026-08-28, per direction
   "alignment ของ text title ตรงกับ บัตร Explorer...") — .str-box and .redeem-note share the same
   16px container padding already, so padding(16) + icon + gap landing on the same 36px total as
   .redeem-note's icon(24)+gap(12) makes both titles' text start flush at the same x position. */
.str-hd{display:flex;align-items:center;gap:var(--sp-inline);font-family:var(--font);font-size:var(--fs-bodysm);font-weight:var(--w-label);margin-bottom:var(--sp-list);color:var(--green-text);}
.str-box.wn .str-hd{color:var(--amber-text);}
/* size bumped ic-sm(16px)->ic-lg(24px) to match .redeem-note's own icon size (2026-08-28, per
   direction "icon size scale เท่ากับของ section บัตร Explorer และ Master Class..."). */
.str-hd svg{width:var(--ic-lg);height:var(--ic-lg);}
/* margin-left added (2026-09-02, per direction — "ข้อความสีดำ...alignment left กับ text title [not]
   กับไอคอน") — .str-hd's title text starts at icon-width + gap (--ic-lg 24px + --sp-inline 12px) from
   the box's own padding edge, but these list rows sit flush at that padding edge instead, one full
   icon-width to the left of where the title reads. Indents them to line up under the title's own
   text start, at every breakpoint (not just mobile) since the ask covers pc/tablet/mobile alike. */
.str-li{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--ink);line-height:1.55;margin-bottom:var(--sp-stack-tight);margin-left:calc(var(--ic-lg) + var(--sp-inline));}
/* สินทรัพย์ที่ถนัด — the one thing this whole card exists to tell the customer ("what you're
   suited for"), so the whole block is its own tinted panel (background+border in the persona's
   accent color, applied inline via h.accent) instead of just sitting bare on the card surface —
   this is the highlight the customer should see they're "คู่ควรกับ", not a footnote. */
.ast-block{border-radius:var(--r1);padding:var(--sp-card-pad-sm);margin-bottom:var(--sp-stack);}
.ast-lbl{display:flex;align-items:center;gap:var(--sp-inline);font-family:var(--font);font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);margin-bottom:var(--sp-inline);}
.ast-chips{display:flex;flex-wrap:wrap;gap:var(--sp-list);}
/* Solid accent fill (prior pass) read as TOO loud — competing with the character card above it
   for attention. Back to a tint fill, but a stronger one than .ast-block's own 12% wrapper tint
   (26%) so the chip still visibly "pops" off that background instead of blending into it; icon +
   label are solid accent color (not ink) so the chip still reads as clearly on-theme. */
.chip{display:inline-flex;align-items:center;gap:var(--sp-glue);padding:var(--sp-list) var(--sp-stack);border-radius:var(--rpill);border:none;font-size:var(--fs-bodysm);font-weight:var(--w-label);}
.chip svg{width:var(--ic-sm);height:var(--ic-sm);}
/* SKILL ประจำการ์ด (2026-08-31, sits right after .str-grid in heroDetailBody) reuses .conf-box/
   .conf-glow/.conf-row/.conf-tr/.conf-fi/.conf-vl wholesale (see skillCardHTML's own comment). All
   the .skc-* modifiers below use COMPOUND selectors (.conf-x.skc-x, not .skc-x alone) — .conf-rl/
   .conf-tr/.conf-fi/.conf-vl are defined further down this sheet, so a same-specificity .skc-x alone
   loses that cascade to them (confirmed live via getComputedStyle the first time this was tried). */
.skc-t{font-family:var(--font);font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);margin-bottom:var(--sp-inline);}
/* label: w-body(500) per direction (2026-08-31 3rd round — supersedes the w-label(700) the round
   before this gave it). Width still overridden auto+nowrap — .conf-rl's own fixed 86px was sized for
   confRow's short labels (ตัวตน/พฤติกรรม/วินัย) and wrapped these longer ones to 2 lines. */
.conf-rl.skc-rl{width:auto;flex:0 0 auto;white-space:nowrap;font-weight:var(--w-body);color:var(--ink);}
/* bar chart thickness matched to .risk-tr/.risk-fi's own 3px + rounded caps (2026-08-31, per
   direction "chart ความหนาของ bar เท่ากับ bar ของ ความเสี่ยงจริง") — .conf-tr/.conf-fi are a
   1px hairline by default; rpill radius comes along with the thickness bump since a bare 3px
   rectangle (no rounded ends) doesn't read as the same "bar" .risk-fi's own 3px pill does. */
.conf-tr.skc-tr{height:3px;border-radius:var(--rpill);}
.conf-fi.skc-fi{height:3px;border-radius:var(--rpill);}
/* value text size matched to .risk-vl's own fs-sub (2026-08-31, per direction "1/10...text size
   เท่ากับ 1 (section ความเสี่ยง 'บอก' vs 'จริง')") — .conf-vl's own fs-meta(14px) read small next
   to that section's own value numbers. Font-weight bug fix (2026-08-31, found while investigating
   "fix bug") — this comment originally claimed "weight/color/font-family (serif) already matched,
   so only size needed overriding", but that was wrong: .conf-vl's base weight is --w-head(500)
   while .risk-vl's is --w-label(700) — they never matched, so the "1/10" values kept rendering
   visibly lighter than the risk section's own numbers this rule was written to match. Weight added
   below to actually deliver what the comment always claimed was already true. */
.conf-vl.skc-vl{font-size:var(--fs-sub);font-weight:var(--w-label);}
.skc-chiprow{margin-bottom:var(--sp-inline);}
/* Was a single flex row mixing raw text runs with 2 inline spans (dot/.ld + name/.ln) — a flex
   container wraps each direct text-node run into its OWN anonymous flex item, so "แรงบันดาลใจจาก",
   the name, and the "— why" clause each became separate narrow items that wrapped independently
   ("แรงบันดาลใจ"/"จาก" splitting mid-word, the name stranded alone) — read as "broken/half-built"
   per direction. Rebuilt as an explicit label-then-sentence block: one small eyebrow caption
   ("แรงบันดาลใจจาก") on its own line, then the name+why as ONE real paragraph underneath — a
   single wrapping unit instead of several competing ones. */
.hero-leg{display:flex;align-items:flex-start;margin-top:var(--sp-stack);padding-top:var(--sp-stack);border-top:1px solid var(--line-soft);}
.hero-leg-lbl{font-size:var(--fs-eyebrow);font-weight:var(--w-head);letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.hero-leg-txt{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);line-height:1.55;}
.ld{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.ln{font-family:var(--serif);font-weight:var(--w-label);color:var(--ink);}
/* Right-aligned+secondary (prior pass) → full-width+primary per direction: this is the ONE action
   on the identity card worth an ink-filled CTA, so it should read with the same weight as any
   other primary button in the app, not a quiet outlined pill off to one side. */
.hero-acts{display:flex;margin-top:var(--sp-stack);}
.hero-share-btn{flex:1;}
.hero-note{margin-top:var(--sp-inline);display:flex;align-items:flex-start;gap:var(--sp-inline);padding:var(--sp-list) var(--sp-inline);border-radius:var(--r1);background:var(--accent);font-size:var(--fs-eyebrow);font-weight:var(--w-body);color:var(--muted);line-height:1.6;}
.hero-note svg{width:var(--ic-sm);height:var(--ic-sm);flex-shrink:0;margin-top:1px;}
/* .skill-note modifier (2026-08-28, per direction) — scopes the SKILL-disclaimer .hero-note (in
   redeemCardHTML) to redeem-note's own padding/icon size so its icon+text starts flush with
   redeem-note's "บัตร Explorer..." line right above it, WITHOUT touching the plain .hero-note used
   elsewhere (e.g. the hero-sec's own "ตัวตนนี้สรุปจากคำตอบ..." note) — was --sp-inline (12px)/--ic-sm
   (16px), now matches --sp-card-pad-sm (16px)/--ic-lg (24px) exactly like .redeem-note. */
.hero-note.skill-note{padding:var(--sp-card-pad-sm);}
.hero-note.skill-note svg{width:var(--ic-lg);height:var(--ic-lg);}
/* .hero-ev-tabs (the pre/post-event in-card picker inside Book v1's hero card) removed 2026-08-30
   along with คู่มือ 1 itself — see the removal note near BOOK2_TAB. */
.ev-empty{text-align:center;padding:24px var(--sp-inline);border:1px dashed var(--line-strong);border-radius:var(--r1);}
.ev-empty-ic{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-inline);}
.ev-empty-ic svg{width:var(--ic-md);height:var(--ic-md);color:var(--muted);}
/* Games/Booth's "coming soon" states use a full-color illustrated PNG (นาฬิกาทราย.png) instead of
   the lucide lc-hourglass glyph — same icon-set convention as ICON_JOYSTICK_PNG etc. elsewhere in
   the app, which never sit on a tinted circle either (2026-08-28, per direction "ไม่ต้องมี background
   color ด้านหลัง"). Those two call sites zero out .ev-empty-ic's own background inline; this sizes
   the <img> itself — bumped to 48px (2026-08-28, per direction "icon size 48px", was --ic-md/20px)
   — while those same call sites also grow the 44px .ev-empty-ic wrapper to match via inline style,
   so the bigger icon isn't cropped/squeezed into a circle sized for the old 20px lucide glyph. */
.ev-empty-ic img{width:48px;height:48px;object-fit:contain;}
.ev-empty-t{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);margin-bottom:var(--sp-glue);}
/* text-wrap:balance added (2026-09-02, per direction — Games' "Coming soon" copy read as "pushed
   down, disorganized" on a narrow real phone like iPhone X) — measured the actual box model first:
   margins/line-height were already uniform (6px between the two headings, 16px between paragraphs,
   27.9px line-height throughout), so this was never a spacing bug. The real cause is ragged natural
   wrapping: at 375px, "หนึ่งในส่วนสำคัญของ PLAYBOOK ในแบบของคุณ" (and each <br>-separated sentence in
   the longer paragraph below it) breaks with a single orphan word stranded alone on its own line
   ("คุณ", "ทันที") — technically correct wrapping, but it reads as messy/uneven rather than deliberate.
   balance redistributes each wrapped segment's line lengths evenly instead of greedily filling every
   line before wrapping, so short trailing orphans disappear without touching any margin/line-height —
   only where lines break, not the rhythm between them. Falls back to normal wrapping silently on any
   engine that doesn't support it yet (progressive enhancement, not a hard dependency). */
.ev-empty-s{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);line-height:1.55;max-width:34ch;margin:0 auto var(--sp-stack);text-wrap:balance;}
/* Every .ev-empty-s (and, with the Games/Booth "coming soon" states, now sometimes 2+ of them
   stacked) carries its own trailing margin-bottom for the gap ABOVE whatever follows it (another
   paragraph, or a CTA button) — but when there's nothing after the last one, that same margin just
   stacks on top of .ev-empty's own bottom padding, making the bottom gap read far heavier than the
   top (2026-08-28, per a screenshot showing exactly this on Games' new no-button empty state). Zero
   it on whichever child ends up last so the box's own padding is the only bottom space either way —
   a no-op for the existing CTA-button empty states (buttons carry no trailing margin already). */
.ev-empty>:last-child{margin-bottom:0;}
/* The Games "ร่วมสนุกและปลดล็อกได้วันงานเท่านั้น" line went through several passes same-day
   (2026-08-31) before landing here: plain text → +unlock icon in a row layout, neutral
   var(--paper)/var(--line-soft) background with plain var(--ink) text (per "เพิ่ม unlock" then
   "background เป็นแบบเดียวกับความแข็งแกร่ง และ text color เดียวกับสินทรัพย์ที่ถนัด") → reverted to a
   plain centered paragraph again per final direction ("เอาไอคอน unlock ออก / text color สีม่วง /
   background ใช้แบบเดียวกับสินทรัพย์ที่ถนัด / alignment center"): icon removed, no more custom
   row-layout class needed (.ev-empty-s's own centered text-align is enough now that there's no icon
   to lay out beside it), text set to var(--violet) with the .ast-block violet-tint background/border
   recipe (color-mix(violet 8%,white) / color-mix(violet 24%,transparent) — same recipe .ast-block
   itself uses with a persona's h.accent, just with the literal --violet token since this panel isn't
   tied to any one persona). Don't reintroduce .ev-unlock-note/lc-unlock — both removed as dead code. */
/* แลกรับการ์ดตัวจริง — tier-gated like the post-event tracks (.pe-report/.pe-locked share this
   same on/locked pattern): Ultimate can redeem now, everything else sees what unlocks it. */
.redeem-card{margin-top:var(--sp-stack);padding:var(--sp-stack) var(--sp-inline);border-radius:var(--r1);}
.redeem-card.on{border:1px solid var(--amber-border);}
.redeem-card.locked{border:1px dashed var(--line-strong);}
/* Icon moved inline into .redeem-t (2026-08-24, matching .bt-t/.pass-ey's "alignment แนวนอนกลางกับ
   หัวข้อ" fix) — was its own flex item centered against the whole title+subtitle block via
   align-items:flex-start, not the heading line. Size/gap unified off .bt-t-ic (24px) and this
   card's own gap token (var(--sp-inline)), the two reference points per direction. */
.redeem-t{display:flex;align-items:center;gap:var(--sp-inline);font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);}
.redeem-t-ic{width:var(--ic-lg);height:auto;flex:0 0 auto;}
/* Body copy indented to sit under the title text, not the icon (2026-08-24, per direction "title
   และเนื้อหามี alignment ให้ตรงกัน") — same icon-width+gap offset applied to .bt-s/.pass-name/.ds-s
   /.ds-dl below, so every one of these title-row cards reads as one aligned text column. */
.redeem-s{font-size:var(--fs-eyebrow);color:var(--muted);margin-top:2px;margin-left:calc(var(--ic-lg) + var(--sp-inline));line-height:1.5;}
/* Expanded redeem-card content (2026-08-19, per direction — was in the design mockup but never
   built): a quota line + tier-gate pill, a QR/digital-card explainer banner, and a SKILL-value
   disclaimer. Added below the existing on/locked message, not replacing it. */
.redeem-quota{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-inline);margin-top:var(--sp-stack);font-size:var(--fs-eyebrow);color:var(--muted);}
.redeem-tier{display:inline-flex;align-items:center;gap:var(--sp-stack-tight);flex-shrink:0;padding:var(--sp-stack-tight) var(--sp-list);border-radius:var(--rpill);background:var(--accent);color:var(--ink);font-weight:var(--w-label);}
.redeem-tier svg{width:var(--ic-sm);height:var(--ic-sm);}
/* Violet wash/border — same token pair .draw-status.need already uses for "needs attention" info,
   reused here for "here's how the digital vs. physical card split works" rather than inventing a
   new color pairing. */
.redeem-note{display:flex;gap:var(--sp-inline);align-items:flex-start;margin-top:var(--sp-list);padding:var(--sp-card-pad-sm);border-radius:var(--r2);background:var(--active-wash);border:1px solid var(--active-border);font-size:var(--fs-eyebrow);color:var(--ink);line-height:1.55;}
.redeem-note svg{width:var(--ic-lg);height:var(--ic-lg);flex:0 0 auto;color:var(--violet);}
/* PDF download CTA (post-event panel) — full-width violet pill, same --active-fill/border token
   pair as .ds-chip's "in progress" chip, scaled up into a real button since this is the panel's
   own primary action rather than an inline status tag. Locked (not clickable) until Ultimate. */
/* .pdf-dl/.pdf-dl svg (the old flat locked pill) removed 2026-08-28, per direction — superseded by
   a real Liquid Metal button (see mountPdfDlBtn()); .pdf-dl-slot just needs to fill the card's
   width, the button component supplies its own height/shape/color. */
/* No longer a fill-width button (2026-08-28, per follow-up direction "scale เท่ากับของตำแหน่งอื่นๆ
   เช่น สแกน QR / ให้ alignment right") — reverses the previous "fill the card" direction: the
   Liquid Metal button now auto-sizes to its own label (same as every other 'compact'-preset
   instance, mountPdfDlBtn() no longer passes a width override) and this slot just right-aligns it
   within the card instead of stretching it. */
.pdf-dl-slot{width:100%;margin-top:var(--sp-stack);display:flex;justify-content:flex-end;}
.pdf-dl-cap{margin-top:var(--sp-list);text-align:left;font-size:var(--fs-eyebrow);color:var(--muted);}

.card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);overflow:hidden;position:relative;}
/* the corner-bracket frame ornament (a ::after with 8 tiny corner ticks) was removed per direction —
   every .card now reads as a plain flat surface: border + radius only, no extra frame layer. */
/* .mb / .mb-lg are retained as harmless HTML hooks but no longer carry spacing — every section gap
   now comes from .scroll's flex `gap` (--sp-section), so section rhythm lives in exactly one place. */
.s-pad{padding:var(--sp-block) var(--sp-card-pad);}
/* letter-spacing dropped (2026-08-29, per direction "spacing ตัวอักษร ให้เป็นค่าปกติ") — 0.1em is a
   Latin-eyebrow-label tracking value; nearly every .s-ey instance in this file is Thai (ข้อมูลจาก
   กิจกรรมบูธจริง/เฉพาะสำหรับ.../ทำอะไรต่อดี/etc.), where it just read as unusually gappy, not a
   deliberate label treatment. One Latin instance ("AI Insight") loses its tracked-caps look too —
   accepted for one shared class over a one-off exception, matching the "ทั้งหมดในระบบ" (everywhere
   in the system) scope of the direction. Same fix already applied to .sp-kick (2026-08-28) and now
   to .pass-ey/.ns-ey below. */
.s-ey{font-family:var(--font);font-size:var(--fs-eyebrow);font-weight:var(--w-head);text-transform:uppercase;color:var(--muted);margin-bottom:var(--sp-glue);display:flex;align-items:center;gap:var(--sp-glue);}
.s-ey svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--ink);}
.s-h{font-size:var(--fs-heading);font-weight:var(--w-label);letter-spacing:0;color:var(--ink);margin-bottom:4px;}
.s-sub{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);line-height:1.55;margin-bottom:var(--sp-card-pad-sm);}
.upd-pill{display:inline-flex;align-items:center;gap:var(--sp-glue);font-family:var(--font);font-size:var(--fs-eyebrow);font-weight:var(--w-head);letter-spacing:0.04em;color:var(--muted);margin-bottom:var(--sp-card-pad-sm);text-transform:uppercase;}
.upd-pill svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--ink);}
/* Stepped down from --r2 to --r1 (2026-08-15, per Card & Section review "09") — this panel sits
   nested inside a --r2 .card, so it was matching its own parent's radius instead of reading as a
   smaller nested surface; .next-card (same nesting depth, same card) was already --r1. */
.risk-box{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r1);padding:var(--sp-stack) var(--sp-stack);margin-bottom:var(--sp-stack);}
.risk-hd{display:flex;align-items:center;gap:var(--sp-inline);margin-bottom:var(--sp-list);}
/* Hierarchy pass (2026-08-15, "ตอนนี้ดูเท่าๆ กันไปหมด") — .risk-tag/.risk-match/.risk-desc were all
   --fs-bodysm (16px), so the box's one real headline (the "ตรงกัน"/"ต่างกัน N" finding) never stood
   out from its own label or the explanatory paragraph under it. .risk-tag demoted to a small label,
   .risk-match promoted to the actual headline, .risk-desc receded to muted supporting copy. */
/* weight/color bumped w-body/muted -> w-label/ink (2026-08-28, per direction "ความเสี่ยง 'บอก' vs
   'จริง' text weight 700 และสีเดียวกับ สูง - สอดคล้องดี") — reverses the small-label demotion this
   rule got in the 2026-08-15 hierarchy pass above; .risk-match right next to it keeps its own
   already-matching w-label/ink styling, so the two now read at the same weight. */
.risk-tag{font-size:var(--fs-label);font-weight:var(--w-label);color:var(--ink);flex:1;}
.risk-match{display:inline-flex;align-items:center;gap:var(--sp-glue);font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);padding:var(--sp-stack-tight) 0;}
.risk-match .ld{width:6px;height:6px;}
.risk-desc{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);line-height:1.65;margin-bottom:var(--sp-stack);}
.risk-slbl{font-family:var(--font);font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);letter-spacing:0.06em;margin-bottom:var(--sp-list);text-transform:uppercase;}
.risk-bars{display:flex;flex-direction:column;gap:var(--sp-list);}
.risk-row{display:flex;align-items:center;gap:var(--sp-inline);}
.risk-rl{width:86px;flex-shrink:0;font-size:var(--fs-label);font-weight:var(--w-body);color:var(--muted);}
/* Bumped 1px→3px to match .prog-track/.prog-fill (2026-08-15, per Component System review) — the
   two other single-fill bars in the app (.conf-tr/.conf-fi included) read as noticeably thinner
   than the Book page's own top progress bar despite the same "one bar, one fill" idea. */
.risk-tr{flex:1;height:3px;background:var(--line-soft);overflow:visible;position:relative;border-radius:var(--rpill);}
.risk-fi{height:3px;background:var(--ink);position:absolute;left:0;top:0;border-radius:var(--rpill);}
/* The actual risk numbers (8, 6.3) were the smallest text in the whole box (--fs-meta, 12px) despite
   being the data point this section exists to show — bumped to a real stat-number size/weight, same
   serif-numeral language as .conf-sc just below it in the same card. */
.risk-vl{width:50px;text-align:right;font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);font-family:var(--serif);}
/* confidence highlight — the soft blue wash moved here from the identity card (it read poorly overlapping the card art); a quiet radial glow behind the score corner only */
.conf-box{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r1);padding:var(--sp-stack) var(--sp-stack);position:relative;overflow:hidden;}
.conf-glow{position:absolute;top:-45%;right:-15%;width:60%;height:150%;background:radial-gradient(closest-side,rgba(101,152,255,0.18),rgba(101,152,255,0) 70%);pointer-events:none;z-index:0;}
.conf-box>*:not(.conf-glow){position:relative;z-index:1;}
.conf-hd{display:flex;align-items:center;gap:var(--sp-inline);margin-bottom:var(--sp-stack);}
.conf-ic{width:32px;height:32px;border-radius:var(--r1);background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.conf-ic svg{width:var(--ic-md);height:var(--ic-md);color:var(--ink);}
/* letter-spacing dropped 0.08em->normal (2026-08-31, per direction "spacing ของตัวอักษร ดูห่างๆ
   แก้ไขให้ระยะปกติ") — was the standard eyebrow-label tracking, but at this size/weight on an
   all-caps "CONFIDENCE SCORE" it read as too loose; same fix pattern as .str-hd's own tracking
   removal (2026-08-28), just for this label instead. */
.conf-ml{font-family:var(--font);font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);margin-bottom:2px;text-transform:uppercase;}
.conf-mv{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);}
/* Was a bare nested span with a 32px/12px size jump and zero gap — read as two colliding numbers
   stuck together rather than one score. inline-flex + baseline align + a small gap fixes the
   collision; narrowing the size ratio (12px→16px) keeps "/100" legible as part of the same figure
   instead of an afterthought. */
.conf-sc{margin-left:auto;text-align:right;font-family:var(--serif);font-size:var(--fs-title);font-weight:var(--w-label);color:var(--ink);line-height:1;letter-spacing:-0.01em;display:inline-flex;align-items:baseline;gap:3px;}
.conf-su{font-size:var(--fs-sub);font-weight:var(--w-head);color:var(--muted);font-family:var(--font);}
.conf-bars{display:flex;flex-direction:column;gap:var(--sp-list);}
.conf-row{display:flex;align-items:center;gap:var(--sp-inline);}
.conf-rl{width:86px;flex-shrink:0;font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);}
.conf-tr{flex:1;height:1px;background:var(--line-soft);position:relative;}
.conf-fi{height:1px;background:var(--ink);position:absolute;left:0;top:0;}
.conf-vl{width:50px;text-align:right;font-size:var(--fs-meta);font-weight:var(--w-head);color:var(--ink);font-family:var(--serif);}
.conf-note{font-size:var(--fs-eyebrow);font-weight:var(--w-body);color:var(--muted);line-height:1.55;margin-top:var(--sp-stack);}
/* "เล่นเกม 6 ด้าน" CTA (2026-08-26, per direction — the confidence card should route people on to
   the 6 main games, not dead-end once they've read their score). First tried as a small inline
   .btn-primary next to the note, then per follow-up direction ("button style และ layout เดียวกับ"
   the full-width "แชร์ภาพการ์ด" share button) restyled to that same .hero-acts/.hero-share-btn
   shape: note on its own line, full-width dark pill button below. */
.conf-foot{margin-top:var(--sp-stack);}
.conf-foot .conf-note{margin-top:0;margin-bottom:var(--sp-stack);}
.conf-foot .btn-primary{width:100%;}
.radar-sec{padding:var(--sp-block) var(--sp-card-pad);}
.radar-ww{display:flex;justify-content:center;margin-top:var(--sp-stack);}
/* radar's own closing "Insight" line (Radar Chart DNA §2 Visual Structure) — fades in AFTER the
   chart's own reveal sequence finishes (transition-delay 1s, past the last data-point's ~.92s pop),
   so it reads as the chart's payoff rather than competing with it for attention. */
/* align-items:flex-start, not center (2026-08-24, per direction "ไอคอนให้ alignment แนวนอนกลางกับ
   หัวข้อ") — this callout's sentence wraps to 2 lines on the app's mobile-scaled type, so centering
   the icon against the WHOLE wrapped block (old behavior) drifted it below where the sentence
   actually starts; top-aligning keeps it level with that first line regardless of wrap length. */
.radar-insight{display:flex;align-items:flex-start;gap:var(--sp-inline);margin-top:var(--sp-stack);padding:var(--sp-stack-tight) var(--sp-stack);border-radius:var(--r1);border:1px solid var(--line-soft);font-size:var(--fs-bodysm);color:var(--ink);line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity .4s var(--ease),transform .4s var(--ease);transition-delay:1s;}
/* margin-top nudge (2026-08-29, per direction "ให้ไอคอน alignment top กับ text") — align-items:
   flex-start above already box-top-aligns the icon with the text span, but at font-size:18px/
   line-height:1.5 the first line's actual glyph-top sits ~4px below its own line-box top (leading
   split above/below the glyph), so the 16px icon — anchored to the line-box top, not the glyph —
   read as sitting too high relative to the visible characters. This nudges it down to match. */
.radar-insight-ic{display:flex;flex:0 0 auto;margin-top:4px;}
.radar-insight svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
.radar-insight b{font-weight:var(--w-label);}
.viz-in .radar-insight{opacity:1;transform:none;}
/* interests — visualized as % bars (2026-08-26, per direction "อยากให้แสดงผลเป็น visualize + %"),
   fill = real behavior (booth check-ins/activity from BOOTH_CHK/BOOTH_ACT, genuine signal, not
   fabricated). All 10 categories always show; ones with zero real booth signal render muted (a
   paler tint of the SAME violet hue, not gray — 2026-08-26 follow-up direction "อยากให้ visualize
   เป็นสีโทนเดียวกัน...อาจอ่อนกว่าอันดับที่ 1 ก็ได้"), per the caption below the list. Same shape/
   reveal-motion as .trait-row below (grid row + .viz-bar fill), per direction ("motion อิงตาม
   section...เช่น คะแนนพฤติกรรม") — a dashed "stated" marker was tried here first but dropped per
   follow-up direction ("ไม่ต้องมี ขีดแนวตั้ง"). Superseded the even earlier .int-sec-* plain-list
   styling (no bars, no %). */
.int-sec{padding:var(--sp-block) var(--sp-card-pad);border-top:1px solid var(--line-soft);}
.int-bar-list{display:flex;flex-direction:column;gap:var(--sp-stack);margin-top:var(--sp-stack);}
.int-bar-row{display:grid;grid-template-columns:1fr auto;gap:var(--sp-glue) 10px;align-items:center;}
.int-bar-l{font-size:var(--fs-bodysm);color:var(--ink);font-weight:var(--w-label);}
.int-bar-v{font-family:var(--serif);font-size:var(--fs-bodysm);color:var(--ink);font-weight:var(--w-label);}
/* font-weight override dropped (2026-08-29, per direction "text weight 700") — the untouched/muted
   rows (e.g. ต่างประเทศ/กองทุน before that zone's been visited) were dropping to --w-body(500) on
   top of the color dim, so they read lighter AND grayer than the touched rows; color alone already
   carries "not yet visited" here, weight now stays --w-label(700) for every row regardless. */
.int-bar-row.muted .int-bar-l,.int-bar-row.muted .int-bar-v{color:var(--muted);}
.int-bar-tr{grid-column:1/-1;height:6px;border-radius:var(--rpill);background:var(--accent);overflow:hidden;}
.int-bar-fi{height:100%;border-radius:var(--rpill);background:var(--violet);}
.int-bar-row.muted .int-bar-fi{background:color-mix(in srgb,var(--violet) 32%,var(--white));}
.int-bar-note{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.5;margin-top:var(--sp-list);}

/* efin AI banner — static/decorative CTA, no real efin AI wiring exists yet (same stub precedent as the bottom tab bar) */
.efin-banner{background:linear-gradient(135deg,color-mix(in srgb,var(--cyan) 10%,transparent),color-mix(in srgb,var(--violet) 10%,transparent));border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-card-pad-sm);}
.efin-hd{display:flex;align-items:center;gap:var(--sp-inline);margin-bottom:var(--sp-list);}
/* Wordmark (LOGO_IMG.efin) swapped for the efin.finance symbol mark (LOGO_IMG.aiSymbol, 2026-08-20
   per direction) — a square glyph now instead of a 5:1 wordmark, so height stays but width no
   longer needs to run wide; bumped 20->24px since the symbol's detail (gradient triangle) reads
   softer at the old wordmark height. */
.efin-logo{height:24px;width:auto;display:block;flex-shrink:0;}
.efin-t{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);}
.efin-d{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.55;margin-bottom:var(--sp-stack);}
.efin-acts{display:flex;flex-direction:column;gap:var(--sp-list);}
/* Brand blue reserved for efin.finance-specific CTAs only (2026-08-20, per direction "ให้เป็นสีกรณี
   เกี่ยวกับ efin.finance เท่านั้น") — scoped to .efin-acts so this never leaks onto any other
   .btn-primary in the app (Book's PDF/route CTAs etc. keep the default ink primary). */
.efin-acts .btn-primary{background:#007dfe;border-color:#007dfe;box-shadow:0 10px 22px -10px rgba(0,125,254,.5);}
/* "เปิดหน้า efin AI" icon (2026-08-20) — ported directly from the actual efinAI Orb reference build
   (efin AI Sourcecode/efinAI-orb/index.html: .orb/.orb::before + @property --angle), not a
   from-scratch approximation — first pass (a hand-rolled single conic-gradient in the app's generic
   --cyan/--violet/--pink/--yellow tokens) didn't match the real thing, per direction "ยังไม่เหมือน
   ภาพจริง". Kept the reference's actual recipe and literal brand colors (#0D539B blue / #20e71a
   green — efinAI's own palette, not this app's spectrum tokens) so it's visually the same orb:
   soft-edged circular mask (radial-gradient mask, not a hard border-radius clip), 6 stacked
   conic-gradients each rotating a shared --efin-orb-angle custom property at a different
   multiplier/direction (2×/-3×/2×/1×/-2×, matching the source exactly) for the organic swirl,
   blur+contrast filter, inset white glow to feather the edge into the button's own white
   background (same technique the reference uses against its white page background).
   Scaled from the reference's 120px hero size down for a button-inline icon — first --ic-md/20px
   (too big, a solid filled blob reads heavier than a same-size thin-stroke lucide icon), then
   --ic-sm/16px, now --ic-lg/24px (2026-08-20, per direction "efinAI Orb size 24px"). blur/inset
   scaled up proportionally with it — kept well under the reference's own 4px/18px (still tuned
   for a small icon, not the 120px hero) but a touch stronger than the 16px pass so the texture
   doesn't get lost at the larger size. */
@property --efin-orb-angle{syntax:'<angle>';initial-value:0deg;inherits:false;}
.efin-ai-orb{display:block;width:var(--ic-lg);height:var(--ic-lg);flex-shrink:0;border-radius:50%;overflow:hidden;
  -webkit-mask-image:radial-gradient(circle,#000 62%,transparent 100%);mask-image:radial-gradient(circle,#000 62%,transparent 100%);
}
.efin-ai-orb::before{content:"";display:block;width:100%;height:100%;border-radius:50%;
  background:
    conic-gradient(from calc(var(--efin-orb-angle) * 2) at 25% 70%,#20e71a,transparent 20% 80%,#20e71a),
    conic-gradient(from calc(var(--efin-orb-angle) * 2) at 45% 75%,#0D539B,transparent 30% 60%,#0D539B),
    conic-gradient(from calc(var(--efin-orb-angle) * -3) at 80% 20%,#0D539B,transparent 40% 60%,#0D539B),
    conic-gradient(from calc(var(--efin-orb-angle) * 2) at 15% 5%,#0D539B,transparent 10% 90%,#0D539B),
    conic-gradient(from calc(var(--efin-orb-angle) * 1) at 20% 80%,#0D539B,transparent 10% 90%,#0D539B),
    conic-gradient(from calc(var(--efin-orb-angle) * -2) at 90% 10%,#20e71a,transparent 20% 80%,#20e71a);
  box-shadow:inset var(--white) 0 0 3px 1.5px;
  filter:blur(1.5px) contrast(1.35);
  animation:efinOrbRotate 20s linear infinite;
}
@keyframes efinOrbRotate{to{--efin-orb-angle:360deg;}}

/* ══ CHART MOTION + INTERACTION (Dashboard Design & Interaction DNA reference) ══
   Every chart on this page (confidence bars, risk bars, trait bars, allocation bars, radar) used to
   be static — correct final values, zero motion, zero hover response. This adds the reveal-on-scroll
   + chart-appropriate draw animation + hover highlight/dim the reference calls for, without touching
   the numbers themselves (still the same real inline values, just animated into place). One-time
   reveal per card (driven by initCharts(), JS section near radarSVG) — never repeats on re-scroll,
   this is a data-reveal moment, not a decorative loop. `.viz-bar` is the shared "grows from 0 to its
   real value" primitive (confidence/risk/trait rows + allocation segments all use it); the radar gets
   its own center→axis→shape→dots sequence since a width-grow doesn't apply to a polygon. Every rule
   below is a plain `transition`, so the file's existing global `prefers-reduced-motion:reduce`
   kill-switch (`*,*::before,*::after{transition:none!important}`, top of stylesheet) already
   collapses all of this to an instant snap-to-final-value — no separate RM branch needed here. */
.viz-bar{width:0;transition:width .7s var(--ease);}
.viz-in .viz-bar{width:var(--tw,0);}
.risk-row:nth-child(2) .viz-bar{transition-delay:.08s;}
.conf-row:nth-child(2) .viz-bar{transition-delay:.06s;}
.conf-row:nth-child(3) .viz-bar{transition-delay:.12s;}
.conf-row:nth-child(4) .viz-bar{transition-delay:.18s;}
.trait-row:nth-child(2) .viz-bar{transition-delay:.06s;}
.trait-row:nth-child(3) .viz-bar{transition-delay:.12s;}
.trait-row:nth-child(4) .viz-bar{transition-delay:.18s;}
.alloc-seg:nth-child(2){transition-delay:.06s;}
.alloc-seg:nth-child(3){transition-delay:.12s;}
.alloc-seg:nth-child(4){transition-delay:.18s;}

/* radar — "Center → Axis → Shape Expand → Data Points" per the chart-animation reference. Each axis
   ray now "draws" outward from center (stroke-dashoffset via pathLength=1, angle-agnostic) at the
   SAME index-matched delay its data point travels out to sit on it (was: axis just faded in static
   early, then every dot popped in ~0.6s+ later as one late separate burst — direction: "จุด...
   movement พร้อมแกนต่างๆ", the point should move together with its axis, not after it). */
.rk-grid{opacity:0;transition:opacity .3s var(--ease);}
.viz-in .rk-grid{opacity:1;}
.rk-axis{opacity:0;stroke-dasharray:1;stroke-dashoffset:1;transition:opacity .15s var(--ease),stroke-dashoffset .45s var(--ease);}
.viz-in .rk-axis{opacity:1;stroke-dashoffset:0;}
.rk-poly{transform-box:view-box;transform-origin:0 0;transform:scale(0);transition:transform .5s var(--ease) .3s;}
.rk-dot{opacity:0;transform:scale(0);transition:opacity .3s var(--ease),transform .45s var(--ease);cursor:pointer;}
.rk-lab{opacity:0;transition:opacity .3s var(--ease) .85s;}
.viz-in .rk-lab{opacity:1;}
.viz-in .rk-poly{transform:scale(1);}
.viz-in .rk-dot{opacity:1;transform:scale(1);}
.rk-axis:nth-of-type(1),.rk-dot:nth-of-type(1){transition-delay:.08s;}
.rk-axis:nth-of-type(2),.rk-dot:nth-of-type(2){transition-delay:.13s;}
.rk-axis:nth-of-type(3),.rk-dot:nth-of-type(3){transition-delay:.18s;}
.rk-axis:nth-of-type(4),.rk-dot:nth-of-type(4){transition-delay:.23s;}
.rk-axis:nth-of-type(5),.rk-dot:nth-of-type(5){transition-delay:.28s;}
.rk-axis:nth-of-type(6),.rk-dot:nth-of-type(6){transition-delay:.33s;}
/* tap/hover a data point (or its label) → it pops/bolds, the other 5 dim to ~40% — same "active
   100% / inactive ~40-60%" focus rule as the row-hover rule below, but JS-driven (bindRadarTap(),
   near bindAllocHover()) instead of a pure :hover sibling-selector trick (2026-08-29, per direction
   "ให้มี Interaction" — the old version was CSS :hover-only, same "no hover on a touch kiosk" gap
   this file already calls out for .conf-bars/.risk-bars/.trait-row just below, so it never gave a
   real touch/tablet visitor anything; :hover selectors can't express a persistent tap-to-select
   state anyway). .rk-dot/.rk-lab both get cursor:pointer + a bigger invisible tap target isn't
   needed here since the label text itself is the practical tap target, the 3px dot is a bonus for
   precise pointers. */
.radar-ww .rk-dot,.radar-ww .rk-lab{cursor:pointer;}
.radar-ww.sel .rk-dot:not(.rk-act){opacity:.4;}
.radar-ww.sel .rk-dot.rk-act{opacity:1;transform:scale(1.5);}
.radar-ww.sel .rk-lab:not(.rk-act){opacity:.4;}
.radar-ww.sel .rk-lab.rk-act{font-weight:700;fill:var(--ink);}

/* row hover — active row stays full opacity, its siblings dim to ~55% (desktop/mouse only; a touch
   kiosk has no hover, so every row just stays fully visible there, the safer default anyway) */
@media(hover:hover) and (pointer:fine){
  .conf-bars .conf-row,.risk-bars .risk-row,.trait-row{transition:opacity .15s var(--ease);}
  .conf-bars:hover .conf-row,.risk-bars:hover .risk-row,.trait-list:hover .trait-row{opacity:.55;}
  .conf-bars .conf-row:hover,.risk-bars .risk-row:hover,.trait-list .trait-row:hover{opacity:1;}
  .alloc-seg,.alloc-row{transition:opacity .15s var(--ease),filter .15s var(--ease);}
  .alloc-seg.dim,.alloc-row.dim{opacity:.45;}
  .alloc-seg.hi{filter:brightness(1.18) saturate(1.1);}
}

.dd-li{display:flex;align-items:flex-start;gap:var(--sp-inline);font-size:var(--fs-bodysm);color:var(--ink);line-height:1.55;margin-bottom:var(--sp-inline);font-weight:var(--w-body);}

/* shared list-row base — one clickable row: leading marker → text block → optional trailing bit. klib-row/side-row/rs each add only what makes them different (column count, padding, divider). */
.list-row{display:grid;align-items:center;gap:var(--sp-inline);cursor:pointer;}

/* knowledge library — collapsed preview list + "see all" affordance */

.klib-ic svg{width:var(--ic-md);height:var(--ic-md);color:var(--ink);}

/* weight bumped 500->700 to match .bt-t (2026-08-15, per direction "title และ subtitle สัมพันธ์ เป็น
   system เดียวกันกับ section card อื่นๆ") — .bt-t (the "คู่มือลงทุนของคุณ" list-row teaser on Home)
   already reads at --w-label; this near-identical list-row teaser was still the older --w-head. */
.klib-t{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);}
.klib-s{font-size:var(--fs-bodysm);color:var(--muted);margin-top:2px;}
.klib-cv{width:20px;height:20px;color:var(--muted);flex-shrink:0;}
/* align-items:flex-start (2026-08-15, per direction "ตอนนี้ align center") — .klib-s can run to 2
   lines ("41 บทความที่คัดมาสำหรับ [ตัวตน]... ✦ จัดเป็น 8 หมวด"), which was centering the icon and
   chevron against the full wrapped block instead of the title's own line. Scoped to this row only —
   .list-row's shared align-items:center is still right for its other, single-line consumers. */
.klib-row{align-items:flex-start;}
.klib-list{display:flex;flex-direction:column;margin-top:var(--sp-stack);border-top:1px solid var(--line-soft);}
.klib-item{display:flex;align-items:center;gap:var(--sp-inline);padding:var(--sp-inline) 0;border-bottom:1px solid var(--line-soft);font-size:var(--fs-bodysm);color:var(--ink);}
.klib-item:last-child{border-bottom:none;}
/* ══ LIBRARY (คลังความรู้ sub-screen) ══ real category names/counts, accordion-per-category */
.lib-num{font-family:var(--serif);}
.lib-cats{display:flex;flex-direction:column;gap:var(--sp-inline);margin-top:var(--sp-stack);}
.lib-cat{border:1px solid var(--line-soft);border-radius:var(--r1);overflow:hidden;}
.lib-cat-hd{width:100%;display:flex;align-items:center;gap:var(--sp-inline);padding:var(--sp-stack) var(--sp-stack);background:var(--white);border:none;cursor:pointer;font-family:var(--font);text-align:left;}
.lib-cat-ic{width:18px;height:18px;color:var(--muted);flex:0 0 auto;}
.lib-cat-t{flex:1;min-width:0;font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);}
.lib-cat-n{flex:0 0 auto;font-size:var(--fs-eyebrow);font-weight:var(--w-label);color:var(--violet);background:var(--active-fill);padding:var(--sp-stack-tight) var(--sp-list);border-radius:var(--rpill);}
.lib-cat-cv{width:18px;height:18px;color:var(--muted);flex:0 0 auto;transition:transform .18s var(--ease);}
.lib-cat.open .lib-cat-cv{transform:rotate(180deg);}
/* Same max-height mechanism as .side-body/.gr-body — body markup is now always present and just
   collapsed, toggled by direct DOM class changes (see .lib-cat-hd handler) instead of a
   renderLibrary() re-render (2026-08-15, "11 — List rows & expand/collapse"). Padding moves onto
   the inner .lib-cat-bi wrapper so the outer max-height:0 collapses fully. */
.lib-cat-body{max-height:0;overflow:hidden;transition:max-height .28s var(--ease);}
.lib-cat-body.show{max-height:400px;}
.lib-cat-bi{padding:0 var(--sp-stack) var(--sp-stack);}
.lib-stub{display:flex;gap:var(--sp-list);align-items:flex-start;padding:var(--sp-list) var(--sp-inline);border-radius:var(--r1);background:var(--paper);font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.5;}
.lib-stub svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;margin-top:1px;}
.klib-item svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--muted);flex-shrink:0;}
.rk-lab{fill:var(--muted);}
.donut-track{stroke:var(--line-soft);}
.donut-arc{stroke:var(--ink);}
.donut-txt{fill:var(--ink);}
.sides-hd{padding:var(--sp-block) var(--sp-card-pad) var(--sp-stack-tight);}
.side-item{border-top:1px solid var(--line-soft);}
/* align-items:flex-start (2026-08-29, per direction "status...และไอคอน ลูกศรขึ้น-ลง ให้ alignment
   top กับ text title") — same "row wraps to 2 lines, so .list-row's shared align-items:center was
   centering the trailing status chip/chevron against the WHOLE .side-cx block instead of just
   .side-t's own line" fix as .klib-row got in 2026-08-15; also top-aligns .side-num (the leading
   number/check circle) as a side effect, same as that klib-row precedent did for its own leading
   icon. */
.side-row{grid-template-columns:34px 1fr auto;padding:var(--sp-stack) 20px;user-select:none;align-items:flex-start;}
.side-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-meta);font-weight:var(--w-head);flex-shrink:0;font-family:var(--font);}
.side-num.done{background:var(--ink);color:var(--cloud);}
.side-num.act{border:2px solid transparent;background:linear-gradient(var(--white),var(--white)) padding-box,var(--spectrum) border-box;color:var(--ink);}
.side-num.lck{background:var(--accent);color:var(--muted);}
.side-num svg{width:var(--ic-sm);height:var(--ic-sm);}
.side-cx{min-width:0;}
/* size/weight matched to .int-bar-l ("หุ้นไทย" etc., เรดาร์ความสนใจ section) — fs-sub/22px+w-head
   (500) -> fs-bodysm/18px+w-label (700) (2026-08-29, per direction). */
.side-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.3;}
.side-s{font-size:var(--fs-eyebrow);font-weight:var(--w-body);color:var(--muted);margin-top:2px;}
.side-r{display:flex;align-items:center;gap:var(--sp-inline);flex-shrink:0;}
/* Restyled into a colored pill badge (2026-08-29, per direction "status ให้เป็น badge dna
   ลักษณะเหมือนของหน้า เกมส์หลัก / status ต่างกัน สีต่างกัน") — same inline-flex+padding+rpill shape
   as Games' own .gr-played badge, one tint per state reusing tokens already established elsewhere
   in this file rather than inventing new colors: done=green (same recipe as .trait-chip.done — the
   "สีเขียว = เก็บแล้ว" convention the trait-note copy already teaches), act=amber
   (--amber-bg/border/text, same trio .str-box.wn uses for its own "attention" state), lck=the same
   muted/--accent gray .side-num.lck's own circle already uses. */
.sc{display:inline-flex;align-items:center;gap:4px;font-family:var(--font);font-size:var(--fs-label);font-weight:var(--w-head);white-space:nowrap;padding:4px var(--sp-inline);border-radius:var(--rpill);background:var(--accent);color:var(--muted);}
.sc.done{background:color-mix(in srgb,var(--green-text) 12%,var(--white));color:var(--green-text);}
.sc.act{background:var(--amber-bg);color:var(--amber-text);}
.s-cv{width:15px;height:15px;color:var(--muted);transition:transform .2s var(--ease);flex-shrink:0;}
.s-cv.open{transform:rotate(180deg);}
.side-body{max-height:0;overflow:hidden;transition:max-height .28s var(--ease);}
.side-body.show{max-height:400px;}
.side-bi{padding:0 20px var(--sp-card-pad-sm) 66px;}
.side-dl{border-left:1px solid var(--line-soft);padding-left:var(--sp-inline);}
.side-dl p{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--ink);line-height:1.65;margin-bottom:var(--sp-inline);}
.side-loc{display:inline-flex;align-items:center;gap:var(--sp-glue);font-family:var(--font);font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);letter-spacing:0.02em;}
.side-loc svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--muted);}
/* align-items:flex-start + icon margin-top nudge (2026-08-29, per direction "ให้ไอคอน alignment
   top กับข้อความ (ตอนนี้ center)") — same font-size:18px/line-height:1.5 pairing as .radar-insight,
   same fix: box-top-align the row, then nudge the 16px icon down ~4px to match where the first
   line's actual glyph-top sits (line-height leading isn't glyph height, see .radar-insight-ic's own
   comment for the full explanation). */
.side-lh{display:flex;align-items:flex-start;gap:var(--sp-glue);margin-top:var(--sp-inline);font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);line-height:1.5;}
.side-lh svg{width:var(--ic-sm);height:var(--ic-sm);flex-shrink:0;margin-top:4px;}
/* .side-cta-slot (2026-08-29) — replaces the old plain-button .side-cta; right-aligns the mounted
   Liquid Metal button (mountSideCtaBtn()) instead of stretching it, same idiom as .pdf-dl-slot. */
.side-cta-slot{width:100%;margin-top:var(--sp-stack);display:flex;justify-content:flex-end;}
.route-steps{padding:4px 20px var(--sp-card-pad-sm);display:flex;flex-direction:column;}
.rs{grid-template-columns:28px 1fr;align-items:flex-start;padding:var(--sp-stack) 0;border-bottom:1px solid var(--line-soft);}
.rs:last-child{border-bottom:none;}
.rs-n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-meta);font-weight:var(--w-head);flex-shrink:0;font-family:var(--font);}
.rs-n.done{background:var(--ink);color:var(--cloud);}
.rs-n.act{border:2px solid transparent;background:linear-gradient(var(--white),var(--white)) padding-box,var(--spectrum) border-box;color:var(--ink);}
.rs-n.fut{background:var(--accent);color:var(--muted);}
.rs-n svg{width:var(--ic-sm);height:var(--ic-sm);}
/* size/weight matched to .int-bar-l ("หุ้นไทย" etc., เรดาร์ความสนใจ section) — same bump as
   .side-t just above (2026-08-29, per direction). */
.rs-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);margin-bottom:2px;}
.rs-d{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);line-height:1.5;}
.route-cta-w{padding:6px 20px 22px;}
.route-cta-w .btn-primary{width:100%;}

/* ══ HOME TAB ══ landing screen of the 5-tab companion app. Structure/content ported from Playbook
   Final's Home screen (hero banner → tier strip → "ขั้นต่อไปของคุณ" next-step → 3 counters → book
   teaser → agenda → announcements), re-skinned into this app's editorial DNA (spectrum/ink, not the
   source's navy/#007dfe). Each block is a direct child of .scroll so it inherits the same 28px
   section rhythm as the Book page. */
/* .app-topbar (and its own .tb-logo height override) is GONE (2026-08-20, per direction "เปลี่ยน
   header ของหน้าหลัก เดินบูธ เกมส์หลัก โปรไฟล์ ให้ใช้ header ของหน้าคู่มือแทน") — the previous fix
   just hand-matched the override's number (20px→22px) to the Book header's, which still left two
   separate CSS rules that could drift apart again. appHeader() now emits the exact same
   `class="topbar"` (no modifier) as renderBook's own header, so all four screens share
   one single .tb-logo rule (base height below) with the Book page — there is no second number to
   keep in sync. */
.home-hero{position:relative;overflow:hidden;text-align:center;border:1px solid var(--line-soft);border-radius:var(--r2);background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--violet) 14%,transparent),color-mix(in srgb,var(--cyan) 8%,transparent) 46%,var(--white) 78%);padding:22px var(--sp-card-pad) 24px;}
/* "คู่มือลงทุนของคุณ" poster eyebrow — locked to weight 500 (var(--w-head)) in muted gray, matching
   every other eyebrow in the app (.s-ey etc. — see design.md's eyebrow convention). Was flipped to
   700 + a spectrum-gradient-clip in an earlier pass; reverted per direction, this time for good —
   an eyebrow reading louder than the heading under it fought the system's own hierarchy. */
.hh-badge{display:inline-flex;align-items:center;gap:var(--sp-glue);font-size:var(--fs-eyebrow);font-weight:var(--w-head);letter-spacing:0.04em;color:var(--muted);}
.hh-badge svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--muted);}
.hh-badge-tx{font-weight:var(--w-label);color:var(--muted);}
/* Smaller hero logo, bigger emphasis on .hh-sub below — the eyebrow badge/logo were carrying more
   visual weight than the sentence that actually says what this screen is for. */
.hh-logo{display:block;width:min(56%,210px);height:auto;margin:var(--sp-inline) auto 0;}
.hh-sub{font-size:var(--fs-sub);font-weight:var(--w-head);color:var(--ink);line-height:1.55;max-width:34ch;margin:var(--sp-inline) auto 0;}
/* 500 base / 700 emphasized trailing clause — same "text weight play" convention as .q-title/
   .q-title b (emphasizeQ()), hand-authored here since this is one static string, not a per-item
   render. Bolds "ดูย้อนหลังได้บน efin.finance" so the poster subtext isn't one flat weight. */
.hh-sub b{font-weight:var(--w-label);}
.hh-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--sp-list) 18px;margin-top:var(--sp-stack);}
.hh-meta span{display:inline-flex;align-items:center;gap:var(--sp-glue);font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);}
.hh-meta svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--violet);}
/* Poster v3 — the home-hero's only remaining look now (v1's light spectrum-wash and v2's night-sky
   photo background were removed 2026-08-29, per direction "ไม่ต้องมี preview...V1, V2 ลบออก เหลือ
   แค่ V3" — see the deleted POSTER_VER var's own comment for what those looked like). A looping
   video (sky-video-v3-loop.mp4, embedded as BG_VIDEO.sky) sits on its own real <video> element
   (.hh-video, z-index:-2) rather than a CSS background-image, since background-image can't paint a
   <video>; ::before here is just the scrim gradient, no image behind it, layered on top of the
   video (z-index:-1) so it paints behind the card's own in-flow content (badge/logo/sub/meta)
   without needing to touch every one of their z-index values, same trick as elsewhere in this
   file's ink cards (compare .next-step::after, which instead bumps its own children to z-index:1).
   Hover/tap zoom targets .hh-video directly (see the shared :hover rule up in the
   @media(hover:hover) block, and the :active rule below) — same "camera push-in" idiom as
   .prof-av's own hover/active zoom. */
.home-hero.v3{border-color:rgba(255,255,255,.16);}
.home-hero.v3::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(180deg,rgba(8,12,20,.42) 0%,rgba(8,12,20,.6) 42%,rgba(8,12,20,.4) 68%,rgba(8,12,20,.54) 100%);}
.hh-video{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:center 25%;transition:transform .6s cubic-bezier(.16,1,.3,1);}
/* Tablet/pc anchor the video to the TOP (2026-08-24, per direction "ต้องการให้วีดีโอ...alignment
   top เสมอ เพื่อให้เห็นช่องแสง ท้องฟ้า และเมฆด้านบน") — the hero box is wider/shorter at these two
   sizes (.home-hero sits inside the shared 760px content column, see :root[data-view="tablet"/"pc"]
   main.scroll{max-width:760px}), so object-fit:cover's default center crop on the base rule above
   cuts into the sky/light-beam/clouds at the top of sky-video-v3-loop.mp4 that mobile's taller box still
   shows at 25%. Mobile keeps the base rule untouched — only tablet/pc get the top anchor. */
:root[data-view="tablet"] .hh-video,:root[data-view="pc"] .hh-video{object-position:center top;}
.home-hero.v3:active .hh-video{transform:scale(1.04);}
/* Badge+icon retoned gray instead of near-white (2026-08-20, per direction "อยากให้...ใช้เป็นสีโทน
   เทา") — rooted in the same var(--muted) gray this exact badge already uses on v1 (see .hh-badge
   above), lightened toward white just enough to stay legible over the v2 photo's darker scrim
   (measured ~34 avg luminance behind the badge row): plain var(--muted) alone (lum ~110) only hit
   ~2.6:1 contrast there — readable but faint for an already-quiet eyebrow; this mix lands ~4:1
   while still reading as gray, not white. v3 shares the same rule (same dark scrim, just a video
   behind it instead of a photo). */
.home-hero.v3 .hh-badge,.home-hero.v3 .hh-badge-tx,.home-hero.v3 .hh-badge svg{color:color-mix(in srgb,var(--muted) 55%,white 45%);}
.home-hero.v3 .hh-sub{color:var(--cloud);}
.home-hero.v3 .hh-meta span{color:rgba(255,255,255,.8);}
.home-hero.v3 .hh-meta svg{color:var(--cyan);}
/* pass-card — the tier row reworked into a "your ticket" status card: eyebrow ("บัตรของคุณ") +
   prominent tier name, a benefit line, then a divided price row. */
.pass-card{display:block;width:100%;text-align:left;font-family:var(--font);background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-stack) var(--sp-stack);cursor:pointer;}
.pass-top{display:flex;align-items:center;gap:var(--sp-inline);}
.pass-hd{flex:1;min-width:0;}
/* "ความคืบหน้าของคู่มือ" dropped its .pass-ic badge entirely (2026-08-24, per direction "ไอคอนให้
   alignment แนวนอนกลางกับหัวข้อ") — the icon now sits inline inside .pass-ey (its heading) via
   .pass-ey-ic instead of its own flex item centered against the whole pass-hd block, so flex's
   align-items:center centers it against just that one eyebrow line. */
/* letter-spacing dropped (2026-08-29, per direction) — same fix as .s-ey above; "บัตรของคุณ" and
   "ความคืบหน้าของคู่มือ" are this class's only two call sites, both Thai. */
/* align-items:flex-start (2026-09-02, per direction "ให้ไอคอน alignment top กับคำว่า บัตรของคุณ") —
   was center: the tier icon (--ic-lg, 24px) is visibly taller than this eyebrow's own small text, so
   centering the two against each other let the icon overhang above AND below the label; top-aligning
   lines the icon's own top edge up with the text's cap-height instead, reading as deliberate rather
   than just "vertically centered because that's the flex default." */
.pass-ey{display:flex;align-items:flex-start;gap:var(--sp-inline);font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);text-transform:uppercase;}
.pass-ey-ic{width:var(--ic-lg);height:auto;flex:0 0 auto;}
.pass-name{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--ink);line-height:1.15;margin-top:1px;}
/* "บัตรของคุณ"'s tier icon moved from its own .pass-ic badge column, to inline with .pass-name
   (icon+title), to finally here — inline with .pass-ey instead (2026-08-24, per direction "อยากให้
   icon มงกุฎ alignment กับคำว่า บัตรของคุณ") — same icon-in-the-eyebrow treatment "ความคืบหน้าของ
   คู่มือ" already uses, so both .pass-card usages now share one identical layout: icon+.pass-ey on
   one line, .pass-name (indented via .pn-indent below) on the next. */
/* Indent scoped to .pn-indent, not .pass-name itself, in case a future pass-card usage has no icon
   at all (and so needs no indent) — .pn-indent lands .pass-name under its own .pass-ey's text, not
   under the icon that now precedes it in every current usage. */
.pass-name.pn-indent{margin-left:calc(var(--ic-lg) + var(--sp-inline));}
.pass-cv{width:20px;height:20px;color:var(--muted);flex:0 0 auto;}
.pass-benefit{font-size:var(--fs-bodysm);color:var(--muted);margin-top:var(--sp-inline);line-height:1.4;}
.pass-foot{margin-top:var(--sp-inline);padding-top:var(--sp-inline);border-top:1px solid var(--line-soft);display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-list);}
.pass-foot-lbl{font-size:var(--fs-eyebrow);color:var(--muted);}
/* Multi-ticket pass-card (2026-09-02, per direction "จำลองเคส...ลูกค้าบัตร 2 แบบ", revised same day
   per follow-up direction "ใช้ข้อมูล/DNA เดียวกับบัตร 1 ใบ แต่เพิ่มข้อมูลบัตรใบที่ 2 เข้าไป") — no new
   classes needed at all: passCardMultiHTML() just repeats the exact .pass-ey/.pass-name.pn-indent/
   .pass-benefit/.pass-foot block above once per held ticket, inside the same one .pass-card. An
   earlier pass here invented a combined-privileges summary line + a badge/pill layout instead; scrapped
   same day once the direction clarified it should read as "your normal ticket card, just twice," not a
   new card shape. See §7.2's `.pass-card` bullet below for the exact markup this repeats. */
.pass-price{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);}
/* next-step — the ONE prominent home action, an ink card echoing the source's dark navy card */
/* align-items:flex-start (2026-08-15, per direction "align top... ตอนนี้ align center อยู่") — shared
   by Home's "ขั้นต่อไป" card and Games' "เล่นเกมนี้ต่อ" card (same .next-step component) — the 48px
   icon was centering against the full 3-line eyebrow/title/body text block instead of its first line. */
/* Grid-based layout (2026-08-26, per direction — "จัด button alignment center กับ text title" on
   pc/tablet, THEN a follow-up direction that mobile should keep its own older "button pinned to the
   bottom-right, below everything" shape instead of inheriting the pc/tablet centered-beside-title
   position). A flex version of this (icon+title+cta as one row, body below) got the pc/tablet half
   right but had no way to relocate just the CTA to the very bottom on mobile without it also
   dragging the visual order on pc/tablet — flex `order` doesn't reach across the icon+title row's
   own child (.ns-cta-slot) into a spot after a DIFFERENT sibling (.ns-body). Grid areas solve that:
   the same 3 items (icon/title/cta) just get reassigned to different named cells per breakpoint,
   with .ns-body always the one full-width row between them. */
/* align-items:start (2026-08-26, per direction — icon + CTA align-top with "ลุ้นรางวัลใหญ่", i.e.
   the eyebrow line, on EVERY device, not just pc/tablet as the first pass had it) — top-aligns the
   icon/title/cta row instead of centering it against the row's tallest item. */
.next-step{display:grid;grid-template-columns:48px 1fr auto;grid-template-areas:"ic tx cta" ". body body";align-items:start;column-gap:var(--sp-inline);row-gap:var(--sp-stack-tight);background:var(--ink);color:var(--cloud);border-radius:var(--r2);padding:var(--sp-card-pad-sm) var(--sp-card-pad);position:relative;overflow:hidden;}
:root[data-view="mobile"] .next-step{grid-template-columns:48px 1fr;grid-template-areas:"ic tx" ". body" "cta cta";}
/* Bug fix (2026-09-01, per direction — title "ถูกตัดลงมา แล้วเพี้ยน" i.e. wrapping one Thai word per
   line, on a very small screen like iPhone X) — same root cause as the tabbar fix above: on the base
   (tablet/pc-shaped) 3-column grid, the auto-width "cta" column (the "เล่นเกม"/"ร่วมลุ้นรางวัล" button)
   and the fixed 48px icon column together eat most of a genuinely narrow real screen, squeezing the
   1fr "tx" column down to less than one Thai word's width — the mobile-view rule above fixes this
   correctly WHEN data-view is actually "mobile", but a real ≤420px phone with data-view left on
   "tablet"/"pc" (demo panel not reset) still gets the cramped 3-column layout. Real-width fallback,
   independent of data-view, so the cta always wraps below on a genuinely narrow screen regardless of
   which device class is forced. */
@media(max-width:420px){.next-step{grid-template-columns:48px 1fr;grid-template-areas:"ic tx" ". body" "cta cta";}}
/* Extra breathing room above the CTA on mobile only (2026-08-26, per direction — the 4px row-gap
   that separates every row read fine between icon-row→body, but far too tight between body and the
   button once the button dropped to its own row below body on mobile). Scoped to the mobile CTA
   specifically rather than raising row-gap globally, since the icon-row→body gap wasn't flagged. */
:root[data-view="mobile"] .next-step .ns-cta-slot,:root[data-view="mobile"] .next-step .ds-joined{margin-top:var(--sp-block);}
.next-step::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(360px 180px at 100% 0%,color-mix(in srgb,var(--cyan) 22%,transparent),transparent 60%),radial-gradient(320px 170px at 0% 100%,color-mix(in srgb,var(--violet) 26%,transparent),transparent 62%);}
/* 12px confirmed, unchanged (2026-08-31, per corner-radius audit) — already the value .scan-note/
   .scan-mine-qr/.demo-sel were unified onto, so this one needed no edit. */
.ns-ic{grid-area:ic;position:relative;z-index:1;width:48px;height:48px;border-radius:var(--r2);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:var(--cyan);}
.ns-ic svg{width:var(--ic-lg);height:var(--ic-lg);}
/* Home's "ขั้นต่อไป" games-step swaps in a PNG (joystick.png, 2026-08-26 per direction) instead of
   the lc-gamepad-2 SVG — sized to match the SVG it replaces so the badge doesn't jump. */
.ns-ic img{width:var(--ic-lg);height:var(--ic-lg);object-fit:contain;}
.ns-tx{grid-area:tx;position:relative;z-index:1;min-width:0;}
/* letter-spacing dropped (2026-08-29, per direction) — same fix as .s-ey above; covers "ขั้นต่อไป"
   (Home), "เล่นเกมนี้ต่อ" (Games), and "ลุ้นรางวัลใหญ่" (Booth) — this class's only 3 call sites. */
.ns-ey{font-size:var(--fs-eyebrow);font-weight:var(--w-head);text-transform:uppercase;color:rgba(255,255,255,.55);}
.ns-t{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--white);line-height:1.3;margin-top:2px;}
/* .ns-body wraps whatever trailing content a card has (just .ns-b for Home/Games; .ns-b plus the
   booth-only .ds-dl/.ds-chips for the prize-draw card) as ONE grid item, so the grid-area template
   above never has to know how many lines that content happens to be. */
.ns-body{grid-area:body;position:relative;z-index:1;align-self:start;}
.ns-b{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:rgba(255,255,255,.72);line-height:1.5;}
/* .ns-cta-slot replaces the old plain .btn-primary — a Liquid Metal button auto-sizes itself off
   its own label, it doesn't stretch to fill a grid cell the way a <button width:100%> would, so
   justify-self:end (not a stretched width) is what actually right-aligns it in its own cell. */
.ns-cta-slot{grid-area:cta;position:relative;z-index:1;justify-self:end;}
/* "ร่วมลุ้นรางวัล" .btn-primary (2026-08-29) — same compact 38px sizing as .gr-hd .btn-primary
   ("เล่นเกมส์"'s own button, the explicit style reference). No color override needed: this button
   only ever renders inside .next-step.ds-ok (see the markup's own `eligible` guard) which is
   already a light green-tinted card, not the plain dark .next-step base — stock .btn-primary
   (ink bg/cloud text) has plenty of contrast there, same as .gr-play does on Games' white card. */
.next-step .ns-cta-slot.btn-primary{flex:0 0 auto;min-height:38px;padding:0 var(--sp-stack);font-size:var(--fs-label);}
.home-counters{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-inline);}
.hc-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-card-pad-sm);cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;font-family:var(--font);}
.hc-card svg{width:var(--ic-md);height:var(--ic-md);}
.hc-val{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--ink);line-height:1.2;font-family:var(--font);}
.hc-label{font-size:var(--fs-eyebrow);font-weight:var(--w-body);color:var(--muted);line-height:1.35;}
.book-teaser{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-stack);grid-template-columns:1fr auto;}
/* Was flat neutral gray (var(--accent)/var(--ink)) like a plain UI-chrome icon — the book teaser
   is a real content shortcut (same "your guide/identity" idea as the Home pass-card and profile
   tier badge), so it gets the same violet tint those already use instead of reading as generic. */
/* No badge fill (2026-08-24, per direction) — .bt-ic is sole-use for "คู่มือลงทุนของคุณ", which now
   shows the full-color Book.png icon bare instead of a mono glyph on a tinted square. */
/* .bt-ic dropped (2026-08-24, per direction "ไอคอนให้ alignment แนวนอนกลางกับหัวข้อ") — as its own
   44px grid column, centering ran against the icon+subtitle's combined height, not the title line
   next to it. The icon now sits inline inside .bt-t itself (.bt-t-ic), so flex's align-items:center
   centers it against just that one line, matching the heading exactly. .book-teaser's grid dropped
   the now-unused 44px column to match (see below). */
.bt-t{display:flex;align-items:center;gap:var(--sp-inline);font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);line-height:1.25;}
.bt-t-ic{width:24px;height:auto;flex:0 0 auto;}
.bt-s{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.45;margin-top:2px;margin-left:calc(var(--ic-lg) + var(--sp-inline));}
.bt-cv{width:20px;height:20px;color:var(--muted);flex-shrink:0;}
.home-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-card-pad-sm) var(--sp-card-pad);}
.hcard-hd{margin-bottom:var(--sp-inline);}
.hcard-hd svg{width:var(--ic-md);height:var(--ic-md);flex-shrink:0;color:var(--violet);}
/* .hcard-t / .booth-hd .booth-t / .games-hd .games-t / .prof-t all computed to this exact rule —
   five names, one role (2026-08-15, per Card & Section review "08"). Consolidated onto the single
   canonical .s-h; .games-t and .prof-t had zero markup consumers left already and are gone
   entirely, .hcard-t/.booth-t markup sites now use .s-h directly instead of their own class. */
.hcard-s{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.5;margin-top:var(--sp-stack-tight);}
/* ══ BT-TABS ══ generic accessible tab component (bt- prefix, per direction, to avoid clashing
   with this file's own many single-purpose classes) — role=tablist/tab, full keyboard nav, whole-
   group + per-tab disable, optional icon, CSS-only tooltip, light/dark, responsive. Two variants:
