   --primary (underline, for a page-level section switcher) and --secondary (pill/compact, matching
   what .ag-seg/.dd-tab already looked like before this pass — used for both real in-card tab groups
   in this app: the agenda day-selector below, and ddTabs()'s asset drilldown). Behavior lives in
   initBtTabs() near the bottom of the script; markup/ARIA state is plain HTML attributes, not a
   framework, so it works with this file's own render()-replaces-innerHTML pattern. */
.bt-tabs{display:flex;gap:var(--sp-list);}
.bt-tabs[aria-disabled="true"]{opacity:.5;pointer-events:none;}
.bt-tab{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-glue);font-family:var(--font);cursor:pointer;background:none;border:none;color:var(--muted);white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.bt-tab:disabled,.bt-tab[aria-disabled="true"]{opacity:.45;cursor:not-allowed;}
.bt-tab-icon{display:inline-flex;flex:0 0 auto;}
.bt-tab-icon svg{width:var(--ic-md);height:var(--ic-md);}
.bt-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r0);}
/* --primary: underline active state, for a page-level section switcher (not used by either of
   this app's two real instances yet, both of which matched the pill look — kept in the toolkit
   since the brief explicitly asked for both variants to exist). */
.bt-tabs--primary{border-bottom:1px solid var(--line-soft);gap:20px;}
/* Per direction, the horizontal line under THIS specific tab row (asset drilldown, "เจาะรายสินทรัพย์")
   reads as an unwanted extra divider right under the section header — scoped to just this consumer
   via its own .dd-tablist hook, not the shared .bt-tabs--primary base, since the other two consumers
   (profile before/after toggle, scan-mode switcher) still want the underline track. */
.dd-tablist{border-bottom:none;}
.bt-tabs--primary .bt-tab{padding:var(--sp-list) 1px;font-size:var(--fs-bodysm);font-weight:var(--w-head);border-bottom:2px solid transparent;margin-bottom:-1px;}
.bt-tabs--primary .bt-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:var(--w-label);}
@media(max-width:420px){.bt-tabs--primary{overflow-x:auto;scrollbar-width:none;}.bt-tabs--primary::-webkit-scrollbar{display:none;}}
/* --secondary: compact/pill active state. flex-wrap:nowrap (was wrap) keeps every item on ONE row
   — wrap let items size to their own content, which visually read as "uneven, and the one that
   didn't fit fell to a second row" (TOC's original 4 buttons). The original fix forced flex:1 (equal
   width regardless of label length) with ellipsis as a safety net for whatever got squeezed — but
   Book v2's own content-nav (ตัวตน/วิเคราะห์/พอร์ต/เส้นทาง, a real --secondary consumer added later)
   showed this wasn't just a rare-squeeze fallback: "วิเคราะห์"/"เส้นทาง" clip to "วิเคร..."/"เส้นท..."
   on an ordinary 375px phone every time, since forcing 4 labels of different lengths into identical
   widths guarantees the longer ones overflow (2026-08-19 typography review, confirmed via
   scrollWidth>clientWidth on both). Fixed with 3 changes: (1) flex:0 1 auto — each pill sized to its
   OWN label instead of a forced equal share, only shrinking if the row's total content truly exceeds
   the container; (2) padding tightened 10px->6px horizontal, freeing enough width that NEITHER label
   set (this one, or v1's TOC — "Confidence" is the widest single word across both and was checked
   too) needs to shrink at all from ~375px up; (3) below 420px (this component's own icon+padding
   overhead no longer fits either set even un-shrunk) it switches to horizontal scroll instead of
   clipping, same overflow-x:auto pattern --primary already uses right above for the identical
   problem — confirmed zero clipping 375-420px, and a real usable scroll (not a clip) below that,
   down to 320px, for both label sets. Ellipsis rule kept below as a last-resort safety net for any
   future label wider than this can size for even while scrolling. */
.bt-tabs--secondary{flex-wrap:nowrap;justify-content:space-between;}
.bt-tabs--secondary .bt-tab{flex:0 1 auto;min-width:0;padding:var(--sp-list) var(--sp-glue);min-height:40px;font-size:var(--fs-bodysm);font-weight:var(--w-head);border:1px solid var(--line-soft);border-radius:var(--rpill);background:var(--white);transition:color .15s,border-color .15s,background .15s;}
/* Softened from solid --ink/--cloud (2026-08-19, per direction) — sitting right under the header's
   own black "ลงทะเบียน" CTA, a solid-black selected pill read as a second primary button stacked
   underneath it. Switched to the app's existing violet "active" wash (--active-fill/--violet/
   --active-border — same tokens already used for other in-progress/active states, e.g. .rt-badge.new,
   .ds-chip) so the selected tab reads as navigation, not another CTA. */
.bt-tabs--secondary .bt-tab[aria-selected="true"]{background:var(--active-fill);color:var(--violet);border-color:var(--active-border);}
/* Wrap instead of ellipsis-truncate (2026-08-24, bug fix) — on data-view="mobile" the 4 pills
   share the row equally (flex:1 1 0 above) and never scroll by design, but the longest label
   ("วิเคราะห์") still doesn't fit one line at real phone widths (375px and down), so the old
   overflow:hidden+ellipsis clipped it to "วิเครา…" — and at 320px all 4 labels clipped to
   unreadable single-character fragments. Letting the label wrap to 2 lines keeps every label
   fully legible without reintroducing horizontal scroll: .bt-tabs (the row) has no explicit
   align-items, so it defaults to stretch — when one pill grows taller for a 2-line label, its
   3 siblings stretch to match, so the row stays a uniform-height segmented control. */
.bt-tabs--secondary .bt-tab-label{white-space:normal;overflow-wrap:break-word;text-align:center;line-height:1.15;}
@media(max-width:420px){.bt-tabs--secondary{justify-content:flex-start;overflow-x:auto;scrollbar-width:none;}.bt-tabs--secondary::-webkit-scrollbar{display:none;}.bt-tabs--secondary .bt-tab{flex:0 0 auto;}}
/* Same narrow-frame fix as the @media rule above, keyed off data-view instead of raw viewport
   width (2026-08-19, per direction) — the app's own .shell caps at ~400px on data-view="mobile",
   but a real browser viewport can stay well over 420px while showing that narrow frame (desktop
   testing, the demo panel's forced "มือถือ" mode), so the @media query alone never fired there:
   justify-content:space-between kept spacing pill items apart while flex:0 1 auto let them
   shrink-squeeze their own 9px 6px padding to fit — exactly the "gap between items wide, padding
   inside each item squeezed" complaint. flex-start + no-shrink here fixes it regardless of which
   breakpoint actually triggered "mobile". */
/* Follow-up (2026-08-19, per direction) — the flex-start/no-shrink fix above stopped the padding
   squeeze, but left the 4 items packed to the left with dead space at the row's end on a mobile-
   width card. Equal flex-grow (flex-basis 0) instead makes all 4 stretch to fill the card's full
   width evenly, like a real segmented control, while each item's own padding stays untouched since
   nothing is shrinking anymore — only growing. overflow-x/scrollbar no longer needed once items
   fill exactly 100% of the row (nothing left to scroll). */
:root[data-view="mobile"] .bt-tabs--secondary{justify-content:flex-start;}
:root[data-view="mobile"] .bt-tabs--secondary .bt-tab{flex:1 1 0;}
/* Responsive audit follow-up (2026-08-27) — even with the 2026-08-24 wrap fix above, Book v2's own
   4-pill set (ตัวตน/วิเคราะห์/พอร์ต/เส้นทาง) still wrapped ONE label ("เส้นทาง") to 2 lines on an
   ordinary 375px phone while its 3 siblings stayed single-line (confirmed via real screenshot + a
   getBoundingClientRect measurement: labelH 41.4px vs the other three's 20.7px) — every pill stretches
   to match the tallest per the wrap-fix's own align-items:stretch, so heights stayed uniform, but the
   one pill's label sitting alone on 2 lines while its neighbors had dead vertical space around a
   single line still read as an unfinished/inconsistent segmented control, not a deliberate design.
   Root cause: at the 79.8px share each pill gets on a 375px row, the icon+gap+padding ate enough width
   that "เส้นทาง"'s ~40px label had ~2px less room than it needed — but only THAT label, since Thai's
   dictionary-based line-breaking found a valid word-boundary inside it (เส้น+ทาง, a real compound)
   while e.g. "วิเคราะห์" has no such boundary and so never wrapped even though it measures wider.
   Shrinking just this tab bar's icon from --ic-md (20px) to --ic-sm (16px) at mobile width frees the
   ~4px needed — confirmed via live measurement, all 4 labels render single-line 375px down to 390px+,
   and even at the 320px floor only the one genuinely-longest label ("เส้นทาง") still wraps (down from
   two labels wrapping there pre-fix) — a strict improvement, never a regression, at every width. Scoped
   to .bt-tabs--secondary so it doesn't touch the shared .bt-tab-icon svg rule's other consumers
   (v1 TOC, primary tabs, dd-tablist) which keep the full --ic-md icon. */
:root[data-view="mobile"] .bt-tabs--secondary .bt-tab-icon svg{width:var(--ic-sm);height:var(--ic-sm);}
/* Responsive audit regression fix (2026-09-03, real 320px phone) — the 2026-08-27 fix above assumed
   a smaller --fs-bodysm than the app now ships (that token grew to 18px under a later "app-scaled
   typography" pass, per DESIGN-DNA.md), so its "only 'เส้นทาง' wraps at the 320px floor" claim no
   longer held: live measurement now showed BOTH "ตัวตน" (28.6px natural) and "เส้นทาง" (35.7px
   natural) wrapping at 320px, each breaking at its own dictionary word-boundary (ตัว+ตน, เส้น+ทาง)
   the way the 2026-08-27 comment already describes for เส้นทาง alone. "วิเคราะห์" (40.0px natural,
   the actual WIDEST label) still never wraps — it has no such internal boundary — so it was already
   the real ceiling to design for, not a safe assumption to skip.
   Rather than re-derive a font-size-specific icon/padding trim that will just drift out of sync
   again the next time --fs-bodysm changes, this shrinks every space-cost on the pill at once (icon
   16px→14px, its own gap 6px→3px, the pill's internal h-padding 6px→3px, the row's own outer padding
   16px→10px and inter-pill gap 6px→5px) so there's real margin, not a knife-edge fit: verified live
   via getBoundingClientRect down to a real 320px viewport — "วิเคราะห์" (widest) renders at ~40px
   inside ~44-49px of available label room per pill, all 4 single-line, none clipped. 420px matches
   this same component's own existing narrow-phone breakpoint (the @media rules above/below). */
@media(max-width:420px){
  :root[data-view="mobile"] .toc.bt-tabs--secondary{padding-left:10px;padding-right:10px;gap:5px;}
  :root[data-view="mobile"] .bt-tabs--secondary .bt-tab{padding:8px 3px;gap:3px;}
  :root[data-view="mobile"] .bt-tabs--secondary .bt-tab-icon svg{width:14px;height:14px;}
}
/* Tablet/pc had no override at all here — they fell through to the base space-between +
   flex:0 1 auto above, which (unlike mobile's flex:1 1 0 fix) was only ever tuned to stop pills
   clipping on a NARROW frame, not to look deliberate on a much wider ~760px row (see .toc's own
   tablet/pc max-width): space-between anchors the first/last pill to the row's outer edges and
   dumps all the remaining width into the gaps between them, so more screen width only ever meant
   bigger, uneven gaps — never a bigger, better-proportioned control (2026-08-20, per direction
   "tabbar อยากให้ขนาด และ spacing (ระหว่าง item) มีความยืดหยุ่นตามความเหมาะสม สัมพันธ์กันทุก
   อุปกรณ์"). Centered instead, with a real capped `gap` and roomier per-pill padding — pills stay
   content-sized (flex:0 1 auto, same as the base) so no label re-clips, they're just clustered
   together proportionately instead of stretched edge-to-edge. */
:root[data-view="tablet"] .bt-tabs--secondary,:root[data-view="pc"] .bt-tabs--secondary{justify-content:center;gap:14px;}
:root[data-view="tablet"] .bt-tabs--secondary .bt-tab,:root[data-view="pc"] .bt-tabs--secondary .bt-tab{padding:10px 20px;}
/* Bug fix (2026-09-01, per direction — tabbar "เลื่อนมาฝั่งซ้ายสุดไม่ได้ [แต่ยังเลื่อนมาฝั่งขวาสุดได้]")
   — the classic justify-content:center + overflow-x:auto trap: when centered flex content is wider
   than its box, the browser centers it around the box's notional (unclipped) width, so the LEFT half
   of the overflow sits at a negative scroll offset that scrollLeft (whose floor is 0) can never
   reach, while the right half's overflow is a normal positive offset and scrolls fine — exactly the
   asymmetric "can't reach the very left, can reach the very right" symptom. This can only actually
   fire on a real ≤420px viewport (the width the plain @media rule above needs to turn on overflow-x:
   auto in the first place) — but data-view is demo-panel/state driven, not tied to real width (see the
   RESPONSIVE banner comment above), so a real narrow phone with data-view left on "tablet"/"pc" (e.g.
   mid-review, without resetting the demo panel back to "มือถือ") hits it. Forces the same
   justify-content:flex-start the mobile-view rule already proved safe, but ONLY under the real-width
   condition — pills stay centered/roomy at genuine tablet/pc widths, where nothing overflows so this
   never fires. */
@media(max-width:420px){:root[data-view="tablet"] .bt-tabs--secondary,:root[data-view="pc"] .bt-tabs--secondary{justify-content:flex-start;}}
/* Follow-up (2026-09-02, per direction "ไม่ว่าจะเหลือแสดงกี่ item ให้ภาพรวม fill width เต็มความกว้าง
   เสมอ") — flex-start above only stopped the unreachable-scroll bug; it left the row merely LEFT-
   aligned, not filled, so on Pre-Event's 2-tab set (identity+analysis only, see book2Tabs()) the two
   pills clustered together with a big dead gap after them instead of sharing the row — same "packed
   left, dead space at the end" symptom the mobile-view fix below already solved for its own 4-tab
   case. Same fix here: flex:1 1 0 makes every remaining pill grow to fill the row evenly regardless
   of count (2, 4, or any future number), so this narrow-real-width fallback now matches the mobile
   rule's behavior exactly instead of only half of it. */
@media(max-width:420px){:root[data-view="tablet"] .bt-tabs--secondary .bt-tab,:root[data-view="pc"] .bt-tabs--secondary .bt-tab{flex:1 1 0;}}
/* data-tooltip — CSS-only, no JS beyond what initBtTabs already wires for focus */
.bt-tab[data-tooltip]::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--cloud);font-size:var(--fs-label);font-weight:var(--w-body);padding:var(--sp-stack-tight) 9px;border-radius:var(--r0);white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .15s,transform .15s;pointer-events:none;z-index:20;}
.bt-tab[data-tooltip]:hover::after,.bt-tab[data-tooltip]:focus-visible::after{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
/* The one @media(prefers-color-scheme:dark) block in the file was deleted (2026-08-15, per Color
   DNA review "07") — it contradicted this file's own "light theme only" stance elsewhere, and only
   ever covered one component (this tab picker), so a system-dark-mode user got an inverted TOC pill
   and tab picker sitting inside otherwise all-white cards everywhere else. */
.ag-row{display:flex;gap:var(--sp-stack);padding:var(--sp-stack) 0;border-bottom:1px solid var(--line-soft);}
.ag-row:last-child{border-bottom:none;}
/* .ag-time bumped to match .ag-t's own size+weight (2026-08-28, per direction "เวลา...text size
   เท่ากับ กำหนดการ...และ text weight 700 / กำหนดการ...text weight 700") — was fs-eyebrow/w-head
   (14px/500) vs .ag-t's fs-bodysm/w-head (18px/500); both now fs-bodysm/w-label. The old fixed
   width:52px (sized for the smaller 14px label) started wrapping "09:00" onto 2 lines at the
   bigger/bolder size with flex-shrink:0 holding the box at that width regardless — dropped the
   fixed width and added white-space:nowrap instead, so the column just sizes to its own content;
   every AGENDA_D1/D2 time string is the same "HH:MM" length, so columns still line up. */
.ag-time{flex:0 0 auto;white-space:nowrap;font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--violet);line-height:1.45;font-family:var(--font);}
.ag-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.4;}
.ag-by{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.45;margin-top:2px;}
.ag-more{width:100%;margin-top:var(--sp-inline);display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-glue);border:1px solid var(--line-soft);background:var(--white);color:var(--ink);font-family:var(--font);font-weight:var(--w-head);font-size:var(--fs-bodysm);min-height:44px;border-radius:var(--r1);cursor:pointer;transition:transform .15s var(--ease),background .15s var(--ease);}
.ag-more svg{width:var(--ic-sm);height:var(--ic-sm);}
/* Chevron now actually flips (2026-08-28, per direction "กรณีย่อรายการ...ไอคอนต้องเป็น top...ตอนนี้ยัง
   เป็น bottom") — the markup below used to call ic('lc-chevron-down') in BOTH ternary branches (a
   dead conditional, same icon either way), so it always pointed down even in the "ย่อกำหนดการ"
   (collapse) state where an up-pointing chevron is the correct affordance. Same rotate-on-open
   trick as .gr-chev.open (togGame) rather than a second lc-chevron-up symbol. */
.ag-more-ic.open{transform:rotate(180deg);}
/* "เพิ่ม interaction" (2026-08-28, per direction) — same press-scale + desktop-hover-tint idiom as
   .mp-zoom above; this button had cursor:pointer already but no actual press/hover feedback. */
.ag-more:active{transform:scale(.98);}
@media(hover:hover) and (pointer:fine){.ag-more:hover{background:var(--cloud);}}
/* "เพิ่ม interaction" (2026-08-28, per direction) — was a static row with no affordance at all
   (no cursor, no hover/press feedback); same press-scale + desktop-hover-tint idiom as .mp-zoom/
   .ag-more above. No onclick added — there's nowhere for an announcement row to navigate to yet,
   this is purely the tactile "this responds to your tap" polish that was missing. */
.ann-row{display:flex;gap:var(--sp-inline);align-items:flex-start;padding:var(--sp-inline) var(--sp-inline);border-radius:var(--r1);background:var(--paper);cursor:pointer;transition:transform .15s var(--ease),background .15s var(--ease);}
.ann-row:active{transform:scale(.98);}
@media(hover:hover) and (pointer:fine){.ann-row:hover{background:var(--cloud);}}
.ann-row+.ann-row{margin-top:var(--sp-list);}
.ann-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.4;}
.ann-s{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.45;margin-top:1px;}
/* ══ POST-EVENT ("หลังจบงาน · ดูย้อนหลัง") ══ */
.pe-report{display:flex;gap:var(--sp-inline);align-items:flex-start;padding:var(--sp-inline) var(--sp-stack);border-radius:var(--r1);background:var(--paper);margin-top:2px;}
.pe-report.on{background:var(--done-wash);}
.pe-report svg{width:var(--ic-md);height:var(--ic-md);flex:0 0 auto;margin-top:1px;color:var(--muted);}
/* --cyan-ink (which this used to read via a fallback) was retired again 2026-08-15, per Design DNA
   review "--cyan-ink ทางเลือก B" — reverted to a flat --ink instead of wiring the token, since the
   chosen answer this time was to keep the icon's current (ink) look, not make it cyan. */
.pe-report.on svg{color:var(--ink);}
.pe-report-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.4;}
.pe-report-s{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.45;margin-top:2px;}
/* Sized/weighted to match .pe-track-lbl (the "Conference"/"Workshop"/"Master Class" sub-section
   titles further down this same card) — was a small muted eyebrow, reading as a lesser tier than
   its sibling sub-titles despite doing the same job. Color matched to --ink too: at this size/
   weight, muted gray would look like a mismatch against its now-equal-sized siblings. */
.pe-vlbl{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--ink);margin:var(--sp-inline) 0 6px;}
.pe-vlist{display:flex;flex-direction:column;gap:var(--sp-list);}
.pe-vitem{display:flex;align-items:center;gap:var(--sp-inline);padding:var(--sp-card-pad-sm);border-radius:var(--r1);border:1px solid var(--line-soft);background:var(--white);}
.pe-vic{width:36px;height:36px;flex:0 0 auto;border-radius:var(--r1);background:var(--active-fill);color:var(--violet);display:flex;align-items:center;justify-content:center;}
.pe-vic svg{width:var(--ic-md);height:var(--ic-md);}
.pe-vtx{flex:1;min-width:0;}
.pe-vt{font-size:var(--fs-bodysm);font-weight:var(--w-head);color:var(--ink);}
.pe-vs{font-size:var(--fs-eyebrow);color:var(--muted);margin-top:1px;}
.pe-vplay{width:22px;height:22px;flex:0 0 auto;color:var(--violet);}
.pe-track{margin-top:var(--sp-stack);}
.pe-track-hd{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-list);margin-bottom:var(--sp-list);}
.pe-track-lbl{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--ink);}
.pe-track-badge{font-size:var(--fs-label);font-weight:var(--w-head);color:var(--ink);background:var(--accent);padding:var(--sp-stack-tight) var(--sp-list);border-radius:var(--rpill);white-space:nowrap;}
.pe-track-badge.locked{color:var(--muted);}
.pe-track-badge.full{color:var(--ink);background:var(--done-fill);}
.pe-locked{display:flex;align-items:center;gap:var(--sp-list);padding:var(--sp-inline) var(--sp-stack);border-radius:var(--r1);border:1px dashed var(--line-strong);color:var(--muted);font-size:var(--fs-eyebrow);}
.pe-locked svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
.pe-items{display:flex;flex-direction:column;gap:var(--sp-list);}
.pe-item{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-inline);padding:var(--sp-inline) var(--sp-inline);border-radius:var(--r1);border:1px solid var(--line-soft);}
.pe-item-tx{flex:1;min-width:0;}
.pe-item-t{font-size:var(--fs-bodysm);font-weight:var(--w-head);color:var(--ink);line-height:1.35;}
.pe-item-s{font-size:var(--fs-eyebrow);color:var(--muted);margin-top:2px;}
.pe-dl{display:inline-flex;align-items:center;gap:var(--sp-stack-tight);flex:0 0 auto;border:1px solid var(--ink);background:var(--ink);color:var(--cloud);font-family:var(--font);font-weight:var(--w-head);font-size:var(--fs-label);padding:var(--sp-glue) var(--sp-inline);border-radius:var(--rpill);cursor:pointer;white-space:nowrap;}
.pe-dl svg{width:var(--ic-sm);height:var(--ic-sm);}
.pe-lockbtn{display:inline-flex;align-items:center;gap:var(--sp-stack-tight);flex:0 0 auto;color:var(--muted);font-size:var(--fs-label);font-weight:var(--w-head);white-space:nowrap;}
.pe-lockbtn svg{width:var(--ic-sm);height:var(--ic-sm);}
/* Upgrade CTA row — right-aligned per direction (was a centered Liquid Metal slot). .btn-primary's
   own flex:1 is for full-width CTAs; here the button hugs its content and sits at the right edge. */
.pe-cta-row{margin-top:var(--sp-card-pad-sm);display:flex;justify-content:flex-end;}
.pe-upgrade{flex:0 0 auto;}
/* stub screen for not-yet-built tabs (passport/games/profile) */
.stub-wrap{flex:1;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--sp-stack);padding:40px var(--sp-edge);}
.stub-ic{width:72px;height:72px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--muted);}
.stub-ic svg{width:32px;height:32px;}
.stub-t{font-size:var(--fs-heading);font-weight:var(--w-label);color:var(--ink);}
.stub-s{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.55;max-width:30ch;}

/* ══ BOOTH / PASSPORT TAB ══ structure ported from Playbook Final's Passport screen (progress →
   grand-prize status → personalized hero route → per-zone booth check-in), re-skinned to our DNA. */
/* the decorative ✦ inside a bold heading (plain text, not an icon) was inheriting the heading's
   own 24px/700 — reading as its own oversized glyph instead of a quiet separator. .hd-star scales
   it down relative to whatever heading it sits in (em, not a fixed px) and mutes the color. */
.hd-star{font-size:0.6em;color:var(--muted);}
.booth-hd .booth-s{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.45;margin-top:var(--sp-stack-tight);}
/* margin-bottom added (2026-08-15, per direction "ตอนนี้ติดกันอยู่ ให้แยก spacing ตาม system dna") —
   this row and the draw-status callout right after it had no gap between them at all. --sp-list is
   the token for "next row in the same stack", the same relationship these two blocks have. */
.booth-prog{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-inline);margin-bottom:var(--sp-list);}
/* display:flex/column + .bp-bar's margin-top:auto (2026-08-19, per direction "อยากให้ตำแหน่งของ bar
   อยู่ใน alignment ที่เท่ากัน") — .bp-lbl can wrap to 2 lines ("กิจกรรมประจำบูธ" vs the shorter
   "เช็คอินบูธ"), which used to leave the bar sitting at a different height in each card even though
   the grid (`.booth-prog`) already stretches both cards to the same total height. Pinning the bar to
   the card's own bottom edge means it always lands on the same plane across both cards regardless of
   how many lines the label above it wraps to. */
.bp-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-card-pad-sm);display:flex;flex-direction:column;}
/* align-items:flex-start (2026-08-15, per direction "ตอนนี้ดู align กลาง card เป็นหลัก ต้อง align
   top") — .bp-lbl can wrap to 2 lines ("กิจกรรมประจำบูธ" at narrow widths), which was centering the
   icon and .bp-frac number against the full wrapped height instead of the label's first line. */
.bp-hd{display:flex;align-items:flex-start;gap:var(--sp-glue);margin-bottom:var(--sp-list);}
.bp-hd svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
.bp-lbl{flex:1;font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);}
.bp-frac{font-size:var(--fs-bodysm);font-weight:var(--w-label);white-space:nowrap;}
.bp-bar{margin-top:auto;height:6px;border-radius:var(--rpill);background:var(--accent);overflow:hidden;}
.bp-fill{height:100%;border-radius:var(--rpill);transition:width .25s var(--ease);}
/* draw-status (เดินบูธ ✦ ลุ้นรางวัล's "ยังขาด"/"ครบเงื่อนไขแล้ว" card) reskinned onto the shared
   .next-step DNA (2026-08-26, per direction "อยากให้ทั้ง 2 กรณี ใช้ design dna เดียวกับ [เล่นเกมนี้
   ต่อ]...แต่ยังคงการใช้สีทั้ง 2 กรณีเหมือนเดิม") — same icon-badge + eyebrow/title/body + cta-slot
   layout, alignment, and icon/button position as Home's/Games' next-step cards (see .next-step/
   .ns-* below), just recolored per-state instead of .next-step's ink: green wash for .ds-ok (kept
   from the earlier "โทนเขียว" direction), amber wash for .ds-need (kept from the still-earlier
   "โทนเหลืองส้มๆ" direction). Superseded the old .draw-status/.ds-h/.ds-s-with-manual-indent
   layout, which put the icon inline with the title instead of as its own badge. */
.next-step.ds-ok,.next-step.ds-need{color:var(--ink);}
.next-step.ds-ok::after,.next-step.ds-need::after{background:none;}
.next-step.ds-ok{background:color-mix(in srgb,var(--green-text) 7%,var(--white));border:1px solid color-mix(in srgb,var(--green-text) 32%,transparent);}
.next-step.ds-need{background:var(--amber-bg);border:1px solid var(--amber-border);}
.next-step.ds-ok .ns-ic{background:color-mix(in srgb,var(--green-text) 14%,var(--white));border-color:color-mix(in srgb,var(--green-text) 32%,transparent);color:var(--green-text);}
.next-step.ds-need .ns-ic{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber-text);}
.next-step.ds-ok .ns-ey,.next-step.ds-need .ns-ey{color:var(--muted);}
.next-step.ds-ok .ns-t,.next-step.ds-need .ns-t{color:var(--ink);}
.next-step.ds-ok .ns-b,.next-step.ds-need .ns-b{color:var(--muted);}
/* .ds-dl/.ds-chips live inside .ns-body alongside .ns-b, all sharing that one grid cell (see
   .next-step's grid-template-areas above) — no manual indent needed, .ns-body is already
   positioned to align under the title, not the icon. */
.ns-body .ds-dl{font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--ink);margin-top:var(--sp-glue);}
.ns-body .ds-chips{display:flex;flex-wrap:wrap;gap:var(--sp-glue);margin-top:var(--sp-glue);}
.ds-chip{display:inline-block;background:var(--active-fill);color:var(--violet);font-weight:var(--w-head);font-size:var(--fs-eyebrow);padding:4px var(--sp-inline);border-radius:var(--rpill);white-space:nowrap;}
.next-step.ds-need .ds-chip{background:var(--white);color:var(--amber-text);border:1px solid var(--amber-border);}
.ds-joined{grid-area:cta;justify-self:end;display:flex;align-items:center;gap:var(--sp-glue);position:relative;z-index:1;color:var(--green-text);font-weight:var(--w-label);font-size:var(--fs-bodysm);}
.ds-joined svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
.ds-chip{display:inline-block;background:var(--active-fill);color:var(--violet);font-weight:var(--w-head);font-size:var(--fs-eyebrow);padding:4px var(--sp-inline);border-radius:var(--rpill);white-space:nowrap;}
.draw-status.need .ds-chip{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber-border);}
/* hero route */
.route-badge{font-size:var(--fs-label);font-weight:var(--w-head);color:var(--ink);background:var(--accent);padding:4px var(--sp-inline);border-radius:var(--rpill);white-space:nowrap;}
/* aspect-ratio matches Floorplan BTT (1).png's real 3657×2772 (2026-08-26, per direction — swapped
   in for the old square Map.png mockup) — was 1/1, which forced object-fit:cover to crop the sides
   off this wider top-down floor plan. */
.map-ph{position:relative;border:1px solid var(--line-soft);border-radius:var(--r1);overflow:hidden;background:linear-gradient(135deg,var(--paper),var(--cloud));aspect-ratio:3657/2772;display:flex;align-items:center;justify-content:center;margin-bottom:var(--sp-stack);}
.map-ph .mp-in{display:flex;flex-direction:column;align-items:center;gap:var(--sp-glue);color:var(--muted);}
.map-ph .mp-in svg{width:var(--ic-lg);height:var(--ic-lg);}
.map-ph .mp-img{width:100%;height:100%;object-fit:cover;display:block;}
.map-ph .mp-cap{position:absolute;left:10px;bottom:9px;font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--cloud);background:var(--ink);padding:var(--sp-stack-tight) var(--sp-list);border-radius:var(--r0);}
.map-ph .mp-zoom{position:absolute;right:10px;top:9px;display:flex;align-items:center;gap:var(--sp-stack-tight);background:var(--white);color:var(--ink);border:1px solid var(--line-soft);padding:6px var(--sp-inline);border-radius:var(--rpill);font-size:var(--fs-eyebrow);font-weight:var(--w-head);box-shadow:0 2px 6px rgba(17,19,24,.1);cursor:pointer;transition:transform .15s var(--ease),background .15s var(--ease);}
.map-ph .mp-zoom svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
/* "เพิ่ม interaction" (2026-08-28, per direction) — was a static pill with no press/hover feedback
   at all; same :active press-scale idiom .btn/.demo-fab/.go-top already use, plus a hover tint
   under the same @media(hover:hover) desktop-only gate the row-hover system above uses. */
.map-ph .mp-zoom:active{transform:scale(.96);}
@media(hover:hover) and (pointer:fine){.map-ph .mp-zoom:hover{background:var(--cloud);}}
/* map-lightbox — fixed so it clears the app's own scroll container; the real target is a phone
   viewport (.shell fills the screen edge-to-edge there per the ≥480px media query), so fixed
   positioning covers exactly the app, not just this card's scroll area. */
.map-lightbox{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:22px;}
.map-lightbox.show{display:flex;}
.map-lightbox .ml-scrim{position:absolute;inset:0;background:rgba(17,19,24,.6);}
.map-lightbox .ml-card{position:relative;width:100%;max-width:720px;background:var(--white);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow-lg);}
.map-lightbox .ml-body{max-height:74vh;overflow:auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--paper),var(--cloud));}
.map-lightbox .ml-body .ml-img{width:100%;height:auto;display:block;}
.map-lightbox .ml-body .mp-in{display:flex;flex-direction:column;align-items:center;gap:var(--sp-list);color:var(--muted);}
/* 44px — same "hero-tier" spirit as .reveal-icon/.q-icon-bare (one dominant icon in this
   composition, picked per-context rather than forced onto the sm/md/lg UI scale). */
.map-lightbox .ml-body .mp-in svg{width:44px;height:44px;}
.map-lightbox .ml-cap{padding:var(--sp-inline) var(--sp-stack);font-size:var(--fs-bodysm);font-weight:var(--w-head);color:var(--ink);}
.map-lightbox .ml-close{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(17,19,24,.55);color:var(--white);border:none;cursor:pointer;}
.map-lightbox .ml-close svg{width:var(--ic-md);height:var(--ic-md);}
/* 44×44 invisible hit-area (2026-08-30, responsive audit fix) — same technique as .tb-ic::before:
   the visible 32px chip stays the same size/position, a ::before extends the real clickable region
   by 6px on every side (32+6+6=44) so a close tap over a full-screen map lightbox is easier to land. */
.map-lightbox .ml-close::before{content:'';position:absolute;inset:-6px;}
/* ══ QR SCAN MODAL ══ mocked scan flow (analyzed from the demo export — its own version is fully
   mocked too, no real camera API anywhere in that source; ends in one "simulate successful scan"
   button). Lives on <body> like .demo-panel does, so one instance overlays any screen. */
.scan-modal{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:22px;}
.scan-modal.show{display:flex;}
.scan-scrim{position:absolute;inset:0;background:rgba(17,19,24,.6);}
.scan-card{position:relative;width:100%;max-width:340px;background:var(--white);border-radius:var(--r2);padding:var(--sp-card-pad-sm);box-shadow:var(--shadow-lg);}
.scan-x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--ink);border:none;cursor:pointer;}
.scan-x svg{width:var(--ic-md);height:var(--ic-md);}
.scan-hd{padding-right:30px;margin-bottom:var(--sp-stack);}
.scan-t{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);line-height:1.3;}
.scan-s{font-size:var(--fs-eyebrow);color:var(--muted);margin-top:2px;}
/* Scan-mode switcher is .bt-tabs.bt-tabs--primary (swapped per direction, the same tab component
   used everywhere else) — was its own bespoke .scan-tab pill-in-a-track, now one component
   system-wide. */
#scanTabs{margin-bottom:var(--sp-stack);}
.scan-cam{position:relative;border-radius:var(--r2);overflow:hidden;background:#111b25;height:168px;display:flex;align-items:center;justify-content:center;margin-bottom:var(--sp-inline);}
/* border-radius promoted 14px->var(--r2) (2026-08-31, per corner-radius audit) — see .cr2's comment;
   same repeated "media frame" magic number, folded onto the same token. */
.scan-cam-frame{position:absolute;inset:14%;border-radius:var(--r2);border:2px solid rgba(255,255,255,.28);}
.scan-cam-laser{position:absolute;left:14%;right:14%;top:14%;height:2px;background:#94d227;box-shadow:0 0 14px #94d227;animation:scanLaser 2.1s ease-in-out infinite;}
@keyframes scanLaser{0%{transform:translateY(0);}50%{transform:translateY(300%);}100%{transform:translateY(0);}}
.scan-cam-ic{width:38px;height:38px;color:rgba(255,255,255,.22);}
.scan-cam-cap{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:var(--fs-label);color:rgba(255,255,255,.75);}
/* Same height + margin as .scan-cam (168px/12px) — the two tabs' content used to be sized off
   their own content (the camera box vs. this QR+caption block), so switching tabs resized the
   whole modal and visibly shifted the title bar/confirm button. Fixed height + flex-centered
   content keeps every OTHER part of the modal in the same position regardless of which tab is on. */
/* Reverted --r1 -> --r2 (2026-08-15, per Design DNA review "scan-mine ทางเลือก B") — kept as a
   deliberate exception this time around: the "my QR" placeholder can read as more prominent than
   the app's other dashed panels on purpose. */
.scan-mine{box-sizing:border-box;height:168px;border-radius:var(--r2);border:1px dashed var(--line-strong);background:var(--paper);padding:var(--sp-stack);text-align:center;margin-bottom:var(--sp-inline);display:flex;flex-direction:column;align-items:center;justify-content:center;}
/* 12px (2026-08-31, per corner-radius audit) — was 10px, a lone off-token value; unified with
   .scan-note/.ns-ic/the demo panel's .demo-sel, the audit's other small-radius outliers, onto one
   shared 12px instead of each drifting to its own number. */
.scan-mine-qr{width:96px;height:96px;margin:0 auto;border-radius:var(--r2);background:var(--white);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;color:var(--ink);}
/* 64px — a large placeholder icon (no real QR to show yet), one-off, no repeated value elsewhere
   to consolidate into a token. */
.scan-mine-qr svg{width:64px;height:64px;}
.scan-mine-cap{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.5;margin-top:var(--sp-inline);}
/* 12px (2026-08-31, per corner-radius audit) — was 11px, its own arbitrary value even though this
   is the 3rd inline-note component in the file (.hero-note uses --r1/8px, .redeem-note uses
   --r2/16px); rather than force it onto one of those two, unified onto the same 12px the audit
   picked for .scan-mine-qr/.ns-ic/.demo-sel — the other small-radius outliers on this same screen. */
.scan-note{display:flex;gap:var(--sp-list);align-items:flex-start;padding:var(--sp-list) var(--sp-inline);border-radius:var(--r2);background:color-mix(in srgb,var(--cyan) 8%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 25%,transparent);margin-bottom:var(--sp-stack);}
.scan-note svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--ink);flex:0 0 auto;margin-top:1px;}
.scan-note span{font-size:var(--fs-label);color:var(--ink);line-height:1.5;}
.scan-confirm{width:100%;}
.scan-demo-note{font-size:var(--fs-label);color:var(--muted);text-align:center;margin-top:var(--sp-list);}
/* ══ SHARE MODAL ══ social-share sheet for the persona card (opened by the Book page's share
   buttons). Restyled to match the OTHER system modals (.scan-modal/.scan-card) — centered card,
   close X inset in the card's own top-right corner, title+subtitle header — instead of the earlier
   bottom-sheet, so every overlay in the app now shares one family. Brand chips scroll horizontally;
   each opens the platform's own composer (nothing is auto-posted). */
.share-modal{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:22px;}
.share-modal.show{display:flex;}
.share-scrim{position:absolute;inset:0;background:rgba(17,19,24,.6);}
.share-sheet{position:relative;width:100%;max-width:340px;background:var(--white);border-radius:var(--r2);padding:var(--sp-card-pad-sm);box-shadow:var(--shadow-lg);}
.share-hd{padding-right:30px;margin-bottom:var(--sp-stack);}
.share-t{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);line-height:1.3;}
.share-x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--ink);border:none;cursor:pointer;}
.share-x svg{width:var(--ic-md);height:var(--ic-md);}
.share-sub{font-size:var(--fs-eyebrow);color:var(--muted);margin-top:2px;}
.share-row{display:flex;gap:var(--sp-stack);overflow-x:auto;padding-bottom:var(--sp-list);margin:var(--sp-inline) 0 var(--sp-stack);scrollbar-width:none;}
.share-row::-webkit-scrollbar{display:none;}
.share-opt{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:var(--sp-glue);background:none;border:none;cursor:pointer;font-family:var(--font);width:58px;}
.share-ic{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--white);}
.share-ic svg{width:var(--ic-lg);height:var(--ic-lg);}
.share-opt-lbl{font-size:var(--fs-label);color:var(--ink);font-weight:var(--w-head);text-align:center;line-height:1.2;}
.share-copy{display:flex;align-items:center;gap:var(--sp-inline);border:1px solid var(--line-soft);border-radius:var(--rpill);padding:6px 6px 6px var(--sp-stack);}
.share-copy-url{flex:1;min-width:0;font-size:var(--fs-eyebrow);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.share-copy-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:var(--sp-stack-tight);background:var(--ink);color:var(--cloud);border:none;font-family:var(--font);font-weight:var(--w-head);font-size:var(--fs-label);padding:var(--sp-list) var(--sp-stack);border-radius:var(--rpill);cursor:pointer;}
.share-copy-btn svg{width:var(--ic-sm);height:var(--ic-sm);}
.rt-row{display:flex;gap:var(--sp-inline);align-items:stretch;}
/* margin uses calc() to negate --sp-list, not a bare "-var(...)" prefix — that's invalid CSS (a
   custom property can't be negated by string-prefixing a minus sign), which silently drops the
   WHOLE margin shorthand to 0 at compute time. That was a real, shipped bug: padding still pushed
   this row's icon+text 9px right of every other step's, with no compensating negative margin to
   pull it back — found 2026-08-20 chasing a user report that this row's content wasn't left-aligned
   with its siblings (confirmed live via getBoundingClientRect: this row's rail/body sat ~9px right
   of the others; getComputedStyle showed marginLeft resolving to 0px despite the -var() rule). */
.rt-row.top{background:var(--active-wash);border-radius:var(--r1);padding:6px var(--sp-list);margin:0 calc(var(--sp-list) * -1);}
.rt-rail{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;}
.rt-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--white);flex:0 0 auto;}
.rt-dot svg{width:var(--ic-sm);height:var(--ic-sm);}
.rt-line{width:2px;flex:1;background:var(--line-soft);margin:2px 0;}
.rt-body{padding-bottom:var(--sp-inline);min-width:0;}
/* weight bumped w-head->w-label (2026-08-28, per direction "รายการแต่ละ zone text title...text
   weight 700") — was 500, same step-up .klib-t/.bt-t already went through for their own list-row
   titles (see .klib-t's own comment above). */
.rt-name{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.35;display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-glue);}
/* radius moved off --r0 (6px, visibly squarer than every sibling badge) onto --rpill — with
   padding now matching the rest of this family too, the old squarer corner would have stood out
   MORE, not less, once it was the only thing left different. */
.rt-badge{font-size:var(--fs-label);font-weight:var(--w-label);padding:4px var(--sp-inline);border-radius:var(--rpill);white-space:nowrap;}
.rt-badge.pick{color:var(--white);background:var(--violet);}
.rt-badge.feat{color:var(--amber-text);background:var(--amber-bg);}
.rt-badge.new{color:var(--violet);background:var(--active-fill);}
.rt-meta{font-size:var(--fs-eyebrow);color:var(--muted);margin-top:2px;}
/* zone activity */
/* "วิธีเล่น" modal — same family as .scan-modal/.share-modal (see those for the shared pattern
   rationale). Replaced the old .zone-howto inline max-height expand (2026-08-16). */
.howto-modal{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:22px;}
.howto-modal.show{display:flex;}
.howto-scrim{position:absolute;inset:0;background:rgba(17,19,24,.6);}
.howto-card{position:relative;width:100%;max-width:360px;background:var(--white);border-radius:var(--r2);padding:var(--sp-card-pad-sm);box-shadow:var(--shadow-lg);}
.howto-x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--ink);border:none;cursor:pointer;}
.howto-x svg{width:var(--ic-md);height:var(--ic-md);}
.howto-hd{padding-right:30px;margin-bottom:var(--sp-stack);}
.howto-t{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);line-height:1.3;}
.howto-s{font-size:var(--fs-eyebrow);color:var(--muted);margin-top:2px;}
.zh-in{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r1);padding:var(--sp-stack) var(--sp-inline);}
.zh-li{display:flex;gap:var(--sp-list);font-size:var(--fs-bodysm);color:var(--ink);line-height:1.5;margin-bottom:var(--sp-list);}
.zh-li b{font-weight:var(--w-label);}
.zh-note{font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);line-height:1.5;padding-top:var(--sp-list);border-top:1px solid var(--line-soft);}
.howto-btn{display:inline-flex;align-items:center;gap:var(--sp-stack-tight);border:1px solid var(--line-soft);background:var(--white);color:var(--ink);font-family:var(--font);font-weight:var(--w-head);font-size:var(--fs-label);min-height:38px;padding:0 var(--sp-stack);border-radius:var(--rpill);cursor:pointer;flex:0 0 auto;}
.howto-btn svg{width:var(--ic-sm);height:var(--ic-sm);}
/* .bc-play — the asset card's main action, was sharing .howto-btn's plain white/outline look with
   secondary things like "วิธีเล่น"; bumped to a real primary (solid ink) state so it reads as THE
   thing to tap on that card. Already-played keeps the app's established cyan "done" tint instead
   of staying ink, so it visually steps back once its job is done. */
.bc-play{background:var(--ink);border-color:var(--ink);color:var(--cloud);}
.bc-play.played{background:var(--done-fill);border-color:var(--done-border);color:var(--ink);}
.booth-legend{display:flex;flex-wrap:wrap;gap:var(--sp-list) var(--sp-inline);margin:var(--sp-inline) 0 var(--sp-inline);font-size:var(--fs-eyebrow);color:var(--muted);}
.booth-legend span{display:inline-flex;align-items:center;gap:var(--sp-stack-tight);}
/* border-radius bumped 3px->4px (2026-08-31, per corner-radius audit) — see .alloc-dot's comment. */
.lg-sw{width:10px;height:10px;border-radius:4px;flex:0 0 auto;}
.booth-grid{display:flex;flex-direction:column;gap:var(--sp-inline);}
.bc-card{border:1px solid var(--line-soft);border-radius:var(--r1);padding:var(--sp-card-pad-sm);background:var(--white);}
/* align-items:flex-start (2026-08-29, per direction "text title badge หรือ button alignment top") —
   same "row wraps to 2+ lines (the .bc-asset label + .bc-zchip badge can wrap, plus .bc-game below),
   so align-items:center was centering the trailing .bc-play button against the WHOLE block instead
   of just the title's own line" fix as .side-row/.klib-row got earlier. */
.bc-hd{display:flex;align-items:flex-start;gap:var(--sp-inline);}
/* Icon moved inline into .bc-asset-lbl (2026-08-26, per direction — "ไอคอนให้ alignment center กับ
   text title...เอาพื้นหลังสีเทาออก และ icon size, padding...เท่ากับ section อื่นๆ เช่น section
   ยังขาด") — was its own 36px badge (.bc-ic, gray --accent background) centered against the whole
   2-line .bc-tx block, same pattern .ds-h/.pass-ey/.bt-t/.redeem-t already moved away from. Now
   sized/gapped identically to .ds-h-ic (width:var(--ic-lg), gap:var(--sp-inline)) with no badge
   background, and .bc-game/.bc-partners indent under the title text via the same
   calc(var(--ic-lg) + var(--sp-inline)) margin-left .ds-s/.ds-chips use. */
.bc-tx{flex:1;min-width:0;}
/* Restructured (2026-08-29, per direction — screenshot showed "โภคภัณฑ์" wrapping to its own row
   flush left under the ICON instead of under "อสังหา/REIT"'s own text) — .bc-zchip used to be a
   flex-wrap sibling of .bc-asset-lbl (icon+text bundled as ONE item) inside .bc-asset, so a wrapped
   .bc-zchip fell back to .bc-asset's own flex-start edge (icon's x), same root cause the
   "เล่นแล้ว" pill got dropped for entirely back in 2026-08-26 (see the sides.forEach comment below)
   rather than fixed at the alignment level. Now the icon is .bc-asset's OWN first flex item (not
   nested inside .bc-asset-lbl), and .bc-asset-lbl is the flex-wrap row of [title, .bc-zchip] — so
   a wrapped .bc-zchip wraps inside .bc-asset-lbl's own box, which starts right after the icon, and
   lines up under the title on both rows regardless of wrap. align-items:flex-start (was center) so
   the icon top-aligns with the title's first line even when .bc-asset-lbl grows to 2 rows. */
.bc-asset{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);display:flex;align-items:flex-start;gap:var(--sp-inline);}
.bc-asset-lbl{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-glue);flex:1;min-width:0;}
.bc-asset-ic{width:var(--ic-lg);height:auto;flex:0 0 auto;}
.bc-zchip{font-size:var(--fs-label);font-weight:var(--w-head);padding:4px var(--sp-inline);border-radius:var(--rpill);white-space:nowrap;}
.bc-game{font-size:var(--fs-eyebrow);color:var(--muted);margin-top:2px;margin-left:calc(var(--ic-lg) + var(--sp-inline));}
.bc-partners{display:flex;flex-wrap:wrap;gap:var(--sp-glue);margin-top:var(--sp-inline);margin-left:calc(var(--ic-lg) + var(--sp-inline));}
.bp-btn{display:inline-flex;align-items:center;gap:var(--sp-glue);border:1px solid var(--line-soft);background:var(--white);color:var(--ink);font-family:var(--font);font-size:var(--fs-eyebrow);font-weight:var(--w-head);min-height:36px;padding:0 var(--sp-inline);border-radius:var(--r1);cursor:pointer;transition:background .15s,border-color .15s,transform .15s var(--ease);}
.bp-btn svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
/* press/hover feedback (2026-08-29, per direction "ให้มี button interaction") — same idiom as
   .mp-zoom/.ag-more: a press-scale everyone gets, a desktop-only hover tint since a touch kiosk has
   no hover to give (see .mp-zoom's own comment for why that's the safer default). */
.bp-btn:active{transform:scale(.96);}
@media(hover:hover) and (pointer:fine){.bp-btn:not(.done):hover{background:var(--cloud);}}
.bp-btn.done{background:var(--done-fill);border-color:var(--done-border);color:var(--ink);}

/* ══ GAMES TAB ══ the source's "คู่มือ 6 ด้านของคุณ" — 6 mini-games, each fills one Playbook side.
   Ported from Playbook Final's Games screen + sideResult() narratives, re-skinned to our DNA. */
.gh-sub{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.45;margin:-6px 0 2px;}
/* Progress hero and "play next" highlight now REUSE Home's own system cards instead of bespoke
   dark-donut/spectrum-border treatments — .pass-card (บัตรของคุณ) for the progress status, and
   .next-step (ขั้นต่อไป) for the one next action, both defined near line ~670-703. This also fixes
   the old pie-chart's cramped center-number legibility complaint by dropping the chart entirely —
   the pass-card's plain "เปิดแล้ว X จาก 6 ด้าน" text carries the same info without a chart at all. */
.gh-restlbl{font-size:var(--fs-eyebrow);font-weight:var(--w-head);letter-spacing:.06em;color:var(--muted);margin:var(--sp-stack) 0 var(--sp-list);text-transform:uppercase;}
/* game list rows */
.game-list{display:flex;flex-direction:column;gap:var(--sp-inline);}
.game-row{border:1px solid var(--line-soft);border-radius:var(--r2);background:var(--white);overflow:hidden;transition:border-color .15s;}
.game-row.played{border-color:var(--done-border);background:var(--done-wash);}
/* align-items:flex-start (was center, 2026-08-28, per direction "icon และ button alignment top กับ
   title text") — center-alignment read fine on a single short line, but once a title wraps to 2
   lines (e.g. "ภูมิคุ้มกันความกลัวตกขบวน") or a status line sits under it, the icon/play-button
   floated in the row's vertical middle instead of lining up with the title's own first line. */
.gr-hd{display:flex;align-items:flex-start;gap:var(--sp-inline);padding:var(--sp-card-pad-sm);}
.gr-ic{width:38px;height:38px;flex:0 0 auto;border-radius:var(--r1);background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--muted);}
.game-row.played .gr-ic{background:var(--done-fill);color:var(--ink);}
.gr-ic svg{width:var(--ic-md);height:var(--ic-md);}
.gr-tx{flex:1;min-width:0;cursor:pointer;}
/* .gr-play is .btn.btn-primary now (was .howto-btn) — a real primary action, not a quiet ghost
   button, per direction. .btn-primary's own flex:1 is for CTAs that stand alone on their own row
   (route-cta-w, consent-btn); here it sits beside .gr-tx (also flex:1) in a compact row, so it's
   overridden back to content-width like the old .howto-btn was, keeping the row's flush-right look. */
.gr-hd .btn-primary{flex:0 0 auto;min-height:38px;padding:0 var(--sp-stack);font-size:var(--fs-label);}
/* font-size/weight now match Booth's "กิจกรรมประจำโซน" asset title (.bc-asset — fs-bodysm/w-label,
   2026-08-28, per direction "text size และ text weight อ้างอิงให้เท่ากับ...หุ้นไทย") — was fs-sub/
   w-head, a size step up and a lighter weight than that reference. */
.gr-title{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.35;display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-glue);}
/* Solid fill, not a tint — a 16%-tint chip on a row that's ALSO 5%-cyan-tinted (.game-row.played)
   just blended into its own background instead of reading as a distinct status. */
.gr-played{display:inline-flex;align-items:center;gap:var(--sp-stack-tight);font-size:var(--fs-label);font-weight:var(--w-head);color:var(--ink);background:var(--cyan);padding:4px var(--sp-inline);border-radius:var(--rpill);}
.gr-played svg{width:var(--ic-sm);height:var(--ic-sm);}
.gr-status{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.4;margin-top:2px;}
.gr-chev{width:20px;height:20px;color:var(--muted);flex-shrink:0;cursor:pointer;transition:transform .2s var(--ease);}
.gr-chev.open{transform:rotate(180deg);}
/* Now the SAME max-height CSS-transition mechanism as .side-body (2026-08-15, per Component
   System review "ใช้กลไกให้เหมือนกัน") — this used to be a conditionally-concatenated body that
   only existed in the DOM while open, toggled via a full renderGames() re-render, so it snapped
   open/closed with no animation, unlike .side-row's smooth version. Body markup is now always
   present (once played) and just collapsed via max-height:0; togGame() below toggles classes
   directly instead of re-rendering. Padding moves onto the inner .gr-bin wrapper — the outer
   element can't carry padding itself or it'd peek through at max-height:0. */
.gr-body{max-height:0;overflow:hidden;transition:max-height .28s var(--ease);}
.gr-body.show{max-height:400px;}
/* Reverted --line-strong -> --line-soft (2026-08-15, per Design DNA review "gr-bin ทางเลือก B") —
   kept as a deliberate exception this time: this divider isn't really a "locked" state, just an
   unopened game result, and reads better lighter than the app's other dashed panels. */
.gr-bin{border-top:1px dashed var(--line-soft);padding:var(--sp-inline);}
.gr-from{font-size:var(--fs-eyebrow);color:var(--muted);margin-bottom:var(--sp-stack-tight);}
.gr-result{font-size:var(--fs-bodysm);font-weight:var(--w-head);color:var(--ink);line-height:1.6;}
.games-note{margin-top:var(--sp-inline);display:flex;align-items:center;gap:var(--sp-glue);font-size:var(--fs-eyebrow);color:var(--muted);}
.games-note svg{width:var(--ic-sm);height:var(--ic-sm);}

/* ══ PROFILE TAB ══ ported from Playbook Final's Profile screen (identity + QR + info rows + footer
   disclaimer), re-skinned to our DNA. Data (userName/userOrg/profileRows/footer) verbatim.
   Avatar motion (2026-08-19, per Info-Card interaction DNA, scoped down per direction "interaction
   และ motion ใช้แค่กับ avatar"): the PHOTO is the one element that moves — a quiet pop-in on mount
   (profPop) plus, as of 2026-08-20, the same hover/active zoom .home-hero.v3 uses (see .prof-av img's
   own rule below and the shared hover:hover block's :hover/:active sections above) — supersedes the
   original "ไม่ต้องมี hover behavior" call, which only ever meant "not the whole card," not "never the
   photo." Name/org/chips/QR still render at rest, no stagger, no hover state anywhere else on the
   card. Covered by the file's single global prefers-reduced-motion reset (animation/transition:none
   !important) — since both profPop and the zoom only ever move OPACITY+TRANSFORM, disabling it just
   leaves the photo at its normal, fully visible resting size/scale. */
.prof-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-card-pad);text-align:center;}
/* Real photo (PROFILE_PHOTO, base64 JPEG embedded near LOGO_IMG) fills the circle — object-fit:cover
   so a square source crops to the circle without distortion; overflow:hidden on the circle itself
   (not just the img) keeps both the pop-in scale animation and the hover/active zoom below from ever
   poking a square corner outside the round mask. */
.prof-av{width:66px;height:66px;margin:0 auto var(--sp-list);border-radius:50%;overflow:hidden;background:var(--accent);animation:profPop .36s var(--ease) both;}
.prof-av img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.16,1,.3,1);}
.prof-name{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--ink);}
.prof-org{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.45;margin-top:2px;}
.prof-chips{display:flex;flex-wrap:wrap;gap:var(--sp-glue);justify-content:center;margin-top:var(--sp-inline);}
@keyframes profPop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.prof-vf{display:inline-flex;align-items:center;gap:var(--sp-stack-tight);padding:4px var(--sp-inline);border-radius:var(--rpill);background:var(--done-fill);color:var(--ink);font-size:var(--fs-eyebrow);font-weight:var(--w-head);}
.prof-vf svg{width:var(--ic-sm);height:var(--ic-sm);}
/* Gold, not ink-black — a tier badge (crown icon, paid-tier name) reads as a status label better
   in a premium gold than in the same flat ink-black used for plain UI chrome elsewhere on this
   page. Light tone, matching Home's pass-card icon + the route page's sponsor chip (--amber-*) —
   one gold across the app, not a separate darker one just for this badge. */
.prof-tier{display:inline-flex;align-items:center;gap:var(--sp-stack-tight);padding:4px var(--sp-inline);border-radius:var(--rpill);background:var(--amber-bg);color:var(--amber-text);font-size:var(--fs-eyebrow);font-weight:var(--w-head);}
.prof-tier svg{width:var(--ic-sm);height:var(--ic-sm);}
/* display:inline-block added (2026-09-02, per direction — dashed background read as way too wide
   left/right on tablet) — same root cause as the earlier "ร่วมสนุกและปลดล็อก" panel fix: as a plain
   block div, width:auto fills the FULL width of .prof-card (which has no flex/align-items of its own,
   just text-align:center) rather than shrinking to its content, so the dashed box stretched to the
   whole card while the 148px QR square + short note sat centered in the middle of it. inline-block
   shrinks it to its own content's width (still centered, via .prof-card's own text-align:center —
   inline-level boxes center that way, no margin:auto needed) — .pq-note's own max-width:300px ends up
   the effective cap on how wide this gets, so it now hugs the note text instead of the whole card. */
.prof-qr{margin-top:var(--sp-stack);padding:var(--sp-stack);border-radius:var(--r1);border:1px dashed var(--line-strong);background:var(--paper);display:inline-block;}
/* ink/700 (2026-08-16, per direction "section qr ประจำตัว title เป็นสีดำ text weight 700") — was a
   muted 500 eyebrow; it's the one label naming this block, so it reads as a real title now. */
.pq-lbl{font-size:var(--fs-eyebrow);font-weight:var(--w-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:var(--sp-list);}
.pq-box{width:148px;height:148px;margin:0 auto;border-radius:var(--r1);background:var(--white);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;color:var(--ink);}
/* 96px — the largest placeholder icon in the app (profile QR not generated yet), one-off, no
   repeated value elsewhere to consolidate into a token. */
.pq-box svg{width:96px;height:96px;}
.pq-note{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.5;margin:var(--sp-inline) auto 0;max-width:300px;}
/* "ประวัติการซื้อบัตร" (2026-09-02, multi-ticket demo only) reuses sidesHTML()'s "6 ด้านที่วัดได้จาก
   คุณ" list DNA verbatim (per direction "ใช้ design dna เดียวกับ section 6 ด้าน...") — .card/.sides-hd/
   .s-ey/.s-h/.s-sub for the header, .side-item/.side-row/.side-num/.side-cx/.side-t/.side-s/.side-r/.sc
   for each row. No new classes at all; see ticketHistoryHTML(). An earlier pass here built a bespoke
   .tkt-hist/.tkt-row/.tkt-ok set instead — deleted same day once the direction asked for the existing
   pattern, not a new one. */
.prof-rows{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-stack) var(--sp-card-pad);display:flex;flex-direction:column;gap:var(--sp-inline);}
.pr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-inline);font-size:var(--fs-bodysm);}
.pr-k{color:var(--muted);flex:0 0 auto;}
/* w-label/700 (2026-08-16, per direction "ข้อมูลผลลัพธ์ (ฝั่งขวา) text weight 700") — the values
   are the answer to each label on the left, so they carry the emphasis. */
.pr-v{color:var(--ink);font-weight:var(--w-label);text-align:right;min-width:0;line-height:1.5;}
.prof-foot{border-top:1px solid var(--line-soft);padding-top:var(--sp-stack);display:flex;flex-direction:column;gap:var(--sp-list);}
.pf-brand{font-size:var(--fs-bodysm);font-weight:var(--w-head);color:var(--ink);}
.pf-note{display:flex;align-items:flex-start;gap:var(--sp-glue);font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.6;}
.pf-note svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;margin-top:2px;}
/* ══ SPLASH / ATTRACT ══ two-tone headline · drifting brand assets · card carousel */
/* overflow-x only (never -y): the CTA must NEVER be unreachable. overflow:hidden on both axes
   used to CLIP (not scroll-hide) anything past the fold whenever content ran taller than the
   viewport — on short/awkward viewports that silently ate the caption and, worse, could eat the
   CTA itself. -x keeps the corner-bleed asset scatter from causing a horizontal scrollbar; -y left
   open means if content is ever taller than the screen the page just scrolls, never traps content. */
/* overflow-x:hidden -> clip (2026-08-15, real bug found while fixing .sp-cta's mobile sticky rule)
   — per spec, setting only ONE axis to 'hidden' silently promotes the OTHER axis from 'visible' to
   'auto' (both become scroll containers), which was interfering with .sp-cta's align-self:stretch
   + negative-margin bleed calculation and clipping it ~15px short of full width. 'clip' doesn't
   carry that same-axis promotion rule, so it contains the fan-card carousel / scatter assets the
   same way without the side effect. Confirmed via direct measurement: .sp-cta went from 413px to
   the correct 428px width with this one change, no other visual difference. */
.splash{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;padding:24px var(--sp-edge) var(--sp-card-pad-sm);overflow-x:clip;min-height:100vh;min-height:100dvh;}
.sp-scatter{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
/* depth-tiered scatter: near = bigger/sharper/stronger shadow/higher z · far = smaller/blurred/faint/behind. Parallax = near drifts more (--dx/--dy larger) */
.sp-el{position:absolute;width:var(--w,88px);opacity:var(--op,.85);z-index:var(--z,1);filter:drop-shadow(0 var(--sh,10px) var(--shb,22px) rgba(17,19,24,var(--sha,0.16))) blur(var(--bl,0px)) saturate(var(--sat,1));animation:spDrift var(--d,9s) var(--ease) infinite alternate;animation-delay:var(--dl,0s);will-change:transform;}
/* Each asset's --w is a fixed px size tuned for a wide canvas — on a narrow phone width the exact
   same px size eats a much bigger share of the screen, so the corners read as crowded instead of
   ambient. Scale every plane down together on narrow viewports; percentage top/left/right/bottom
   positions already scale with the container, only the fixed --w px size needed a mobile rule. */
/* First pass (0.62/0.85) still read as crowded — the FAR plane (gold/heart) adds the least
   (already the smallest/blurriest/faintest of the 3 depth planes) while sitting close enough to
   the headline to still register as clutter, so it's dropped entirely on mobile instead of just
   shrunk; MID/NEAR shrink further too. */
/* Second pass: shrinking alone still wasn't enough — measured the actual rendered boxes at 375px
   and two of the four remaining assets genuinely OVERLAP real content, not just each other:
   "card" sits 32px into the CTA button's own footprint (the CTA is nearly full-width on mobile,
   so almost no side margin exists at that height for anything to float beside it), and "bitcoin"
   nearly touches the NWNP hero logo (which is also close to full-width). Percentage positions
   tuned against a wide desktop canvas just don't leave the same margins once the layout narrows —
   no amount of shrinking fixes a position that's already inside the content's own box. Dropping
   "efin"/"card" on mobile (same precedent as the far plane above) and re-anchoring "candle" +
   "bitcoin" to the ONE band that actually has wide, genuine side margins on a narrow phone: level
   with .sp-sub, which measures ~73px of clear space on each side (vs. single-digit margins
   everywhere else content stacks near-full-width). */
@media(max-width:575px){
  .sp-el-far, .sp-el-efin, .sp-el-card{display:none;}
  /* Reverted from display:none (2026-08-15, "Asset scatter ยังไม่มาแสดง") — this environment's own
     common preview width (~375-575px) sits entirely inside this media query, so the previous
     "hide outright on mobile" call meant the scatter never actually rendered in the one width range
     it's most often checked at. Shrunk instead, same idea as .sp-el-mid/.sp-el-near above — still
     present, just small/faint enough to stay clear of the round-cards below. */
  .sp-el-mid{width:calc(var(--w,88px) * 0.42);opacity:calc(var(--op,.85) * 0.55);}
  .sp-el-near{width:calc(var(--w,88px) * 0.42);opacity:calc(var(--op,.85) * 0.65);}
  /* dy also capped here — candle's rest position sits only ~20px under the hero logo, so its
     original -16px upward drift (tuned for the old top:6% spot, which had a full screen of
     headroom above it) would have clipped back into the logo mid-animation even with the rest
     position fixed. Halved to -8px so the full oscillation stays clear. */
  .sp-el-candle{top:29%!important;left:3%!important;bottom:auto!important;right:auto!important;--dy:-8px!important;}
  .sp-el-bitcoin{top:28%!important;right:3%!important;left:auto!important;bottom:auto!important;}
}
@keyframes spDrift{from{transform:translate3d(0,0,0) rotate(var(--r0,0deg)) scale(var(--sc,1));}to{transform:translate3d(var(--dx,10px),var(--dy,-16px),0) rotate(var(--r1,6deg)) scale(var(--sc,1));}}
.sp-top{position:relative;z-index:2;text-align:center;width:100%;}
/* letter-spacing dropped (2026-08-28, per direction "เกมค้นหาตัวตนนักลงทุน...spacing...ให้เป็นค่า
   ปกติ") — 0.14em is a Latin-eyebrow-label tracking value; on this Thai line it just read as
   unusually gappy, not a deliberate label treatment (.sp-kick has exactly this one call site). */
/* font-size bumped fs-eyebrow(14px)->fs-body(22px) (2026-08-28, per direction "text size เท่ากับ
   'คู่มือลงทุนของคุณ' (หน้า 2)") — that reference is .consent-p b, which inherits its size from
   .consent-p's own fs-body (the <b> only overrides color/weight); weight already matched (both
   var(--w-label)) before this, size was the remaining gap. */
.sp-kick{font-family:var(--font);font-size:var(--fs-body);font-weight:var(--w-label);color:var(--muted);margin-bottom:var(--sp-stack);}
.sp-h{font-family:var(--serif);font-weight:var(--w-label);font-size:clamp(34px,12vw,50px);line-height:0.96;letter-spacing:-0.015em;text-wrap:balance;}
.sp-h .l1{display:block;color:var(--ink);}
.sp-h .l2{display:block;color:var(--muted);}
/* subtitle carries the "what am I here to do" message — kept prominent (ink, slightly larger) so it out-reads the decorative hero logo; the key phrase is bolded via <b> in render */
.sp-sub{font-size:var(--fs-sub);font-weight:var(--w-body);color:var(--ink);line-height:1.55;max-width:28ch;margin:var(--sp-inline) auto 0;}
.sp-sub b{font-weight:var(--w-label);}
.sp-stage{position:relative;z-index:2;flex:0 0 auto;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;margin:clamp(22px,5vh,46px) 0 0;}
/* fan carousel — adapted from a GSAP card-fan reference (rot/scale/x/y per slot, arc shape) into
   pure CSS transitions: all 12 real persona cards sit stacked at dead-center, each one's transform
   is recomputed every tick from its signed distance to the current center card, so cards smoothly
   glide along the SAME arc into/out of the 7 visible slots. Auto-plays forever, no action required. */
.fan-stage{position:relative;width:100%;height:clamp(250px,34vh,330px);}
.fan-card{--fw:172px;position:absolute;top:50%;left:50%;width:var(--fw);aspect-ratio:5/7;transition:transform 1s cubic-bezier(.22,1,.36,1),opacity .6s var(--ease);will-change:transform,opacity;pointer-events:none;}
:root[data-view="tablet"] .fan-card,:root[data-view="pc"] .fan-card{--fw:204px;}
/* .sp-preview-note ("พรีวิวการ์ดตัวตนนักลงทุน 12 แบบ") and .sp-cap (the PDPA acceptance line)
   removed entirely 2026-08-15, per direction. */
/* The ONE action on this screen that matters — was a styled .btn-primary, now the Liquid Metal CTA
   mounted into #cta-slot by mountSplashCTA() (see the script near renderSplash). The button sizes
   itself from its own measured label, so it's an inline-block — text-align:center here (inherited
   down through the plain #cta-slot div) centers it instead of stretching it full-width. */
.sp-cta{position:relative;z-index:2;width:100%;margin-top:auto;padding-top:24px;text-align:center;}
#cta-slot{min-height:56px;}
/* Fixed to the bottom on mobile (2026-08-15, per direction "ให้ cta ฟิ๊ก bottom (ตำแหน่งเดียวกับ
   button ในหน้าแบบทดสอบ)") — same technique as .q-nav/.consent-btn's mobile rules: margin-top:auto
   already parks it at the bottom of .splash's own flex column; position:sticky;bottom:0 then holds
   it at the visible viewport bottom instead of scrolling away with the rest of the content.
   align-self:stretch, not just width:auto — .splash sets align-items:center (like .consent), so
   width:auto alone just shrinks to content; see .consent-btn's comment for the full explanation. */
:root[data-view="mobile"] .sp-cta{position:sticky;bottom:0;z-index:6;width:auto;align-self:stretch;margin:auto calc(-1*var(--sp-edge)) 0;padding:24px var(--sp-edge) calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 45%,color-mix(in srgb,var(--paper) 50%,transparent) 75%,transparent);}
/* brand logos */
.sp-logo{display:block;height:24px;width:auto;margin:0 auto var(--sp-stack);opacity:.92;}
.sp-hero-logo{display:block;width:min(84%,420px);height:auto;margin:2px auto 0;}
.tb-logo{height:32px;width:auto;object-fit:contain;}
.hd-logo{cursor:pointer;}
.q-scroll{position:relative;z-index:1;}

/* ══ COLLECTIBLE PERSONA CARD ══ full-bleed dark art · overlays · flip back
   Ink-on-card scale (2026-08-12) — deliberately literal, not CSS vars: this is the card's own
   illustrated palette (same exception as its font sizes above), tuned per-role rather than reused
   across the app. Kept here as one documented list instead of scattered bare rgba() so it reads as
   an intentional 14-value scale, not drift: 0.05 dot-texture · 0.09/0.15 face shadow · 0.12 stat
   track fill · 0.13 inner frame hairline · 0.2 divider-chip border · 0.22 divider line / back frame ·
   0.28 rank-badge shadow · 0.30 glyph drop-shadow · 0.34 outer frame border · 0.40 secondary ink
   (spark icon, tag separator) · 0.5 borders/dividers (corner tick, medal spark, divider-chip text,
   bullet glyph) · 0.6 body ink (divider-chip label, back eyebrow/title/stat-label/legend) · 0.72
   back bullet-list body text. */
.pc3d{perspective:900px;width:100%;}
.pc-tilt{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .5s var(--ease);will-change:transform;}
.pc-flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s var(--ease);}
.pc3d.flipped .pc-flip{transform:rotateY(180deg);}
/* border-radius promoted 14px->var(--r2) (2026-08-31, per corner-radius audit) — see .cr2's comment;
   same repeated "media frame" magic number, folded onto the same token. */
.pc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r2);overflow:hidden;box-shadow:0 10px 30px rgba(17,19,24,0.15),0 2px 6px rgba(17,19,24,0.09);}
.pc-face.back{transform:rotateY(180deg);}
/* ══ EDITORIAL CARD (front) ══ cream paper · ornate frame · roman numeral · iridescent hero · blue wedge. Always light (it's art — does not theme-switch). */
/* Editorial CSS poster (the 9 personas without approved final art) — restyled to match the
   approved real-card format now in use for Diamond Hand/Wave Rider (plain paper, no ornate
   frame/corner-brackets/roman-numeral badge/blue wedge): serif title top-center, art in the
   middle, Thai name+description bottom-left, asset tags as a bottom-right 2×2 grid, small
   edition-style numbering bottom-left. No real illustration exists for these 9 yet, so the
   middle art keeps the halo+glyph placeholder — everything AROUND it now matches the real cards. */
/* Rebuilt from absolute-positioned regions (name pinned top, art pinned by top%/height%, bottom
   info pinned by bottom px) to a real flex column, per direction ("cleaner, text shouldn't
   overlap the icon — currently cramped/tight"). The absolute version anchored the bottom-info
   block from the BOTTOM with no height limit, so a longer persona description grew UPWARD and
   could eat into the fixed 26%–72% art band above it — a real overlap risk that got worse the
   longer h.sig was. Flex column removes the possibility structurally: name/bottom-info each take
   exactly the height their own content needs (flex:0 0 auto), and the art region (flex:1 1 auto,
   min-height:0) simply absorbs whatever space is left — it shrinks instead of getting overlapped. */
.pcE{position:absolute;inset:0;background:#f4f1e9;color:#15171d;overflow:hidden;container-type:inline-size;display:flex;flex-direction:column;padding:20px var(--sp-stack) var(--sp-stack);}
.pcE-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#f4f1e9;}
.pcE::before{content:"";position:absolute;inset:0;opacity:.55;background-image:radial-gradient(rgba(17,19,24,0.05) 0.5px,transparent 0.6px);background-size:3px 3px;pointer-events:none;}
.pcE-name{flex:0 0 auto;text-align:center;position:relative;z-index:3;margin-bottom:var(--sp-glue);}
.pcE-en{font-family:var(--serif);font-weight:var(--w-label);font-size:var(--pc-fs-1);line-height:1.05;color:#15171d;letter-spacing:-0.01em;}
@supports(width:1cqw){.pcE-en{font-size:clamp(20px,10cqw,30px);}}
.pcE-art{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;z-index:1;}
/* Halo (a big conic-gradient CIRCLE FILL behind the icon) removed, and the glyph's solid-black
   color dropped to a quiet ink-tint stroke — per direction, this was the spectrum gradient being
   used as a background FILL, exactly what the DNA's own accent rule warns against ("spectrum
   reserved for rare accent moments, never a fill") and it was visually louder than the icon it
   sat behind. The spectrum now lives ONLY on the divider + sparkles below — a genuinely small
   accent instead of a big colorful block competing with the character glyph. Icon is now a plain
   quiet monochrome line drawing (the DNA's own "mid layer"), matching the app's default "light
   weight" body logic instead of standing out as a bold black shape. */
.pcE-glyph{position:relative;z-index:2;transition:transform .3s var(--ease);}
.pcE-glyph svg{width:64px;height:64px;color:rgba(17,19,24,0.45);stroke-width:1.2;}
/* ✦ sparkles carry the spectrum accent via the same background-clip:text technique used for
   .spec-label elsewhere in the file, instead of a flat muted color. */
.pcE-spk{position:absolute;z-index:2;font-size:var(--pc-fs-3);background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;}
/* Bottom info rebuilt as ONE centered column (name → description → asset tags → edition #) —
   was a left/right split (text vs. a 2×2 tag grid) per direction "ให้กลุ่ม text ทั้งหมด align
   กลาง". The hairline divider is now a short spectrum-gradient bar instead of a flat rgba line —
   the card's one deliberate accent moment, echoing the sparkles above it. */
.pcE-bot{flex:0 0 auto;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--sp-glue);padding-top:var(--sp-inline);}
/* border-radius bumped 2px->4px (2026-08-31, per corner-radius audit) — see .alloc-dot's comment;
   no visual change (a 2px-tall bar renders as a full pill at either radius), just consistency. */
.pcE-divider{width:52px;height:2px;border-radius:4px;background:var(--spectrum);}
.pcE-th2{font-family:var(--font);font-weight:var(--w-label);font-size:var(--pc-fs-2);color:#15171d;}
.pcE-def{font-family:var(--font);font-weight:var(--w-body);font-size:var(--pc-fs-3);line-height:1.45;color:rgba(17,19,24,0.6);max-width:34ch;}
.pcE-ed{font-family:var(--font);font-size:var(--pc-fs-5);color:rgba(17,19,24,0.4);}
.pcE-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;}
.pcE-tag{display:flex;align-items:center;gap:4px;font-family:var(--font);font-size:var(--pc-fs-5);color:rgba(17,19,24,0.75);white-space:nowrap;}
.pcE-tag i{font-style:normal;font-size:var(--pc-fs-5);background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;}
/* ══ EDITORIAL CARD (back — dossier) ══ */
.pcb{position:absolute;inset:0;background:#f4f1e9;color:#15171d;padding:20px 18px;display:flex;flex-direction:column;overflow-y:auto;}
/* border-radius promoted 9px->var(--r1) (2026-08-31, per corner-radius audit) — the decorative
   inset frame is its own category from the dot/bar group above (see .alloc-dot's comment); 8px is
   close enough to the old 9px to fold onto the real token instead of a bespoke number. */
.pcb::before{content:"";position:absolute;inset:9px;border:1px solid rgba(17,19,24,0.22);border-radius:var(--r1);pointer-events:none;}
.pcb-ey{font-family:var(--font);font-size:var(--pc-fs-4);letter-spacing:0.12em;text-transform:uppercase;color:rgba(17,19,24,0.5);}
.pcb-en{font-family:var(--serif);font-weight:var(--w-label);font-size:var(--pc-fs-1);color:#15171d;line-height:1.02;margin-top:3px;}
.pcb-th{font-size:var(--pc-fs-2);color:rgba(17,19,24,0.6);margin:2px 0 10px;}
.pcb-sec{margin-top:var(--sp-inline);}
